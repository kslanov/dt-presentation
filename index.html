document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\n\n<script src=\"8b6ca94d-f115-484e-aa3d-a54547ff1e25\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Цифровой двойник: ДНК<\u002Ftitle>\n<style>/* ==========================================================================\n   Комита — Colors\n   Основная палитра: Синий (технологичность, доверие, движение).\n   Нейтральные графит и сталь — опора системы: текст, интерфейсы, тёмные фоны.\n   Values transcribed verbatim from the brand book (1.3 Цвета).\n   ========================================================================== */\n\n:root {\n  /* ---- Primary named colors (1.3.1 Основная палитра) ------------------- */\n  --color-signal-blue: #006AFB;   /* Brand 500 · Pantone 285 C · CMYK 100/45/0/19 */\n  --color-graphite:     #030507;   /* Neutral 950 · Pantone Black 6 C */\n  --color-steel:        #4A596E;   /* Neutral 600 · Pantone 7545 C */\n\n  /* ---- Brand · Фирменный синий (1.3.2 Тональные шкалы) ----------------- */\n  --brand-50:  #EAF2FF;\n  --brand-100: #D6E5FF;\n  --brand-200: #ADC9FF;\n  --brand-300: #7EA9FF;\n  --brand-400: #4D88FF;\n  --brand-500: #006AFB;\n  --brand-600: #0057D1;\n  --brand-700: #012B9E;\n  --brand-800: #001F73;\n  --brand-900: #001552;\n  --brand-950: #000B2E;\n\n  /* ---- Neutral · Вторичный цвет для текстов --------------------------- */\n  --neutral-50:  #F7FAFD;\n  --neutral-100: #E9EEF5;\n  --neutral-200: #D7E0EC;\n  --neutral-300: #B8C5D6;\n  --neutral-400: #8FA0B5;\n  --neutral-500: #66768C;\n  --neutral-600: #4A596E;\n  --neutral-700: #324055;\n  --neutral-800: #1D2939;\n  --neutral-900: #0F1724;\n  --neutral-950: #030507;\n\n  /* ---- Акценты (accents) ---------------------------------------------- */\n  --accent-cyan:        #7FE7FF;   /* Cyan Light — hero accent */\n  --accent-cyan-deep:   #1CC8F2;\n  --accent-coral:       #FFC48A;   /* Coral Light */\n  --accent-coral-deep:  #FF7A59;\n  --accent-green:       #A7F3D0;   /* Green Light */\n  --accent-green-deep:  #12D494;\n\n  /* ---- Base ----------------------------------------------------------- */\n  --white: #FFFFFF;\n  --black: #000000;\n\n  /* =====================================================================\n     Semantic aliases — reach for these in product UI.\n     ===================================================================== */\n\n  /* Text */\n  --text-primary:   var(--color-graphite);   /* headings, body on light */\n  --text-secondary: var(--color-steel);      /* supporting copy */\n  --text-muted:     var(--neutral-400);      /* captions, meta, labels */\n  --text-brand:     var(--brand-500);        /* emphasis, links */\n  --text-inverse:   var(--white);            /* on dark / brand surfaces */\n  --text-on-dark-secondary: rgba(255,255,255,0.72);\n\n  /* Surfaces */\n  --surface-page:   var(--white);\n  --surface-subtle: var(--neutral-50);       /* cards, section wells */\n  --surface-muted:  var(--neutral-100);\n  --surface-brand:  var(--brand-500);\n  --surface-brand-strong: var(--brand-700);  /* deep-blue panels */\n  --surface-dark:   var(--color-graphite);   /* dark sections */\n  --surface-dark-blue: var(--brand-950);\n\n  /* Borders */\n  --border-subtle:  var(--neutral-200);\n  --border-default: var(--neutral-300);\n  --border-strong:  var(--color-graphite);\n  --border-on-dark: rgba(255,255,255,0.14);\n\n  /* Interactive (Signal Blue) */\n  --interactive:         var(--brand-500);\n  --interactive-hover:   var(--brand-600);\n  --interactive-active:  var(--brand-700);\n  --focus-ring:          var(--brand-400);\n\n  /* Status */\n  --status-success: var(--accent-green-deep);\n  --status-info:    var(--brand-500);\n  --status-warning: var(--accent-coral-deep);\n  --status-neutral: var(--neutral-300);\n}\n<\u002Fstyle>\n<style>/* ==========================================================================\n   Комита — Typography\n   Inter — основной шрифт бренда: технологичность, системность, читаемость.\n   Метрики набора: межбуквенный интервал уменьшен для плотного набора —\n   чем крупнее кегль, тем плотнее трекинг (display до -5%, подписи -1%).\n   ========================================================================== */\n\n:root {\n  /* ---- Families ------------------------------------------------------- */\n  --font-sans: \"Inter\", -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto,\n    \"Helvetica Neue\", Arial, sans-serif;\n  /* Legacy website chrome used Gilroy (commercial). Falls back to Inter —\n     swap to \"Gilroy\" here if you license and self-host it. */\n  --font-secondary: \"Inter\", -apple-system, BlinkMacSystemFont, \"Segoe UI\",\n    Roboto, \"Helvetica Neue\", Arial, sans-serif;\n\n  /* ---- Weights -------------------------------------------------------- */\n  --fw-light: 300;      /* @kind font */\n  --fw-regular: 400;    /* @kind font */\n  --fw-medium: 500;     /* @kind font */\n  --fw-semibold: 600;   /* @kind font */\n  --fw-bold: 700;       /* @kind font */\n\n  /* ---- Tracking (letter-spacing) — tightens as type grows ------------- */\n  --tracking-display: -0.05em;  /* @kind font */\n  --tracking-tight: -0.03em;    /* @kind font */\n  --tracking-snug: -0.02em;     /* @kind font */\n  --tracking-normal: -0.01em;   /* @kind font */\n  --tracking-label: 0.08em;     /* @kind font */\n\n  /* ---- Type scale (size) --------------------------------------------- */\n  --text-display-2xl: 88px; /* @kind font */\n  --text-display-xl: 64px;  /* @kind font */\n  --text-display: 46px;     /* @kind font */\n  --text-h1: 40px;          /* @kind font */\n  --text-h2: 32px;          /* @kind font */\n  --text-h3: 24px;          /* @kind font */\n  --text-h4: 22px;          /* @kind font */\n  --text-title: 18px;       /* @kind font */\n  --text-body-lg: 20px;     /* @kind font */\n  --text-body: 16px;        /* @kind font */\n  --text-body-sm: 14px;     /* @kind font */\n  --text-caption: 12px;     /* @kind font */\n  --text-overline: 11px;    /* @kind font */\n\n  /* ---- Line-height ---------------------------------------------------- */\n  --lh-display-2xl: 0.95; /* @kind font */\n  --lh-display-xl: 1;     /* @kind font */\n  --lh-display: 1;        /* @kind font */\n  --lh-h1: 1.05;          /* @kind font */\n  --lh-h2: 1.1;           /* @kind font */\n  --lh-h3: 1.2;           /* @kind font */\n  --lh-h4: 1.25;          /* @kind font */\n  --lh-title: 1.3;        /* @kind font */\n  --lh-body-lg: 1.5;      /* @kind font */\n  --lh-body: 1.55;        /* @kind font */\n  --lh-body-sm: 1.5;      /* @kind font */\n  --lh-caption: 1.4;      /* @kind font */\n  --lh-overline: 1;       /* @kind font */\n}\n\n/* ==========================================================================\n   Type utility classes — apply the scale directly.\n   ========================================================================== */\n\n.kom-display-2xl { font: var(--fw-medium) var(--text-display-2xl)/var(--lh-display-2xl) var(--font-sans); letter-spacing: var(--tracking-display); color: var(--text-primary); }\n.kom-display-xl  { font: var(--fw-medium) var(--text-display-xl)/var(--lh-display-xl) var(--font-sans); letter-spacing: var(--tracking-display); color: var(--text-primary); }\n.kom-display     { font: var(--fw-medium) var(--text-display)/var(--lh-display) var(--font-sans); letter-spacing: var(--tracking-tight); color: var(--text-primary); }\n.kom-h1 { font: var(--fw-medium) var(--text-h1)/var(--lh-h1) var(--font-sans); letter-spacing: var(--tracking-tight); color: var(--text-primary); }\n.kom-h2 { font: var(--fw-medium) var(--text-h2)/var(--lh-h2) var(--font-sans); letter-spacing: var(--tracking-tight); color: var(--text-primary); }\n.kom-h3 { font: var(--fw-semibold) var(--text-h3)/var(--lh-h3) var(--font-sans); letter-spacing: var(--tracking-snug); color: var(--text-primary); }\n.kom-h4 { font: var(--fw-semibold) var(--text-h4)/var(--lh-h4) var(--font-sans); letter-spacing: var(--tracking-snug); color: var(--text-primary); }\n.kom-title { font: var(--fw-semibold) var(--text-title)/var(--lh-title) var(--font-sans); letter-spacing: var(--tracking-snug); color: var(--text-primary); }\n.kom-body-lg { font: var(--fw-regular) var(--text-body-lg)/var(--lh-body-lg) var(--font-sans); letter-spacing: var(--tracking-normal); color: var(--text-secondary); }\n.kom-body { font: var(--fw-regular) var(--text-body)/var(--lh-body) var(--font-sans); letter-spacing: var(--tracking-normal); color: var(--text-secondary); }\n.kom-body-sm { font: var(--fw-regular) var(--text-body-sm)/var(--lh-body-sm) var(--font-sans); letter-spacing: var(--tracking-normal); color: var(--text-secondary); }\n.kom-caption { font: var(--fw-medium) var(--text-caption)/var(--lh-caption) var(--font-sans); letter-spacing: var(--tracking-normal); color: var(--text-muted); }\n.kom-overline { font: var(--fw-semibold) var(--text-overline)/var(--lh-overline) var(--font-sans); letter-spacing: var(--tracking-label); text-transform: uppercase; color: var(--text-brand); }\n<\u002Fstyle>\n<script src=\"3a2c7e5c-de92-4ed2-824d-a5b1190c2348\"><\u002Fscript>\n<style>\nhtml, body { margin: 0; padding: 0; background: #030507; color: #FFFFFF; font-family: var(--font-sans); -webkit-font-smoothing: antialiased; }\n* { box-sizing: border-box; }\nbutton { font-family: inherit; }\na { color: #7FE7FF; text-decoration: none; }\na:hover { color: #ADC9FF; }\n::selection { background: rgba(0,106,251,0.45); color: #fff; }\n::-webkit-scrollbar { width: 10px; height: 10px; }\n::-webkit-scrollbar-track { background: transparent; }\n::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.14); border-radius: 100px; }\n@media (prefers-reduced-motion: reduce) { * { transition-duration: 1ms !important; animation-duration: 1ms !important; } }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"position:fixed;inset:0;display:flex;flex-direction:column;background:#030507;color:#fff;font-family:var(--font-sans);overflow:hidden\">\n\n  <header style=\"flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:12px 26px;border-bottom:1px solid rgba(255,255,255,0.10);background:rgba(3,5,7,0.9);z-index:6\">\n    <div style=\"display:flex;align-items:center;gap:12px;min-width:0\">\n      <div style=\"width:22px;height:22px;border-radius:100px;background:radial-gradient(circle at 32% 30%, #7FE7FF 0%, #006AFB 55%, #001F73 100%);flex:0 0 auto\"><\u002Fdiv>\n      <span style=\"font:600 13px/1.2 var(--font-sans);letter-spacing:-0.01em;color:#fff;white-space:nowrap\">Цифровой двойник: ДНК<\u002Fspan>\n      <span style=\"font:400 12px/1.2 var(--font-sans);color:rgba(255,255,255,0.38);white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ actLabel }}<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:12px\">\n      <span style=\"font:400 12px/1.3 var(--font-sans);color:rgba(255,255,255,0.34);white-space:nowrap\">{{ deepHint }}<\u002Fspan>\n      <button type=\"button\" sc-camel-on-click=\"{{ toggleDeep }}\" style=\"display:flex;align-items:center;gap:10px;padding:6px 8px 6px 16px;border-radius:100px;cursor:pointer;transition:background 140ms cubic-bezier(.22,.61,.36,1);border:1px solid {{ deepBd }};background:{{ deepBg }};color:#fff;font:600 12px/1 var(--font-sans)\">\n        Подробно\n        <span style=\"width:34px;height:18px;border-radius:100px;position:relative;display:inline-block;transition:background 140ms cubic-bezier(.22,.61,.36,1);background:{{ knobTrack }}\">\n          <span style=\"position:absolute;top:2px;width:14px;height:14px;border-radius:100px;background:#fff;transition:left 140ms cubic-bezier(.22,.61,.36,1);left:{{ knobLeft }}\"><\u002Fspan>\n        <\u002Fspan>\n      <\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <div style=\"flex:1 1 auto;position:relative;overflow:hidden\">\n    <div style=\"display:flex;height:100%;width:100%;will-change:transform;transition:transform 380ms cubic-bezier(.22,.61,.36,1);transform:translateX({{ trackShift }})\">\n\n      <!-- 0 · Обложка -->\n      <section data-screen-label=\"00 Обложка\" style=\"flex:0 0 100%;height:100%;overflow-y:auto;overflow-x:hidden;position:relative\">\n        <div style=\"position:relative;max-width:1240px;margin:0 auto;padding:clamp(26px,4vw,64px);min-height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,0.9fr);gap:clamp(24px,4vw,56px);align-items:center\">\n          <div>\n            <div style=\"font:600 clamp(13px,1.5vw,18px)/1 var(--font-sans);letter-spacing:0.14em;color:#7FE7FF;margin-bottom:26px\">ЦИФРОВОЙ ДВОЙНИК<\u002Fdiv>\n            <h1 style=\"margin:0;font:500 clamp(34px,4.6vw,66px)/1.02 var(--font-sans);letter-spacing:-0.05em;color:#fff;text-wrap:pretty\">Второй ты: локальный, приватный, твоим стилем<\u002Fh1>\n            <p style=\"margin:26px 0 0;font:400 clamp(16px,1.5vw,22px)/1.45 var(--font-sans);letter-spacing:-0.02em;color:rgba(255,255,255,0.62)\">Инструкция по экспрессии ДНК<\u002Fp>\n            <div style=\"margin-top:44px;display:flex;align-items:center;gap:18px;flex-wrap:wrap\">\n              <button type=\"button\" sc-camel-on-click=\"{{ next }}\" style=\"padding:14px 26px;border:0;border-radius:100px;background:#006AFB;color:#fff;cursor:pointer;font:600 14px/1 var(--font-sans);letter-spacing:0.02em;box-shadow:0 12px 32px rgba(0,106,251,0.24)\">Начать<\u002Fbutton>\n              <span style=\"font:400 13px/1.4 var(--font-sans);color:rgba(255,255,255,0.34)\">30-40 минут · стрелки ← → · спираль внизу - оглавление<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"margin-top:56px;font:400 13px/1.4 var(--font-sans);color:rgba(255,255,255,0.34)\">{{ contact }} · 2026<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"height:min(70vh,660px);position:relative\">\n            <canvas ref=\"{{ helixRef }}\" style=\"width:100%;height:100%;display:block\"><\u002Fcanvas>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- 1 · Знакомая картина -->\n      <section data-screen-label=\"01 Знакомая картина\" style=\"flex:0 0 100%;height:100%;overflow-y:auto;overflow-x:hidden\">\n        <div style=\"max-width:1240px;margin:0 auto;padding:clamp(24px,3.2vh,44px) clamp(26px,4vw,64px) 72px\">\n          <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:#7FE7FF;margin-bottom:14px\">Акт I · Зачем · глава 1<\u002Fdiv>\n          <h2 style=\"margin:0 0 26px;font:500 clamp(28px,3.4vw,48px)/1.07 var(--font-sans);letter-spacing:-0.03em;color:#fff\">Куда уходит день<\u002Fh2>\n\n          <div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:24px;align-items:start\">\n            <div style=\"display:flex;flex-direction:column;gap:10px\">\n              <sc-for list=\"{{ pains }}\" as=\"p\" hint-placeholder-count=\"4\">\n                <div style=\"display:flex;gap:14px;align-items:baseline;padding:16px 18px;border-radius:8px;transition:opacity 220ms cubic-bezier(.22,.61,.36,1),background 220ms cubic-bezier(.22,.61,.36,1);border-left:2px solid {{ p.rule }};background:{{ p.bg }};opacity:{{ p.op }}\">\n                  <span style=\"flex:0 0 auto;font:600 11px/1.4 var(--font-sans);color:rgba(255,255,255,0.30)\">{{ p.n }}<\u002Fspan>\n                  <span style=\"font:400 clamp(15px,1.25vw,18px)/1.45 var(--font-sans);color:rgba(255,255,255,0.86)\">{{ p.t }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <div style=\"margin-top:14px;padding:20px 22px;border-radius:8px;border:1px solid rgba(127,231,255,0.28);background:rgba(1,43,158,0.28)\">\n                <div style=\"font:500 clamp(18px,1.7vw,24px)/1.3 var(--font-sans);letter-spacing:-0.02em;color:#fff\">Инструментов много. Второго тебя среди них нет.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div>\n              <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.38);margin-bottom:14px\">Карта хаоса · наведи на источник<\u002Fdiv>\n              <div style=\"position:relative;height:clamp(300px,42vh,400px);border-radius:8px;border:1px solid rgba(255,255,255,0.10);background:radial-gradient(circle at 50% 50%, rgba(0,106,251,0.10) 0%, rgba(3,5,7,0) 62%)\">\n                <div style=\"position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:96px;height:96px;border-radius:100px;border:1px solid rgba(127,231,255,0.4);background:rgba(1,43,158,0.35);display:flex;align-items:center;justify-content:center;text-align:center;font:600 12px/1.3 var(--font-sans);color:#fff\">ты<\u002Fdiv>\n                <sc-for list=\"{{ chaos }}\" as=\"c\" hint-placeholder-count=\"8\">\n                  <button type=\"button\" sc-camel-on-mouse-enter=\"{{ c.onEnter }}\" sc-camel-on-mouse-leave=\"{{ c.onLeave }}\" sc-camel-on-click=\"{{ c.onEnter }}\" style=\"position:absolute;transform:translate(-50%,-50%);padding:9px 14px;border-radius:100px;cursor:default;transition:background 140ms cubic-bezier(.22,.61,.36,1),color 140ms cubic-bezier(.22,.61,.36,1);white-space:nowrap;font:500 12px/1 var(--font-sans);left:{{ c.x }};top:{{ c.y }};border:1px solid {{ c.bd }};background:{{ c.bg }};color:{{ c.fg }}\">{{ c.name }}<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"margin-top:12px;padding:14px 16px;border-radius:8px;background:rgba(255,255,255,0.04);border-left:2px solid {{ chaosRule }};min-height:64px\">\n                <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.38);margin-bottom:8px\">{{ chaosTitle }}<\u002Fdiv>\n                <div style=\"font:400 14px/1.5 var(--font-sans);color:rgba(255,255,255,0.72)\">{{ chaosText }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ deep }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top:22px;padding:22px 24px;border-radius:8px;border:1px solid rgba(127,231,255,0.22);background:linear-gradient(180deg, rgba(1,43,158,0.30) 0%, rgba(15,23,36,0.6) 100%)\">\n              <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:#7FE7FF;margin-bottom:12px\">Подробно · цена вопроса<\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;font:400 14px/1.55 var(--font-sans);color:rgba(255,255,255,0.68)\">\n                <div><b style=\"color:#fff;font-weight:600\">Восстановление контекста.<\u002Fb> Каждое утро и каждая новая задача начинаются с того, что ты заново поднимаешь в голове, чем все закончилось в прошлый раз.<\u002Fdiv>\n                <div><b style=\"color:#fff;font-weight:600\">Поиск своих же материалов.<\u002Fb> Документ точно был - вопрос только в том, в какой из почт, папок или переписок.<\u002Fdiv>\n                <div><b style=\"color:#fff;font-weight:600\">Повторное объяснение.<\u002Fb> Одно и то же приходится рассказывать людям и инструментам снова и снова: это и есть переупаковка самого себя.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- 2 · Почему чат не решает -->\n      <section data-screen-label=\"02 Четыре пропасти\" style=\"flex:0 0 100%;height:100%;overflow-y:auto;overflow-x:hidden\">\n        <div style=\"max-width:1240px;margin:0 auto;padding:clamp(24px,3.2vh,44px) clamp(26px,4vw,64px) 72px\">\n          <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:#7FE7FF;margin-bottom:14px\">Акт I · глава 2<\u002Fdiv>\n          <h2 style=\"margin:0 0 8px;font:500 clamp(28px,3.4vw,48px)/1.07 var(--font-sans);letter-spacing:-0.03em;color:#fff\">Четыре пропасти между чатом и «вторым тобой»<\u002Fh2>\n          <p style=\"margin:0 0 24px;font:400 clamp(14px,1.1vw,16px)/1.5 var(--font-sans);color:rgba(255,255,255,0.45)\">Наведи на пропасть - в спирали внизу подсветится ген, который ее закрывает.<\u002Fp>\n\n          <div style=\"display:grid;grid-template-columns:96px minmax(0,1fr) 96px;gap:18px;align-items:stretch\">\n            <div style=\"border-radius:8px;border:1px solid rgba(127,231,255,0.30);background:rgba(1,43,158,0.28);display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;transform:rotate(180deg);font:600 14px/1 var(--font-sans);letter-spacing:0.10em;color:#fff\">ТЫ<\u002Fdiv>\n\n            <div style=\"display:flex;flex-direction:column;gap:10px\">\n              <sc-for list=\"{{ gaps }}\" as=\"g\" hint-placeholder-count=\"4\">\n                <div sc-camel-on-mouse-enter=\"{{ g.onEnter }}\" sc-camel-on-mouse-leave=\"{{ g.onLeave }}\" style=\"display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr) minmax(0,150px);gap:18px;align-items:center;padding:14px 18px;border-radius:8px;transition:background 140ms cubic-bezier(.22,.61,.36,1);border:1px solid {{ g.bd }};background:{{ g.bg }}\">\n                  <div style=\"font:600 clamp(14px,1.2vw,17px)/1.2 var(--font-sans);letter-spacing:0.02em;color:#fff\">{{ g.title }}<\u002Fdiv>\n                  <div style=\"font:400 clamp(13px,1.05vw,15px)/1.45 var(--font-sans);color:rgba(255,255,255,0.66)\">{{ g.text }}<\u002Fdiv>\n                  <div style=\"position:relative;height:34px;display:flex;align-items:center\">\n                    <span style=\"position:absolute;left:0;right:0;top:50%;height:1px;background:repeating-linear-gradient(90deg, rgba(255,255,255,0.28) 0 6px, transparent 6px 12px)\"><\u002Fspan>\n                    <span style=\"position:relative;margin:0 auto;padding:5px 12px;border-radius:100px;white-space:nowrap;font:600 10px/1 var(--font-sans);letter-spacing:0.08em;transition:background 140ms cubic-bezier(.22,.61,.36,1);border:1px solid {{ g.chipBd }};background:{{ g.chipBg }};color:{{ g.chipFg }}\">{{ g.gene }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n\n            <div style=\"border-radius:8px;border:1px dashed rgba(255,255,255,0.20);background:rgba(255,255,255,0.02);display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;transform:rotate(180deg);font:600 14px/1 var(--font-sans);letter-spacing:0.10em;color:rgba(255,255,255,0.45)\">ЧАТ<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"margin-top:18px;padding:20px 22px;border-radius:8px;border:1px solid rgba(127,231,255,0.28);background:rgba(1,43,158,0.28)\">\n            <div style=\"font:500 clamp(18px,1.7vw,24px)/1.3 var(--font-sans);letter-spacing:-0.02em;color:#fff\">Каждая пропасть закрывается не промптом, а архитектурой.<\u002Fdiv>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ deep }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top:18px;padding:22px 24px;border-radius:8px;border:1px solid rgba(127,231,255,0.22);background:linear-gradient(180deg, rgba(1,43,158,0.30) 0%, rgba(15,23,36,0.6) 100%)\">\n              <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:#7FE7FF;margin-bottom:12px\">Подробно · почему это не чинится «хорошим промптом»<\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;font:400 14px/1.55 var(--font-sans);color:rgba(255,255,255,0.68)\">\n                <div><b style=\"color:#fff;font-weight:600\">Память.<\u002Fb> Контекстное окно конечно, а история - это годы. В окно не поместится ни переписка, ни архив документов; нужен отбор нужного под каждый вопрос.<\u002Fdiv>\n                <div><b style=\"color:#fff;font-weight:600\">Стиль.<\u002Fb> Стиль - это корпус образцов, а не инструкция «пиши деловито». Инструкцией задается регистр, голосом - только примерами.<\u002Fdiv>\n                <div><b style=\"color:#fff;font-weight:600\">Факты.<\u002Fb> Цифры требуют доступа к первоисточникам: к тем самым таблицам и документам, где они лежат, с возможностью проверить.<\u002Fdiv>\n                <div><b style=\"color:#fff;font-weight:600\">Действия.<\u002Fb> Действия требуют интеграций и права на запись во внешние системы - этого у чата нет по устройству.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- 3 · Софт, который принимает твою форму -->\n      <section data-screen-label=\"03 Третье поколение\" style=\"flex:0 0 100%;height:100%;overflow-y:auto;overflow-x:hidden\">\n        <div style=\"max-width:1240px;margin:0 auto;padding:clamp(24px,3.2vh,44px) clamp(26px,4vw,64px) 72px\">\n          <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:#7FE7FF;margin-bottom:14px\">Акт I · глава 3 · несущая<\u002Fdiv>\n          <h2 style=\"margin:0 0 8px;font:500 clamp(28px,3.4vw,48px)/1.07 var(--font-sans);letter-spacing:-0.03em;color:#fff\">Третье поколение программного обеспечения<\u002Fh2>\n          <p style=\"margin:0 0 20px;font:400 clamp(14px,1.1vw,16px)/1.5 var(--font-sans);color:rgba(255,255,255,0.45)\">Клик по ступени - кто под кого подстраивается.<\u002Fp>\n\n          <div style=\"display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,0.75fr);gap:18px;align-items:start\">\n            <div style=\"display:flex;flex-direction:column;gap:10px\">\n              <sc-for list=\"{{ generations }}\" as=\"g\" hint-placeholder-count=\"3\">\n                <button type=\"button\" sc-camel-on-click=\"{{ g.onClick }}\" style=\"display:grid;grid-template-columns:28px minmax(0,215px) minmax(0,1fr);gap:16px;align-items:center;width:100%;text-align:left;padding:16px 18px;border-radius:8px;cursor:pointer;transition:background 140ms cubic-bezier(.22,.61,.36,1);border:1px solid {{ g.bd }};background:{{ g.bg }};color:#fff\">\n                  <span style=\"font:500 20px/1 var(--font-sans);letter-spacing:-0.02em;color:{{ g.numFg }}\">{{ g.num }}<\u002Fspan>\n                  <span style=\"font:600 12px/1.2 var(--font-sans);letter-spacing:0.08em;color:#7FE7FF\">{{ g.n }}<\u002Fspan>\n                  <span style=\"font:400 clamp(13px,1.05vw,15px)/1.45 var(--font-sans);color:rgba(255,255,255,0.72)\">{{ g.t }}<\u002Fspan>\n                <\u002Fbutton>\n              <\u002Fsc-for>\n\n              <div style=\"padding:18px 20px;border-radius:8px;border:1px solid rgba(127,231,255,0.28);background:rgba(1,43,158,0.28)\">\n                <div style=\"font:400 clamp(15px,1.35vw,19px)/1.45 var(--font-sans);color:#fff;margin-bottom:12px\">Такой софт нельзя выдать готовым. Твоя форма есть только у тебя - значит, передать можно лишь ДНК: набор генов и правил, который развернется уже у тебя.<\u002Fdiv>\n                <div style=\"font:400 clamp(13px,1.1vw,15px)/1.5 var(--font-sans);color:rgba(255,255,255,0.62)\">Поэтому дальше - не инструкция по установке программы, а рассказ про геном. И про то, как он становится твоим.<\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"display:flex;flex-direction:column;gap:12px;align-items:flex-start\">\n                <button type=\"button\" sc-camel-on-click=\"{{ exSoft }}\" style=\"padding:9px 16px;border-radius:100px;cursor:pointer;font:600 12px/1 var(--font-sans);transition:background 140ms cubic-bezier(.22,.61,.36,1);border:1px solid {{ exSoftBd }};background:{{ exSoftBg }};color:#7FE7FF\">{{ exSoftLabel }}<\u002Fbutton>\n                <sc-if value=\"{{ exSoftOpen }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"width:100%;padding:18px 20px;border-radius:8px;border:1px solid rgba(127,231,255,0.30);border-left:3px solid #7FE7FF;background:rgba(127,231,255,0.06)\">\n                    <div style=\"font:600 10px/1 var(--font-sans);letter-spacing:0.10em;text-transform:uppercase;color:#7FE7FF;margin-bottom:10px\">Пример · как у автора<\u002Fdiv>\n                    <div style=\"font:400 14px/1.55 var(--font-sans);color:rgba(255,255,255,0.80)\">Я не проектировал двойника как программу - я отвечал на вопросы и смотрел, что получается. То, что выросло, невозможно скопировать другому: у него другая работа, другой стиль, другие инструменты. Копируется только геном.<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"display:flex;flex-direction:column;gap:12px\">\n              <div style=\"border-radius:8px;border:1px solid rgba(255,255,255,0.10);background:rgba(255,255,255,0.02);overflow:hidden\">\n                <div style=\"height:clamp(230px,33vh,310px)\">\n                  <canvas ref=\"{{ formRef }}\" style=\"width:100%;height:100%;display:block\"><\u002Fcanvas>\n                <\u002Fdiv>\n                <div style=\"padding:10px 14px;border-top:1px solid rgba(255,255,255,0.10);text-align:center;font:600 clamp(12px,1.05vw,14px)/1.3 var(--font-sans);letter-spacing:-0.01em;color:#7FE7FF\">{{ genCap }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"padding:14px 16px;border-radius:8px;background:rgba(255,255,255,0.04);border-left:2px solid #7FE7FF\">\n                <div style=\"font:400 14px/1.5 var(--font-sans);color:rgba(255,255,255,0.78)\">{{ genWho }}<\u002Fdiv>\n              <\u002Fdiv>\n              <sc-if value=\"{{ genIsThird }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"font:400 13px/1.45 var(--font-sans);color:#7FE7FF\">Контур человека переходит в спираль: это и есть ДНК, которую можно передать.<\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ deep }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top:16px;padding:22px 24px;border-radius:8px;border:1px solid rgba(127,231,255,0.22);background:linear-gradient(180deg, rgba(1,43,158,0.30) 0%, rgba(15,23,36,0.6) 100%)\">\n              <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:#7FE7FF;margin-bottom:12px\">Подробно · почему это стало возможно именно сейчас<\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;font:400 14px/1.55 var(--font-sans);color:rgba(255,255,255,0.68)\">\n                <div><b style=\"color:#fff;font-weight:600\">Порог возможностей пройден.<\u002Fb> Модели научились работать с большим неструктурированным контекстом и писать по образцу - до этого «принять форму» было нечем.<\u002Fdiv>\n                <div><b style=\"color:#fff;font-weight:600\">Принять форму ≠ настроиться.<\u002Fb> Настройка меняет параметры внутри чужой модели работы; экспрессия строит модель под тебя.<\u002Fdiv>\n                <div><b style=\"color:#fff;font-weight:600\">Следствие для доставки.<\u002Fb> Установка превращается в интервью, а «обновление продукта» - в рост генома.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- 4 · Что такое цифровой двойник -->\n      <section data-screen-label=\"04 Что такое двойник\" style=\"flex:0 0 100%;height:100%;overflow-y:auto;overflow-x:hidden\">\n        <div style=\"max-width:1240px;margin:0 auto;padding:clamp(24px,3.2vh,44px) clamp(26px,4vw,64px) 72px\">\n          <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:#7FE7FF;margin-bottom:14px\">Акт I · глава 4 · несущая<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,0.62fr);gap:clamp(20px,3vw,44px);align-items:start\">\n            <div>\n              <h2 style=\"margin:0 0 18px;font:500 clamp(28px,3.4vw,48px)/1.07 var(--font-sans);letter-spacing:-0.03em;color:#fff\">Второй ты - на твоем компьютере<\u002Fh2>\n              <p style=\"margin:0 0 22px;font:400 clamp(15px,1.35vw,19px)/1.5 var(--font-sans);color:rgba(255,255,255,0.82)\">Локальная система, которая помнит все, что ты накопил, пишет твоим стилем, не выдумывает факты и ведет твою операционку. Ты только подтверждаешь.<\u002Fp>\n\n              <div style=\"display:flex;flex-direction:column;gap:8px\">\n                <sc-for list=\"{{ genesList }}\" as=\"g\" hint-placeholder-count=\"5\">\n                  <button type=\"button\" sc-camel-on-click=\"{{ g.onClick }}\" style=\"display:grid;grid-template-columns:130px minmax(0,1fr);gap:18px;align-items:center;width:100%;text-align:left;padding:14px 18px;border-radius:8px;cursor:pointer;transition:background 140ms cubic-bezier(.22,.61,.36,1);border:1px solid {{ g.bd }};background:{{ g.bg }};color:#fff\">\n                    <span style=\"display:flex;align-items:center;gap:10px\">\n                      <span style=\"width:9px;height:9px;border-radius:100px;flex:0 0 auto;background:{{ g.dot }};box-shadow:{{ g.glow }}\"><\u002Fspan>\n                      <span style=\"font:600 12px/1 var(--font-sans);letter-spacing:0.08em;color:#fff\">{{ g.name }}<\u002Fspan>\n                    <\u002Fspan>\n                    <span style=\"font:400 clamp(13px,1.1vw,15px)/1.45 var(--font-sans);color:rgba(255,255,255,0.70)\">{{ g.short }}<\u002Fspan>\n                  <\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n\n              <div style=\"margin-top:12px;padding:16px 18px;border-radius:8px;background:rgba(255,255,255,0.04);border-left:2px solid #7FE7FF\">\n                <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:#7FE7FF;margin-bottom:8px\">{{ geneSel.name }}<\u002Fdiv>\n                <div style=\"font:400 15px/1.5 var(--font-sans);color:rgba(255,255,255,0.78)\">{{ geneSel.long }}<\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"margin-top:14px;padding:18px 20px;border-radius:8px;border:1px solid rgba(127,231,255,0.28);background:rgba(1,43,158,0.28)\">\n                <div style=\"font:400 clamp(15px,1.3vw,18px)/1.45 var(--font-sans);color:#fff\">Все лежит на твоем компьютере. Облако видит только то, что нужно для текущего ответа.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"display:flex;flex-direction:column;gap:14px\">\n              <div style=\"height:clamp(240px,34vh,340px);border-radius:8px;border:1px solid rgba(255,255,255,0.10);background:rgba(255,255,255,0.02);position:relative;overflow:hidden\">\n                <canvas ref=\"{{ genomeRef }}\" style=\"width:100%;height:100%;display:block\"><\u002Fcanvas>\n              <\u002Fdiv>\n\n              <button type=\"button\" sc-camel-on-click=\"{{ ex3 }}\" style=\"align-self:flex-start;padding:9px 16px;border-radius:100px;cursor:pointer;font:600 12px/1 var(--font-sans);transition:background 140ms cubic-bezier(.22,.61,.36,1);border:1px solid {{ ex3bd }};background:{{ ex3bg }};color:#7FE7FF\">{{ ex3label }}<\u002Fbutton>\n              <sc-if value=\"{{ ex3open }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"padding:18px 20px;border-radius:8px;border:1px solid rgba(127,231,255,0.30);border-left:3px solid #7FE7FF;background:rgba(127,231,255,0.06)\">\n                  <div style=\"font:600 10px/1 var(--font-sans);letter-spacing:0.10em;text-transform:uppercase;color:#7FE7FF;margin-bottom:10px\">Пример · как у автора<\u002Fdiv>\n                  <div style=\"font:400 14px/1.55 var(--font-sans);color:rgba(255,255,255,0.80)\">Мой двойник живет со мной с июня 2026: вся история с 2018 года, письма, сделки, доклады - 17,2 тыс. заметок в памяти, из них 5,7 тыс. почтовых тредов, и 2,9 тыс. фактов с адресом источника.<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n\n              <sc-if value=\"{{ deep }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"padding:18px 20px;border-radius:8px;border:1px solid rgba(127,231,255,0.22);background:linear-gradient(180deg, rgba(1,43,158,0.30) 0%, rgba(15,23,36,0.6) 100%)\">\n                  <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:#7FE7FF;margin-bottom:10px\">Подробно · анатомия одним абзацем<\u002Fdiv>\n                  <div style=\"font:400 14px/1.55 var(--font-sans);color:rgba(255,255,255,0.70)\">База знаний - обычные текстовые заметки на диске. Движок - код, который ищет по ним, поднимает факты из документов и собирает контекст. AI-модель - «мышление»: она получает готовый материал и пишет текст. Движок работает на твоей машине как служба и детерминированно собирает контекст, модель только формулирует. Разговаривать с двойником можно из любого AI-клиента - движок один.<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- 5 · Карта системы -->\n      <section data-screen-label=\"05 Карта системы\" style=\"flex:0 0 100%;height:100%;overflow-y:auto;overflow-x:hidden\">\n        <div style=\"max-width:1240px;margin:0 auto;padding:clamp(24px,3.2vh,44px) clamp(26px,4vw,64px) 72px\">\n          <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:#7FE7FF;margin-bottom:14px\">Акт I · глава 5<\u002Fdiv>\n          <h2 style=\"margin:0 0 8px;font:500 clamp(28px,3.4vw,48px)/1.07 var(--font-sans);letter-spacing:-0.03em;color:#fff\">Где это все живет<\u002Fh2>\n          <p style=\"margin:0 0 22px;font:400 clamp(14px,1.1vw,16px)/1.5 var(--font-sans);color:rgba(255,255,255,0.45)\">Наведи на зону - что в ней лежит; на стрелку - что по ней ходит.<\u002Fp>\n\n          <div style=\"display:grid;grid-template-columns:minmax(0,0.72fr) 108px minmax(0,1.25fr) 108px minmax(0,0.72fr);gap:0;align-items:stretch\">\n            <sc-for list=\"{{ zonesLeft }}\" as=\"z\" hint-placeholder-count=\"1\">\n              <div sc-camel-on-mouse-enter=\"{{ z.onEnter }}\" style=\"padding:22px 20px;border-radius:8px;transition:background 140ms cubic-bezier(.22,.61,.36,1);border:1px solid {{ z.bd }};background:{{ z.bg }}\">\n                <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;color:#7FE7FF;margin-bottom:14px\">{{ z.name }}<\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:9px\">\n                  <sc-for list=\"{{ z.items }}\" as=\"it\" hint-placeholder-count=\"3\">\n                    <div style=\"font:400 14px/1.4 var(--font-sans);color:rgba(255,255,255,0.72)\">{{ it }}<\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n\n            <div style=\"display:flex;flex-direction:column;justify-content:center;gap:14px;padding:0 8px\">\n              <sc-for list=\"{{ flowsLeft }}\" as=\"f\" hint-placeholder-count=\"2\">\n                <button type=\"button\" sc-camel-on-mouse-enter=\"{{ f.onEnter }}\" style=\"border:0;background:transparent;cursor:default;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px\">\n                  <span style=\"font:400 10px/1.2 var(--font-sans);text-align:center;color:{{ f.fg }}\">{{ f.label }}<\u002Fspan>\n                  <span style=\"width:100%;position:relative;height:{{ f.w }};border-radius:100px;background:{{ f.color }}\"><\u002Fspan>\n                  <span style=\"font:400 12px/1 var(--font-sans);color:{{ f.fg }}\">{{ f.dir }}<\u002Fspan>\n                <\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n\n            <sc-for list=\"{{ zoneCenter }}\" as=\"z\" hint-placeholder-count=\"1\">\n              <div sc-camel-on-mouse-enter=\"{{ z.onEnter }}\" style=\"padding:24px 22px;border-radius:8px;transition:background 140ms cubic-bezier(.22,.61,.36,1);border:1px solid {{ z.bd }};background:{{ z.bg }};position:relative;overflow:hidden\">\n                <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;color:#7FE7FF;margin-bottom:16px\">{{ z.name }}<\u002Fdiv>\n                <div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px\">\n                  <sc-for list=\"{{ z.items }}\" as=\"it\" hint-placeholder-count=\"4\">\n                    <div style=\"padding:12px 14px;border-radius:8px;border:1px solid rgba(255,255,255,0.10);background:rgba(255,255,255,0.04);font:500 14px/1.35 var(--font-sans);color:#fff\">{{ it }}<\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"margin-top:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap\">\n                  <span style=\"flex:1 1 40px;height:6px;border-radius:100px;background:linear-gradient(90deg, rgba(127,231,255,0.55) 0%, rgba(0,106,251,0.55) 100%)\"><\u002Fspan>\n                  <span style=\"flex:0 1 auto;min-width:0;font:400 11px/1.3 var(--font-sans);color:rgba(255,255,255,0.45)\">внутренняя циркуляция - основной поток<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n\n            <div style=\"display:flex;flex-direction:column;justify-content:center;gap:14px;padding:0 8px\">\n              <sc-for list=\"{{ flowsRight }}\" as=\"f\" hint-placeholder-count=\"2\">\n                <button type=\"button\" sc-camel-on-mouse-enter=\"{{ f.onEnter }}\" style=\"border:0;background:transparent;cursor:default;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px\">\n                  <span style=\"font:400 10px/1.2 var(--font-sans);text-align:center;color:{{ f.fg }}\">{{ f.label }}<\u002Fspan>\n                  <span style=\"width:100%;position:relative;height:{{ f.w }};border-radius:100px;background:{{ f.color }}\"><\u002Fspan>\n                  <span style=\"font:400 12px/1 var(--font-sans);color:{{ f.fg }}\">{{ f.dir }}<\u002Fspan>\n                <\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n\n            <sc-for list=\"{{ zonesRight }}\" as=\"z\" hint-placeholder-count=\"1\">\n              <div sc-camel-on-mouse-enter=\"{{ z.onEnter }}\" style=\"padding:22px 20px;border-radius:8px;transition:background 140ms cubic-bezier(.22,.61,.36,1);border:1px solid {{ z.bd }};background:{{ z.bg }}\">\n                <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;color:#7FE7FF;margin-bottom:14px\">{{ z.name }}<\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:9px\">\n                  <sc-for list=\"{{ z.items }}\" as=\"it\" hint-placeholder-count=\"2\">\n                    <div style=\"font:400 14px/1.4 var(--font-sans);color:rgba(255,255,255,0.72)\">{{ it }}<\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"margin-top:16px;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:stretch\">\n            <div style=\"padding:20px 22px;border-radius:8px;border:1px solid rgba(127,231,255,0.28);background:rgba(1,43,158,0.28)\">\n              <div style=\"font:500 clamp(17px,1.6vw,23px)/1.3 var(--font-sans);letter-spacing:-0.02em;color:#fff\">Центр тяжести - твой компьютер. Облако - калькулятор, а не хранилище.<\u002Fdiv>\n              <div style=\"margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,0.12);font:400 14px/1.5 var(--font-sans);color:rgba(255,255,255,0.70)\"><span style=\"color:#7FE7FF;font-weight:600\">{{ mapTitle }} · <\u002Fspan>{{ mapText }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:12px\">\n              <button type=\"button\" sc-camel-on-click=\"{{ ex4 }}\" style=\"align-self:flex-start;padding:9px 16px;border-radius:100px;cursor:pointer;font:600 12px/1 var(--font-sans);transition:background 140ms cubic-bezier(.22,.61,.36,1);border:1px solid {{ ex4bd }};background:{{ ex4bg }};color:#7FE7FF\">{{ ex4label }}<\u002Fbutton>\n              <sc-if value=\"{{ ex4open }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"padding:18px 20px;border-radius:8px;border:1px solid rgba(127,231,255,0.30);border-left:3px solid #7FE7FF;background:rgba(127,231,255,0.06)\">\n                  <div style=\"font:600 10px/1 var(--font-sans);letter-spacing:0.10em;text-transform:uppercase;color:#7FE7FF;margin-bottom:10px\">Пример · как у автора<\u002Fdiv>\n                  <div style=\"font:400 14px/1.55 var(--font-sans);color:rgba(255,255,255,0.80)\">У меня в контуре еще три рабочие системы - корпоративная CRM, мобильный задачник и почта. Они цепляются как «руки» (глава 10). И второй экземпляр двойника - на личных заметках (глава 11).<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ deep }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top:16px;padding:22px 24px;border-radius:8px;border:1px solid rgba(127,231,255,0.22);background:linear-gradient(180deg, rgba(1,43,158,0.30) 0%, rgba(15,23,36,0.6) 100%)\">\n              <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:#7FE7FF;margin-bottom:12px\">Подробно · что ходит по стрелкам и чего на схеме нет<\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:18px;font:400 13px/1.5 var(--font-sans);color:rgba(255,255,255,0.68)\">\n                <div><b style=\"color:#fff;font-weight:600\">Телефон → компьютер.<\u002Fb> Захваченное: заметка, голос, ссылка, фото документа.<\u002Fdiv>\n                <div><b style=\"color:#fff;font-weight:600\">Компьютер → облако.<\u002Fb> Вопрос и подобранный под него контекст - не база целиком.<\u002Fdiv>\n                <div><b style=\"color:#fff;font-weight:600\">Облако → компьютер.<\u002Fb> Только текст ответа; он сразу ложится в твой файл.<\u002Fdiv>\n                <div><b style=\"color:#fff;font-weight:600\">Компьютер ↔ телефон.<\u002Fb> Предложения на подтверждение и статусы обратно.<\u002Fdiv>\n                <div><b style=\"color:#fff;font-weight:600\">Чего здесь нет.<\u002Fb> Ничьих чужих серверов с твоей базой: она никуда не копируется.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- 6 · Разделитель Акт II -->\n      <section data-screen-label=\"06 Разделитель - Акт II\" style=\"flex:0 0 100%;height:100%;overflow-y:auto;overflow-x:hidden\">\n        <div style=\"max-width:1240px;margin:0 auto;padding:clamp(26px,4vw,64px);min-height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,0.8fr);gap:clamp(24px,4vw,56px);align-items:center\">\n          <div>\n            <div style=\"font:600 clamp(12px,1.3vw,15px)/1 var(--font-sans);letter-spacing:0.14em;color:#7FE7FF;margin-bottom:22px\">АКТ II · КАК С НИМ ЖИВУТ<\u002Fdiv>\n            <h2 style=\"margin:0;font:500 clamp(30px,4vw,56px)/1.04 var(--font-sans);letter-spacing:-0.04em;color:#fff\">День, кейсы и правила<\u002Fh2>\n            <p style=\"margin:22px 0 0;max-width:460px;font:400 clamp(14px,1.15vw,17px)/1.5 var(--font-sans);color:rgba(255,255,255,0.45)\">Пять генов проявились контуром. Дальше каждая глава зажигает свой.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"height:min(46vh,420px)\">\n            <canvas ref=\"{{ dividerRef }}\" style=\"width:100%;height:100%;display:block\"><\u002Fcanvas>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- 7 · День с двойником -->\n      <section data-screen-label=\"07 День с двойником\" style=\"flex:0 0 100%;height:100%;overflow-y:auto;overflow-x:hidden\">\n        <div style=\"max-width:1240px;margin:0 auto;padding:clamp(24px,3.2vh,44px) clamp(26px,4vw,64px) 72px\">\n          <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:#7FE7FF;margin-bottom:14px\">Акт II · глава 7<\u002Fdiv>\n          <h2 style=\"margin:0 0 8px;font:500 clamp(28px,3.4vw,48px)/1.07 var(--font-sans);letter-spacing:-0.03em;color:#fff\">День как процесс<\u002Fh2>\n          <p style=\"margin:0 0 22px;font:400 clamp(14px,1.1vw,16px)/1.5 var(--font-sans);color:rgba(255,255,255,0.45)\">Клик по точке дня - что произошло и кто это сделал.<\u002Fp>\n\n          <div style=\"position:relative;padding-top:6px;margin-bottom:16px\">\n            <div style=\"position:absolute;left:0;right:0;top:12px;height:1px;background:linear-gradient(90deg, rgba(127,231,255,0.10) 0%, rgba(127,231,255,0.45) 20%, rgba(127,231,255,0.45) 80%, rgba(127,231,255,0.10) 100%)\"><\u002Fdiv>\n            <div style=\"position:relative;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px\">\n              <sc-for list=\"{{ day }}\" as=\"d\" hint-placeholder-count=\"6\">\n                <button type=\"button\" sc-camel-on-click=\"{{ d.onClick }}\" style=\"display:flex;flex-direction:column;gap:12px;text-align:left;padding:0;border:0;background:transparent;cursor:pointer\">\n                  <span style=\"width:13px;height:13px;border-radius:100px;transition:background 140ms cubic-bezier(.22,.61,.36,1);background:{{ d.dot }};box-shadow:{{ d.glow }};border:2px solid #030507\"><\u002Fspan>\n                  <span style=\"display:flex;flex-direction:column;gap:8px;padding:16px 18px;border-radius:8px;transition:background 140ms cubic-bezier(.22,.61,.36,1);border:1px solid {{ d.bd }};background:{{ d.bg }}\">\n                    <span style=\"font:600 13px/1 var(--font-sans);letter-spacing:0.06em;color:#7FE7FF\">{{ d.time }}<\u002Fspan>\n                    <span style=\"font:400 clamp(13px,1.05vw,15px)/1.45 var(--font-sans);color:{{ d.fg }}\">{{ d.t }}<\u002Fspan>\n                  <\u002Fspan>\n                <\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start\">\n            <div style=\"padding:20px 22px;border-radius:8px;border:1px solid rgba(255,255,255,0.12);background:#0F1724\">\n              <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:#7FE7FF;margin-bottom:10px\">{{ daySel.time }} · кто это сделал<\u002Fdiv>\n              <div style=\"font:400 clamp(15px,1.25vw,17px)/1.5 var(--font-sans);color:rgba(255,255,255,0.82)\">{{ daySel.who }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"padding:20px 22px;border-radius:8px;border:1px solid rgba(127,231,255,0.28);background:rgba(1,43,158,0.28)\">\n              <div style=\"font:500 clamp(17px,1.55vw,22px)/1.3 var(--font-sans);letter-spacing:-0.02em;color:#fff\">Основной интерфейс - обычный диалог. Скажи словами.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ deep }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top:16px;padding:22px 24px;border-radius:8px;border:1px solid rgba(127,231,255,0.22);background:linear-gradient(180deg, rgba(1,43,158,0.30) 0%, rgba(15,23,36,0.6) 100%)\">\n              <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:#7FE7FF;margin-bottom:14px\">Подробно · главный цикл, к которому привязан каждый момент дня<\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px\">\n                <sc-for list=\"{{ cycle }}\" as=\"c\" hint-placeholder-count=\"6\">\n                  <div style=\"padding:14px 12px;border-radius:8px;text-align:center;transition:background 140ms cubic-bezier(.22,.61,.36,1);border:1px solid {{ c.bd }};background:{{ c.bg }};font:600 12px/1.2 var(--font-sans);letter-spacing:0.04em;color:{{ c.fg }}\">{{ c.n }}<\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"margin-top:12px;font:400 14px/1.55 var(--font-sans);color:rgba(255,255,255,0.66)\">Подсвечен этап, на котором находится выбранный момент дня. Память и операционка идут параллельно: знание уходит в память, задача - в операционку, и обе ветки сходятся на подтверждении. Вечером на пульте - карточки «требуют решения»: что двойник предложил за день, ты принимаешь или отклоняешь. Самопроверка - отдельная петля поверх цикла: она не двигает работу, а проверяет, что цикл исправен.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <div style=\"margin-top:16px;display:flex;flex-direction:column;gap:12px;align-items:flex-start\">\n            <button type=\"button\" sc-camel-on-click=\"{{ ex6 }}\" style=\"padding:9px 16px;border-radius:100px;cursor:pointer;font:600 12px/1 var(--font-sans);transition:background 140ms cubic-bezier(.22,.61,.36,1);border:1px solid {{ ex6bd }};background:{{ ex6bg }};color:#7FE7FF\">{{ ex6label }}<\u002Fbutton>\n            <sc-if value=\"{{ ex6open }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"width:100%;padding:18px 20px;border-radius:8px;border:1px solid rgba(127,231,255,0.30);border-left:3px solid #7FE7FF;background:rgba(127,231,255,0.06)\">\n                <div style=\"font:600 10px/1 var(--font-sans);letter-spacing:0.10em;text-transform:uppercase;color:#7FE7FF;margin-bottom:10px\">Пример · как у автора<\u002Fdiv>\n                <div style=\"font:400 14px/1.55 var(--font-sans);color:rgba(255,255,255,0.80)\">Мое расписание автономии: синхронизация каждые 30 мин, тяжелая индексация в 03:00, календарь каждые 3 ч, самопроверка по понедельникам в 07:30, копия по воскресеньям. Всего 8 фоновых заданий, и еще 3 - у личного экземпляра.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- 8 · Кейсы: тексты -->\n      <section data-screen-label=\"08 Кейсы: тексты\" style=\"flex:0 0 100%;height:100%;overflow-y:auto;overflow-x:hidden\">\n        <div style=\"max-width:1240px;margin:0 auto;padding:clamp(24px,3.2vh,44px) clamp(26px,4vw,64px) 72px\">\n          <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:#7FE7FF;margin-bottom:14px\">Акт II · глава 8<\u002Fdiv>\n          <h2 style=\"margin:0 0 8px;font:500 clamp(28px,3.4vw,48px)/1.07 var(--font-sans);letter-spacing:-0.03em;color:#fff\">Письма, справки, исследования<\u002Fh2>\n          <p style=\"margin:0 0 22px;font:400 clamp(14px,1.1vw,16px)/1.5 var(--font-sans);color:rgba(255,255,255,0.45)\">Клик по карточке - запрос и фрагмент результата. Примеры синтетические.<\u002Fp>\n\n          <div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start\">\n            <sc-for list=\"{{ textcases }}\" as=\"c\" hint-placeholder-count=\"3\">\n              <div style=\"border-radius:8px;transition:border-color 140ms cubic-bezier(.22,.61,.36,1);border:1px solid {{ c.bd }};background:#0F1724;overflow:hidden\">\n                <button type=\"button\" sc-camel-on-click=\"{{ c.onClick }}\" style=\"width:100%;text-align:left;padding:20px;border:0;background:transparent;cursor:pointer;color:#fff;display:block\">\n                  <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px\">\n                    <span style=\"font:600 clamp(16px,1.35vw,19px)/1.25 var(--font-sans);letter-spacing:-0.02em;color:#fff\">{{ c.name }}<\u002Fspan>\n                    <span style=\"font:600 11px/1 var(--font-sans);color:rgba(255,255,255,0.38);white-space:nowrap\">{{ c.hint }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"font:400 14px/1.5 var(--font-sans);color:rgba(255,255,255,0.62)\">{{ c.sub }}<\u002Fdiv>\n                <\u002Fbutton>\n                <sc-if value=\"{{ c.open }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"padding:0 20px 20px\">\n                    <div style=\"padding:13px 15px;border-radius:8px;background:rgba(0,106,251,0.10);border:1px solid rgba(0,106,251,0.28);margin-bottom:10px\">\n                      <div style=\"font:600 10px/1 var(--font-sans);letter-spacing:0.10em;text-transform:uppercase;color:#7FE7FF;margin-bottom:8px\">Запрос<\u002Fdiv>\n                      <div style=\"font:400 14px/1.5 var(--font-sans);color:rgba(255,255,255,0.86)\">{{ c.req }}<\u002Fdiv>\n                    <\u002Fdiv>\n                    <sc-if value=\"{{ c.hasToggle }}\" hint-placeholder-val=\"{{ false }}\">\n                      <div style=\"display:flex;gap:6px;padding:4px;border-radius:100px;border:1px solid rgba(255,255,255,0.14);background:rgba(255,255,255,0.03);margin-bottom:10px\">\n                        <button type=\"button\" sc-camel-on-click=\"{{ twinOff }}\" style=\"flex:1 1 0;padding:7px 10px;border:0;border-radius:100px;cursor:pointer;font:600 11px/1 var(--font-sans);transition:background 140ms cubic-bezier(.22,.61,.36,1);background:{{ twinBgOff }};color:{{ twinFgOff }}\">без двойника<\u002Fbutton>\n                        <button type=\"button\" sc-camel-on-click=\"{{ twinOn }}\" style=\"flex:1 1 0;padding:7px 10px;border:0;border-radius:100px;cursor:pointer;font:600 11px/1 var(--font-sans);transition:background 140ms cubic-bezier(.22,.61,.36,1);background:{{ twinBgOn }};color:{{ twinFgOn }}\">с двойником<\u002Fbutton>\n                      <\u002Fdiv>\n                    <\u002Fsc-if>\n                    <div style=\"padding:13px 15px;border-radius:8px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.10)\">\n                      <div style=\"font:600 10px/1 var(--font-sans);letter-spacing:0.10em;text-transform:uppercase;color:rgba(255,255,255,0.45);margin-bottom:8px\">Фрагмент результата<\u002Fdiv>\n                      <div style=\"font:400 14px/1.55 var(--font-sans);color:rgba(255,255,255,0.80)\">{{ c.result }}<\u002Fdiv>\n                    <\u002Fdiv>\n                    <sc-if value=\"{{ c.hasToggle }}\" hint-placeholder-val=\"{{ false }}\">\n                      <div style=\"margin-top:10px;font:400 13px/1.45 var(--font-sans);color:#7FE7FF\">{{ twinNote }}<\u002Fdiv>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"margin-top:16px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start\">\n            <div style=\"padding:20px 22px;border-radius:8px;border:1px solid rgba(127,231,255,0.28);background:rgba(1,43,158,0.28)\">\n              <div style=\"font:500 clamp(17px,1.55vw,22px)/1.3 var(--font-sans);letter-spacing:-0.02em;color:#fff\">Стиль - не настройка. Он выучивается из твоих текстов.<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:12px;align-items:flex-start\">\n              <button type=\"button\" sc-camel-on-click=\"{{ ex7 }}\" style=\"padding:9px 16px;border-radius:100px;cursor:pointer;font:600 12px/1 var(--font-sans);transition:background 140ms cubic-bezier(.22,.61,.36,1);border:1px solid {{ ex7bd }};background:{{ ex7bg }};color:#7FE7FF\">{{ ex7label }}<\u002Fbutton>\n              <sc-if value=\"{{ ex7open }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"width:100%;padding:18px 20px;border-radius:8px;border:1px solid rgba(127,231,255,0.30);border-left:3px solid #7FE7FF;background:rgba(127,231,255,0.06)\">\n                  <div style=\"font:600 10px/1 var(--font-sans);letter-spacing:0.10em;text-transform:uppercase;color:#7FE7FF;margin-bottom:10px\">Пример · как у автора<\u002Fdiv>\n                  <div style=\"font:400 14px/1.55 var(--font-sans);color:rgba(255,255,255,0.80)\">У меня 4 жанра: письма, справки, доклады, стратегии; у каждого кейса своя политика подбора контекста - их 6. Плюс канон «чего в моих текстах не бывает» - система сверяет с ним каждый результат.<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ deep }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top:16px;padding:22px 24px;border-radius:8px;border:1px solid rgba(127,231,255,0.22);background:linear-gradient(180deg, rgba(1,43,158,0.30) 0%, rgba(15,23,36,0.6) 100%)\">\n              <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:#7FE7FF;margin-bottom:12px\">Подробно · как учится стиль<\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;font:400 14px/1.55 var(--font-sans);color:rgba(255,255,255,0.68)\">\n                <div><b style=\"color:#fff;font-weight:600\">Корпус образцов по жанрам.<\u002Fb> Письмо, справка, доклад и стратегия - разные жанры с разной структурой; для каждого собирается свой набор твоих текстов.<\u002Fdiv>\n                <div><b style=\"color:#fff;font-weight:600\">Жанровые руководства.<\u002Fb> Из корпуса выводится описание твоего голоса в жанре: длина фраз, порядок аргументов, привычные обороты и то, чего ты не пишешь никогда.<\u002Fdiv>\n                <div><b style=\"color:#fff;font-weight:600\">Почему 5-10 документов хватает.<\u002Fb> Этого достаточно, чтобы снять устойчивые черты. Дальше стиль дообучается на твоих правках: каждая правка - сигнал, что поправить в руководстве. Обратная проверка: есть и список «так я не пишу никогда» - штампы, связки-протезы, кальки с английского, - и готовый текст сверяется с ним автоматически.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- 9 · Документы под подпись -->\n      <section data-screen-label=\"09 Документы под подпись\" style=\"flex:0 0 100%;height:100%;o
