id rgba(127,231,255,0.22);background:linear-gradient(180deg, rgba(1,43,158,0.30) 0%, rgba(15,23,36,0.6) 100%)\">\n              <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:#7FE7FF;margin-bottom:12px\">Подробно · почему устроено именно так<\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;font:400 14px/1.55 var(--font-sans);color:rgba(255,255,255,0.68)\">\n                <div><b style=\"color:#fff;font-weight:600\">Инкрементальная индексация.<\u002Fb> Пересчет по неизменившемуся корпусу должен быть практически бесплатным, иначе индексацией перестают пользоваться, и память отстает от реальности.<\u002Fdiv>\n                <div><b style=\"color:#fff;font-weight:600\">Гибридный поиск.<\u002Fb> Смысловой находит перефразированное, словесный - точные имена и номера. По отдельности каждый регулярно промахивается, вместе дают устойчивый результат.<\u002Fdiv>\n                <div><b style=\"color:#fff;font-weight:600\">Барьер приватности дважды.<\u002Fb> На шаге 1 помеченное не попадает в прием вовсе; на шаге 7 проверка повторяется, потому что пометка могла появиться позже, чем заметка. Переезд файла между папками распознается по содержимому: заметка не дублируется, а смена принадлежности выносится на решение человека. Почтовый тред читается по сообщениям, последнее - первым, с честной сводкой «показано N из M». Хаб клиента умеет собрать «что нового с прошлого раза» - досье с локаторами, по которому ассистент пишет сводку, а человек решает карточкой.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- 20 · Путь документа -->\n      <section data-screen-label=\"20 Путь документа\" style=\"flex:0 0 100%;height:100%;overflow-y:auto;overflow-x:hidden\">\n        <div style=\"max-width:1240px;margin:0 auto;padding:clamp(24px,3.2vh,44px) clamp(26px,4vw,64px) 72px\">\n          <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:#7FE7FF;margin-bottom:12px\">Акт III · глава 20 · 6 из 10<\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:14px;padding:9px 14px;border-radius:100px;background:rgba(127,231,255,0.06);border:1px solid rgba(127,231,255,0.20)\">\n            <span style=\"width:6px;height:6px;border-radius:100px;background:#7FE7FF;flex:0 0 auto\"><\u002Fspan>\n            <span style=\"font:400 clamp(12px,1vw,13px)/1.4 var(--font-sans);color:rgba(255,255,255,0.62)\">Второй путь - самый требовательный: одна команда должна превратиться в документ, за который не стыдно подписаться, - и вернуться в систему со следом.<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:14px\">\n            <div>\n              <h2 style=\"margin:0 0 6px;font:500 clamp(28px,3.4vw,48px)/1.07 var(--font-sans);letter-spacing:-0.03em;color:#fff\">От команды до файла - и обратно<\u002Fh2>\n              <p style=\"margin:0;font:400 clamp(14px,1.1vw,16px)/1.5 var(--font-sans);color:rgba(255,255,255,0.45)\">Переключи состояние фактов - конвейер доедет или остановится на гейте. Шаги 0 и 10 замыкают путь в кольцо.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:8px;align-items:center\">\n              <div style=\"display:flex;gap:6px;padding:4px;border-radius:100px;border:1px solid rgba(255,255,255,0.14);background:rgba(255,255,255,0.03)\">\n                <button type=\"button\" sc-camel-on-click=\"{{ gateOn }}\" style=\"padding:9px 14px;border:0;border-radius:100px;cursor:pointer;font:600 11px/1 var(--font-sans);transition:background 140ms cubic-bezier(.22,.61,.36,1);background:{{ gateBgOn }};color:{{ gateFgOn }}\">факты есть<\u002Fbutton>\n                <button type=\"button\" sc-camel-on-click=\"{{ gateOff }}\" style=\"padding:9px 14px;border:0;border-radius:100px;cursor:pointer;font:600 11px/1 var(--font-sans);transition:background 140ms cubic-bezier(.22,.61,.36,1);background:{{ gateBgOff }};color:{{ gateFgOff }}\">факта не хватает<\u002Fbutton>\n              <\u002Fdiv>\n              <button type=\"button\" sc-camel-on-click=\"{{ playDoc }}\" style=\"padding:11px 18px;border-radius:100px;cursor:pointer;font:600 12px/1 var(--font-sans);white-space:nowrap;border:1px solid rgba(127,231,255,0.45);background:rgba(127,231,255,0.10);color:#7FE7FF\">{{ playDocLabel }}<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"position:relative;padding:12px;border-radius:12px;border:1px dashed rgba(127,231,255,0.30);margin-bottom:14px\">\n            <span style=\"position:absolute;top:-9px;left:18px;padding:0 8px;background:#030507;font:600 10px/18px var(--font-sans);letter-spacing:0.08em;color:#7FE7FF\">КОНТУР ВЫХОДА · КОЛЬЦО<\u002Fspan>\n            <div style=\"display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:7px\">\n              <sc-for list=\"{{ docSteps }}\" as=\"d\" hint-placeholder-count=\"11\">\n                <button type=\"button\" sc-camel-on-click=\"{{ d.onClick }}\" style=\"display:flex;flex-direction:column;gap:6px;text-align:left;padding:11px 12px;border-radius:8px;cursor:pointer;min-height:122px;transition:background 140ms cubic-bezier(.22,.61,.36,1);border:1px {{ d.style }} {{ d.bd }};background:{{ d.bg }}\">\n                  <span style=\"display:flex;justify-content:space-between;align-items:baseline;gap:6px\">\n                    <span style=\"font:600 12px/1.2 var(--font-sans);color:{{ d.fg }}\">{{ d.n }}<\u002Fspan>\n                    <span style=\"font:600 9px/1 var(--font-sans);letter-spacing:0.06em;text-transform:uppercase;white-space:nowrap;color:{{ d.badgeFg }}\">{{ d.badge }}<\u002Fspan>\n                  <\u002Fspan>\n                  <span style=\"font:600 10px/1 var(--font-sans);letter-spacing:0.06em;text-transform:uppercase;color:#7FE7FF\">{{ d.by }}<\u002Fspan>\n                  <span style=\"font:400 11px/1.4 var(--font-sans);color:{{ d.sub }}\">{{ d.t }}<\u002Fspan>\n                <\u002Fbutton>\n              <\u002Fsc-for>\n              <div style=\"display:flex;align-items:center;justify-content:center;padding:11px 12px;border-radius:8px;border:1px dashed rgba(127,231,255,0.30);font:400 11px/1.4 var(--font-sans);color:rgba(127,231,255,0.8);text-align:center\">↺ шаг 10 закрывает каркас шага 0<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start\">\n            <div style=\"padding:18px 20px;border-radius:8px;background:rgba(255,255,255,0.04);border-left:2px solid {{ gateRule }}\">\n              <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.42);margin-bottom:8px\">{{ gateTitle }}<\u002Fdiv>\n              <div style=\"font:400 15px/1.5 var(--font-sans);color:rgba(255,255,255,0.80)\">{{ gateText }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"padding:18px 20px;border-radius:8px;border:1px solid rgba(127,231,255,0.28);background:rgba(1,43,158,0.28)\"><div style=\"font:500 clamp(15px,1.4vw,20px)/1.3 var(--font-sans);letter-spacing:-0.02em;color:#fff\">Из одиннадцати шагов модель делает один. Остальные десять детерминированы - поэтому результат воспроизводим и прослеживаем.<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"margin-top:16px;display:flex;flex-direction:column;gap:12px;align-items:flex-start\">\n            <button type=\"button\" sc-camel-on-click=\"{{ ex16 }}\" style=\"padding:9px 16px;border-radius:100px;cursor:pointer;font:600 12px/1 var(--font-sans);transition:background 140ms cubic-bezier(.22,.61,.36,1);border:1px solid {{ ex16bd }};background:{{ ex16bg }};color:#7FE7FF\">{{ ex16label }}<\u002Fbutton>\n            <sc-if value=\"{{ ex16open }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"width:100%;padding:18px 20px;border-radius:8px;border:1px solid rgba(127,231,255,0.30);border-left:3px solid #7FE7FF;background:rgba(127,231,255,0.06)\">\n                <div style=\"font:600 10px/1 var(--font-sans);letter-spacing:0.10em;text-transform:uppercase;color:#7FE7FF;margin-bottom:10px\">Пример · как у автора<\u002Fdiv>\n                <div style=\"font:400 14px/1.55 var(--font-sans);color:rgba(255,255,255,0.80)\">Этот конвейер закрыл у меня структурный провал: сложное КП, где путались цифры из двух похожих таблиц. Теперь одна команда - и .docx под подпись. Второй провал - документ по непрочитанному до конца письму - закрыл проверку полноты. Третий - след, который ассистент писал по памяти, - закрыл сборку следа из журнала. Так контур и растет: провал → механизм.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ deep }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top:16px;padding:22px 24px;border-radius:8px;border:1px solid rgba(127,231,255,0.22);background:linear-gradient(180deg, rgba(1,43,158,0.30) 0%, rgba(15,23,36,0.6) 100%)\">\n              <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:#7FE7FF;margin-bottom:12px\">Подробно · механика конвейера<\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;font:400 13px/1.55 var(--font-sans);color:rgba(255,255,255,0.68)\">\n                <div><b style=\"color:#fff;font-weight:600\">Образец вместо шаблона.<\u002Fb> Реальный документ того же жанра работает лучше абстрактной болванки: модель копирует структуру, регистр и порядок разделов из живого примера.<\u002Fdiv>\n                <div><b style=\"color:#fff;font-weight:600\">Гейт до генерации.<\u002Fb> Текст с дырами выглядит убедительно и проходит вычитку. Остановиться нужно раньше, чем появился правдоподобный текст.<\u002Fdiv>\n                <div><b style=\"color:#fff;font-weight:600\">Каркас - до работы.<\u002Fb> Падение на середине оставляет заявку, а не полупапку, которая выглядит оформленной. Незакрытый каркас виден в здоровье системы.<\u002Fdiv>\n                <div><b style=\"color:#fff;font-weight:600\">След с датами.<\u002Fb> Источники собираются сами из журнала вызовов сессии, а не из памяти ассистента, с датой каждого. Рядом лежит версия поновее - предупреждение.<\u002Fdiv>\n                <div><b style=\"color:#fff;font-weight:600\">Граница класса.<\u002Fb> След фиксирует взятое, а не пропущенное. Поэтому для почтовых тредов отдельно проверяется, прочитан ли последний ответ контрагента.<\u002Fdiv>\n                <div><b style=\"color:#fff;font-weight:600\">Фоновые задания.<\u002Fb> Долгая сборка уходит в фон с прогрессом и чекпойнтами: после сбоя продолжается с места обрыва.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- 21 · Оркестрация и автономия -->\n      <section data-screen-label=\"21 Оркестрация и автономия\" style=\"flex:0 0 100%;height:100%;overflow-y:auto;overflow-x:hidden\">\n        <div style=\"max-width:1240px;margin:0 auto;padding:clamp(24px,3.2vh,44px) clamp(26px,4vw,64px) 72px\">\n          <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:#7FE7FF;margin-bottom:12px\">Акт III · глава 21 · 7 из 10<\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:14px;padding:9px 14px;border-radius:100px;background:rgba(127,231,255,0.06);border:1px solid rgba(127,231,255,0.20)\">\n            <span style=\"width:6px;height:6px;border-radius:100px;background:#7FE7FF;flex:0 0 auto\"><\u002Fspan>\n            <span style=\"font:400 clamp(12px,1vw,13px)/1.4 var(--font-sans);color:rgba(255,255,255,0.62)\">Сценарии прошли вручную - теперь про то, что запускается без тебя и как длинное не блокирует диалог.<\u002Fspan>\n          <\u002Fdiv>\n          <h2 style=\"margin:0 0 8px;font:500 clamp(28px,3.4vw,48px)/1.07 var(--font-sans);letter-spacing:-0.03em;color:#fff\">Само и по расписанию<\u002Fh2>\n          <p style=\"margin:0 0 16px;font:400 clamp(14px,1.1vw,16px)/1.5 var(--font-sans);color:rgba(255,255,255,0.45)\">Наведи на отметку расписания - что происходит в этот момент.<\u002Fp>\n\n          <div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:16px;align-items:start\">\n            <div style=\"padding:18px 20px;border-radius:8px;border:1px solid rgba(255,255,255,0.12);background:#0F1724\">\n              <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:#7FE7FF;margin-bottom:12px\">Длинные задачи<\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:7px\">\n                <div style=\"padding:11px 13px;border-radius:8px;background:rgba(255,255,255,0.04);font:400 13px/1.4 var(--font-sans);color:rgba(255,255,255,0.78)\">задание уходит в фон<\u002Fdiv>\n                <div style=\"padding:11px 13px;border-radius:8px;background:rgba(255,255,255,0.04);font:400 13px/1.4 var(--font-sans);color:rgba(255,255,255,0.78)\">прогресс в конкретных единицах<\u002Fdiv>\n                <div style=\"padding:11px 13px;border-radius:8px;background:rgba(255,255,255,0.04);font:400 13px/1.4 var(--font-sans);color:rgba(255,255,255,0.78)\">чекпойнты<\u002Fdiv>\n                <div style=\"padding:11px 13px;border-radius:8px;background:rgba(255,255,255,0.04);font:400 13px/1.4 var(--font-sans);color:rgba(255,255,255,0.78)\">продолжение с места обрыва<\u002Fdiv>\n                <div style=\"padding:11px 13px;border-radius:8px;background:rgba(0,106,251,0.16);border:1px solid rgba(127,231,255,0.35);font:400 13px/1.4 var(--font-sans);color:#fff\">отмена<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"padding:18px 20px;border-radius:8px;border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.02)\">\n              <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:#7FE7FF;margin-bottom:14px\">Расписание · лента суток<\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:8px\">\n                <sc-for list=\"{{ auton }}\" as=\"a\" hint-placeholder-count=\"8\">\n                  <button type=\"button\" sc-camel-on-mouse-enter=\"{{ a.onEnter }}\" sc-camel-on-click=\"{{ a.onEnter }}\" style=\"display:grid;grid-template-columns:16px minmax(0,150px) minmax(0,1fr);gap:12px;align-items:center;width:100%;text-align:left;padding:11px 14px;border-radius:8px;cursor:default;transition:background 140ms cubic-bezier(.22,.61,.36,1);border:1px solid {{ a.bd }};background:{{ a.bg }};color:#fff\">\n                    <span style=\"width:9px;height:9px;border-radius:100px;background:{{ a.dot }}\"><\u002Fspan>\n                    <span style=\"font:600 13px/1.2 var(--font-sans);color:#fff\">{{ a.n }}<\u002Fspan>\n                    <span style=\"font:400 12px/1.35 var(--font-sans);color:rgba(255,255,255,0.55)\">{{ a.when }}<\u002Fspan>\n                  <\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"margin-top:12px;padding:13px 15px;border-radius:8px;background:rgba(255,255,255,0.04);border-left:2px solid #7FE7FF\">\n                <div style=\"font:600 10px/1 var(--font-sans);letter-spacing:0.10em;text-transform:uppercase;color:rgba(255,255,255,0.42);margin-bottom:8px\">{{ autonName }} · {{ autonWhen }}<\u002Fdiv>\n                <div style=\"font:400 14px/1.5 var(--font-sans);color:rgba(255,255,255,0.78)\">{{ autonText }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"margin-top:14px;padding:18px 20px;border-radius:8px;border:1px solid rgba(127,231,255,0.28);background:rgba(1,43,158,0.28)\">\n            <div style=\"font:500 clamp(15px,1.4vw,20px)/1.3 var(--font-sans);letter-spacing:-0.02em;color:#fff\">Двойник работает, когда ты спишь. Но записывает - только когда ты сказал «да».<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"margin-top:16px;display:flex;flex-direction:column;gap:12px;align-items:flex-start\">\n            <button type=\"button\" sc-camel-on-click=\"{{ ex17 }}\" style=\"padding:9px 16px;border-radius:100px;cursor:pointer;font:600 12px/1 var(--font-sans);transition:background 140ms cubic-bezier(.22,.61,.36,1);border:1px solid {{ ex17bd }};background:{{ ex17bg }};color:#7FE7FF\">{{ ex17label }}<\u002Fbutton>\n            <sc-if value=\"{{ ex17open }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"width:100%;padding:18px 20px;border-radius:8px;border:1px solid rgba(127,231,255,0.30);border-left:3px solid #7FE7FF;background:rgba(127,231,255,0.06)\">\n                <div style=\"font:600 10px/1 var(--font-sans);letter-spacing:0.10em;text-transform:uppercase;color:#7FE7FF;margin-bottom:10px\">Пример · как у автора<\u002Fdiv>\n                <div style=\"font:400 14px/1.55 var(--font-sans);color:rgba(255,255,255,0.80)\">Мои 8 фоновых заданий: служба постоянно, синхронизация каждые 30 мин, индексация в 03:00, календарь каждые 3 ч, самопроверка по понедельникам в 07:30, копия по воскресеньям в 11:00, сторож прогонов каждые 10 мин, сторож блокировок каждые 15 мин. У личного экземпляра своих три. Планового полного прогона нет - только вручную или кнопкой.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ deep }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top:16px;padding:22px 24px;border-radius:8px;border:1px solid rgba(127,231,255,0.22);background:linear-gradient(180deg, rgba(1,43,158,0.30) 0%, rgba(15,23,36,0.6) 100%)\">\n              <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:#7FE7FF;margin-bottom:12px\">Подробно · прозрачность и деградация<\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;font:400 14px/1.55 var(--font-sans);color:rgba(255,255,255,0.68)\">\n                <div><b style=\"color:#fff;font-weight:600\">Длинная операция обязана быть прозрачной.<\u002Fb> Молчащий процесс невозможно отличить от зависшего. Прогресс считается в конкретных единицах - файлах, заметках, шагах, - а не в процентах «примерно».<\u002Fdiv>\n                <div><b style=\"color:#fff;font-weight:600\">Прерываемость.<\u002Fb> Потеря часа работы из-за сбоя отучает пользоваться фоном вообще. Чекпойнты и продолжение с места обрыва - условие того, что фоном будут пользоваться.<\u002Fdiv>\n                <div><b style=\"color:#fff;font-weight:600\">Без сети.<\u002Fb> Ретраи с отступом, очередь не теряется, сбой одного источника не роняет всю цепочку. Набор заданий собирается из манифеста: базовые всегда, остальные - по включенным коннекторам.<\u002Fdiv>\n                <div><b style=\"color:#fff;font-weight:600\">Чтение ≠ запись.<\u002Fb> Автономия чтения безопасна: худшее - устаревшие данные. Автономия записи меняет мир, поэтому требует лестницы доверия.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- 22 · Безопасность и приватность -->\n      <section data-screen-label=\"22 Безопасность и приватность\" style=\"flex:0 0 100%;height:100%;overflow-y:auto;overflow-x:hidden\">\n        <div style=\"max-width:1240px;margin:0 auto;padding:clamp(24px,3.2vh,44px) clamp(26px,4vw,64px) 72px\">\n          <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:#7FE7FF;margin-bottom:12px\">Акт III · глава 22 · 8 из 10<\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:14px;padding:9px 14px;border-radius:100px;background:rgba(127,231,255,0.06);border:1px solid rgba(127,231,255,0.20)\">\n            <span style=\"width:6px;height:6px;border-radius:100px;background:#7FE7FF;flex:0 0 auto\"><\u002Fspan>\n            <span style=\"font:400 clamp(12px,1vw,13px)/1.4 var(--font-sans);color:rgba(255,255,255,0.62)\">Механику знаем. Главный вопрос инженера к такой системе - что и куда утекает.<\u002Fspan>\n          <\u002Fdiv>\n          <h2 style=\"margin:0 0 8px;font:500 clamp(28px,3.4vw,48px)/1.07 var(--font-sans);letter-spacing:-0.03em;color:#fff\">Что покидает компьютер - а что никогда<\u002Fh2>\n          <p style=\"margin:0 0 16px;font:400 clamp(14px,1.1vw,16px)/1.5 var(--font-sans);color:rgba(255,255,255,0.45)\">Наведи на элемент - почему он не может уехать. Клик по стрелке - из чего состоит запрос.<\u002Fp>\n\n          <div style=\"display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,0.85fr) minmax(0,0.7fr);gap:0;align-items:center;margin-bottom:14px\">\n            <div style=\"padding:20px;border-radius:8px;border:1px solid rgba(127,231,255,0.30);background:rgba(1,43,158,0.22)\">\n              <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;color:#7FE7FF;margin-bottom:12px\">ОСТАЕТСЯ ЛОКАЛЬНО<\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px\">\n                <sc-for list=\"{{ seclocal }}\" as=\"x\" hint-placeholder-count=\"8\">\n                  <button type=\"button\" sc-camel-on-mouse-enter=\"{{ x.onEnter }}\" sc-camel-on-click=\"{{ x.onEnter }}\" style=\"padding:11px 12px;border-radius:8px;text-align:left;cursor:default;transition:background 140ms cubic-bezier(.22,.61,.36,1);border:1px solid {{ x.bd }};background:{{ x.bg }};color:#fff;font:500 13px/1.3 var(--font-sans)\">{{ x.n }}<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <button type=\"button\" sc-camel-on-click=\"{{ secArrowClick }}\" style=\"display:flex;flex-direction:column;align-items:center;gap:8px;border:0;background:transparent;cursor:pointer;padding:0 12px\">\n              <span style=\"font:400 11px/1.3 var(--font-sans);text-align:center;color:rgba(255,255,255,0.55)\">вопрос + подобранный контекст<\u002Fspan>\n              <span style=\"width:100%;height:2px;border-radius:100px;transition:background 140ms cubic-bezier(.22,.61,.36,1);background:{{ secArrowBd }}\"><\u002Fspan>\n              <span style=\"font:400 11px/1.3 var(--font-sans);text-align:center;color:rgba(255,255,255,0.55)\">← возвращается текст<\u002Fspan>\n            <\u002Fbutton>\n            <div style=\"padding:20px;border-radius:8px;border:1px dashed rgba(255,255,255,0.20);background:rgba(255,255,255,0.02)\">\n              <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;color:rgba(255,255,255,0.45);margin-bottom:12px\">УХОДИТ В ОБЛАКО<\u002Fdiv>\n              <div style=\"font:400 13px/1.5 var(--font-sans);color:rgba(255,255,255,0.70)\">текущий вопрос + подобранный под него контекст → возвращается текст<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px\">\n            <div style=\"padding:15px 17px;border-radius:8px;border:1px solid rgba(127,231,255,0.25);background:rgba(255,255,255,0.03)\">\n              <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.06em;color:#7FE7FF;margin-bottom:9px\">БАРЬЕР ПРИВАТНОСТИ<\u002Fdiv>\n              <div style=\"font:400 13px/1.45 var(--font-sans);color:rgba(255,255,255,0.68)\">единый признак на всех уровнях: прием, память, факты, генерация, чтение - помеченное не существует ни для поиска, ни для контекста; папка и файл помечаются одинаково<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"padding:15px 17px;border-radius:8px;border:1px solid rgba(127,231,255,0.25);background:rgba(255,255,255,0.03)\">\n              <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.06em;color:#7FE7FF;margin-bottom:9px\">ПРОФИЛЬ ВЛАДЕЛЬЦА<\u002Fdiv>\n              <div style=\"font:400 13px/1.45 var(--font-sans);color:rgba(255,255,255,0.68)\">кто ты, твои адреса и домены, чьи личные документы не читать - один файл, из него растут и приватность, и подпись; в коде ни одного имени<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"padding:15px 17px;border-radius:8px;border:1px solid rgba(127,231,255,0.25);background:rgba(255,255,255,0.03)\">\n              <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.06em;color:#7FE7FF;margin-bottom:9px\">ЖУРНАЛ ДЕЙСТВИЙ<\u002Fdiv>\n              <div style=\"font:400 13px/1.45 var(--font-sans);color:rgba(255,255,255,0.68)\">каждая запись во внешнюю систему оставляет ровно одну строку аудита - без содержимого<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"padding:15px 17px;border-radius:8px;border:1px solid rgba(127,231,255,0.25);background:rgba(255,255,255,0.03)\">\n              <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.06em;color:#7FE7FF;margin-bottom:9px\">ГРАНИЦА ДОСТУПА<\u002Fdiv>\n              <div style=\"font:400 13px/1.45 var(--font-sans);color:rgba(255,255,255,0.68)\">служба слушает только локальный адрес; клиенты и пульт входят по токену на уровне транспорта, до вызова логики; личный экземпляр - свой адрес и свой токен<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start\">\n            <div style=\"padding:18px 20px;border-radius:8px;background:rgba(255,255,255,0.04);border-left:2px solid #7FE7FF\">\n              <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.42);margin-bottom:8px\">{{ secTitle }}<\u002Fdiv>\n              <div style=\"font:400 15px/1.5 var(--font-sans);color:rgba(255,255,255,0.80)\">{{ secText }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"padding:18px 20px;border-radius:8px;border:1px solid rgba(127,231,255,0.28);background:rgba(1,43,158,0.28)\">\n              <div style=\"font:500 clamp(15px,1.4vw,20px)/1.3 var(--font-sans);letter-spacing:-0.02em;color:#fff\">Барьер в одном месте - не барьер. Признак приватности проверяется на каждом уровне отдельно - и система еженедельно проверяет сам барьер.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"margin-top:16px;display:flex;flex-direction:column;gap:12px;align-items:flex-start\">\n            <button type=\"button\" sc-camel-on-click=\"{{ ex18 }}\" style=\"padding:9px 16px;border-radius:100px;cursor:pointer;font:600 12px/1 var(--font-sans);transition:background 140ms cubic-bezier(.22,.61,.36,1);border:1px solid {{ ex18bd }};background:{{ ex18bg }};color:#7FE7FF\">{{ ex18label }}<\u002Fbutton>\n            <sc-if value=\"{{ ex18open }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"width:100%;padding:18px 20px;border-radius:8px;border:1px solid rgba(127,231,255,0.30);border-left:3px solid #7FE7FF;background:rgba(127,231,255,0.06)\">\n                <div style=\"font:600 10px/1 var(--font-sans);letter-spacing:0.10em;text-transform:uppercase;color:#7FE7FF;margin-bottom:10px\">Пример · как у автора<\u002Fdiv>\n                <div style=\"font:400 14px/1.55 var(--font-sans);color:rgba(255,255,255,0.80)\">У меня каждый пишущий инструмент обязан оставить ровно одну строку аудита - это охраняется отдельным тестом. Барьер приватности после одного инцидента стал симметричным и проверяемым: доктор показывает «протечек нет», смоук по понедельникам это подтверждает. Перед сборкой кита гард проверяет 242 приватных термина - имена, компании, клиентов - и отказывает при первом совпадении.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ deep }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top:16px;padding:22px 24px;border-radius:8px;border:1px solid rgba(127,231,255,0.22);background:linear-gradient(180deg, rgba(1,43,158,0.30) 0%, rgba(15,23,36,0.6) 100%)\">\n              <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:#7FE7FF;margin-bottom:12px\">Подробно · механизмы приватности<\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;font:400 14px/1.55 var(--font-sans);color:rgba(255,255,255,0.68)\">\n                <div><b style=\"color:#fff;font-weight:600\">Единый предикат.<\u002Fb> Одна проверка вместо разрозненных: разрозненные расходятся между собой, и рано или поздно один из путей забывает спросить. Барьер проверяется на симметрию - пометка на папке и на файле работают одинаково - и подтверждается дважды: проверкой здоровья «протечек нет» и еженедельным прогоном невидимости. Найденная однажды несимметрия закрылась классом, а не точкой. Приватность тиражирования: в коде, скиллах и справке нет ни имен владельца, ни имен его клиентов - список собирается из профиля и карточек, гард стоит в тестах и в сборке кита.<\u002Fdiv>\n                <div><b style=\"color:#fff;font-weight:600\">Аудит без содержимого.<\u002Fb> Журнал не должен становиться второй копией данных: в нем только что, куда и когда.<\u002Fdiv>\n                <div><b style=\"color:#fff;font-weight:600\">Секреты в системном хранилище.<\u002Fb> Ключи и токены живут в хранилище операционной системы, а не в файлах рядом с базой.<\u002Fdiv>\n                <div><b style=\"color:#fff;font-weight:600\">Резервная копия производного.<\u002Fb> Перед рискованными операциями индексы и зеркала копируются: откат дешевле пересборки.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- 23 · Самоконтроль -->\n      <section data-screen-label=\"23 Самоконтроль\" style=\"flex:0 0 100%;height:100%;overflow-y:auto;overflow-x:hidden\">\n        <div style=\"max-width:1240px;margin:0 auto;padding:clamp(24px,3.2vh,44px) clamp(26px,4vw,64px) 72px\">\n          <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:#7FE7FF;margin-bottom:12px\">Акт III · глава 23 · 9 из 10 · новая<\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:14px;padding:9px 14px;border-radius:100px;background:rgba(127,231,255,0.06);border:1px solid rgba(127,231,255,0.20)\">\n            <span style=\"width:6px;height:6px;border-radius:100px;background:#7FE7FF;flex:0 0 auto\"><\u002Fspan>\n            <span style=\"font:400 clamp(12px,1vw,13px)/1.4 var(--font-sans);color:rgba(255,255,255,0.62)\">Приватность защитили. Остался вопрос зрелости: кто находит поломки - ты или система? Дальше - как она делает это сама.<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:14px\">\n            <div>\n              <h2 style=\"margin:0 0 6px;font:500 clamp(28px,3.4vw,48px)/1.07 var(--font-sans);letter-spacing:-0.03em;color:#fff\">Система сама сообщает, где ломается<\u002Fh2>\n              <p style=\"margin:0;font:400 clamp(14px,1.1vw,16px)/1.5 var(--font-sans);color:rgba(255,255,255,0.45)\">Клик по механизму - что он ловит. «Сломать нарочно» - как поломка проходит петлю.<\u002Fp>\n            <\u002Fdiv>\n            <button type=\"button\" sc-camel-on-click=\"{{ breakRun }}\" style=\"padding:11px 20px;border-radius:100px;cursor:pointer;font:600 12px/1 var(--font-sans);white-space:nowrap;border:1px solid rgba(255,196,138,0.55);background:{{ breakBg }};color:#FFC48A\">{{ breakLabel }}<\u002Fbutton>\n          <\u002Fdiv>\n\n          <div style=\"padding:14px 16px;border-radius:10px;border:1px solid rgba(255,255,255,0.10);background:rgba(255,255,255,0.02);margin-bottom:14px\">\n            <div style=\"font:600 10px/1 var(--font-sans);letter-spacing:0.10em;text-transform:uppercase;color:rgba(255,255,255,0.38);margin-bottom:10px\">Петля самоконтроля<\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;align-items:stretch\">\n              <sc-for list=\"{{ selfLoop }}\" as=\"l\" hint-placeholder-count=\"5\">\n                <div style=\"display:flex;flex-direction:column;gap:6px;padding:12px 13px;border-radius:8px;transition:background 220ms cubic-bezier(.22,.61,.36,1);border:1px solid {{ l.bd }};background:{{ l.bg }}\">\n                  <span style=\"font:600 12px/1.2 var(--font-sans);color:{{ l.fg }}\">{{ l.n }}<\u002Fspan>\n                  <span style=\"font:400 11px/1.4 var(--font-sans);color:rgba(255,255,255,0.55)\">{{ l.t }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"margin-top:8px;font:400 11px/1.4 var(--font-sans);color:rgba(127,231,255,0.75)\">↺ петля замыкается на здоровье системы, а не на пользователе: человек узнает о поломке из панели, а не из испорченного документа<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:start\">\n            <div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px\">\n              <sc-for list=\"{{ selfMech }}\" as=\"m\" hint-placeholder-count=\"5\">\n                <button type=\"button\" sc-camel-on-click=\"{{ m.onClick }}\" style=\"display:flex;flex-direction:column;gap:8px;text-align:left;padding:14px 15px;border-radius:8px;cursor:pointer;min-height:132px;transition:background 140ms cubic-bezier(.22,.61,.36,1);border:1px solid {{ m.bd }};background:{{ m.bg }};color:#fff\">\n                  <span style=\"font:600 11px/1.25 var(--font-sans);letter-spacing:0.06em;color:#7FE7FF\">{{ m.n }}<\u002Fspan>\n                  <span style=\"font:400 12px/1.45 var(--font-sans);color:rgba(255,255,255,0.68)\">{{ m.t }}<\u002Fspan>\n                  <span style=\"margin-top:auto;font:600 10px/1 var(--font-sans);letter-spacing:0.06em;text-transform:uppercase;color:rgba(255,255,255,0.35)\">{{ m.where }}<\u002Fspan>\n                <\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:12px\">\n              <sc-if value=\"{{ breakOn }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"padding:16px 18px;border-radius:8px;border:1px solid rgba(255,196,138,0.55);background:rgba(255,122,89,0.10)\">\n                  <div style=\"font:600 10px/1 var(--font-sans);letter-spacing:0.10em;text-transform:uppercase;color:#FFC48A;margin-bottom:8px\">Сломано нарочно · {{ breakStepLabel }}<\u002Fdiv>\n                  <div style=\"font:400 14px/1.5 var(--font-sans);color:#fff\">{{ breakText }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <div style=\"padding:16px 18px;border-radius:8px;border:1px solid rgba(255,255,255,0.12);background:#0F1724\">\n                <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:#7FE7FF;margin-bottom:10px\">{{ selfName }} · что ловит<\u002Fdiv>\n                <div style=\"font:400 14px/1.5 var(--font-sans);color:rgba(255,255,255,0.82);margin-bottom:12px\">{{ selfCatches }}<\u002Fdiv>\n                <div style=\"padding:11px 13px;border-radius:8px;background:rgba(255,255,255,0.04);border-left:2px solid #7FE7FF;font:400 13px/1.5 var(--font-sans);color:rgba(255,255,255,0.72)\"><span style=\"color:#7FE7FF;font-weight:600\">Пример класса. <\u002Fspan>{{ selfClass }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"padding:18px 20px;border-radius:8px;border:1px solid rgba(127,231,255,0.28);background:rgba(1,43,158,0.28)\"><div style=\"font:500 clamp(15px,1.4vw,20px)/1.3 var(--font-sans);letter-spacing:-0.02em;color:#fff\">Провал - не повод для заплатки. Он превращается в гард, который ловит класс.<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"margin-top:16px;display:flex;flex-direction:column;gap:12px;align-items:flex-start\">\n            <button type=\"button\" sc-camel-on-click=\"{{ exSelf }}\" style=\"padding:9px 16px;border-radius:100px;cursor:pointer;font:600 12px/1 var(--font-sans);transition:background 140ms cubic-bezier(.22,.61,.36,1);border:1px solid {{ exSelfBd }};background:{{ exSelfBg }};color:#7FE7FF\">{{ exSelfLabel }}<\u002Fbutton>\n            <sc-if value=\"{{ exSelfOpen }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"width:100%;padding:18px 20px;border-radius:8px;border:1px solid rgba(127,231,255,0.30);border-left:3px solid #7FE7FF;background:rgba(127,231,255,0.06)\">\n                <div style=\"font:600 10px/1 var(--font-sans);letter-spacing:0.10em;text-transform:uppercase;color:#7FE7FF;margin-bottom:10px\">Пример · как у автора<\u002Fdiv>\n                <div style=\"font:400 14px/1.55 var(--font-sans);color:rgba(255,255,255,0.80)\">У меня: реестр контрактов на 82 инструмента, одной волной закрыты 12 дыр round-trip и 20 тихих деградаций, телеметрия отказов в докторе, 74 проверки здоровья, смоук из 13 сценариев по понедельникам, линт знаний ночью - на день ревизии ждут решения 84 находки. Три провала закрылись классом: справка о провалах дала конституции три правила, инцидент с приватной папкой - симметричный барьер, документ по недочитанному письму - проверку полноты.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ deep }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top:16px;padding:22px 24px;border-radius:8px;border:1px solid rgba(127,231,255,0.22);background:linear-gradient(180deg, rgba(1,43,158,0.30) 0%, rgba(15,23,36,0.6) 100%)\">\n              <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:#7FE7FF;margin-bottom:12px\">Подробно · как провал становится гардом<\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;font:400 13px/1.55 var(--font-sans);color:rgba(255,255,255,0.68)\">\n                <div><b style=\"color:#fff;font-weight:600\">Боль пользователя не масштабируется.<\u002Fb> Если поломку замечает человек, она уже успела испортить результат. Обнаружение должно быть дешевле последствий.<\u002Fdiv>\n                <div><b style=\"color:#fff;font-weight:600\">Три правила из одной справки.<\u002Fb> Round-trip ссылок, запрет тихого фолбэка, обязательные негативные тесты - все три выросли из одного разбора провалов.<\u002Fdiv>\n                <div><b style=\"color:#fff;font-weight:600\">Сначала карта класса.<\u002Fb> Спайк до фиксов: где еще живет та же ошибка. Потом один фикс на класс с генерическим тестом.<\u002Fdiv>\n                <div><b style=\"color:#fff;font-weight:600\">Телеметрия без содержимого.<\u002Fb> Только имя инструмента и код причины. Счетчик спотыканий не становится второй копией данных.<\u002Fdiv>\n                <div><b style=\"color:#fff;font-weight:600\">Инвариант виден в здоровье.<\u002Fb> Мало отказать в коде - нарушение должно быть видно в панели, иначе о нем никто не узнает.<\u002Fdiv>\n                <div><b style=\"color:#fff;font-weight:600\">Радиус поражения.<\u002Fb> Дефект данных проверяется по всем полям того же механизма, всем потребителям поля и уже доставленным результатам. Линт знаний - ночной шаг, четыре детектора, находки живут как карточки с принято / отклонено.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- 24 · Точки расширения -->\n      <section data-screen-label=\"24 Точки расширения\" style=\"flex:0 0 100%;height:100%;overflow-y:auto;overflow-x:hidden\">\n        <div style=\"max-width:1240px;margin:0 auto;padding:clamp(24px,3.2vh,44px) clamp(26px,4vw,64px) 72px\">\n          <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:#7FE7FF;margin-bottom:12px\">Акт III · глава 24 · 10 из 10<\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:14px;padding:9px 14px;border-radius:100px;background:rgba(127,231,255,0.06);border:1px solid rgba(127,231,255,0.20)\">\n            <span style=\"width:6px;height:6px;border-radius:100px;background:#7FE7FF;flex:0 0 auto\"><\u002Fspan>\n            <span style=\"font:400 clamp(12px,1vw,13px)/1.4 var(--font-sans);color:rgba(255,255,255,0.62)\">Устройство разобрали. Последний вопрос: как это развивать под себя, ничего не сломав.<\u002Fspan>\n          <\u002Fdiv>\n          <h2 style=\"margin:0 0 8px;font:500 clamp(28px,3.4vw,48px)/1.07 var(--font-sans);letter-spacing:-0.03em;color:#fff\">Куда дописывать свое<\u002Fh2>\n          <p style=\"margin:0 0 16px;font:400 clamp(14px,1.1vw,16px)/1.5 var(--font-sans);color:rgba(255,255,255,0.45)\">Клик по точке - что именно надо написать. Клик по замку - почему инвариант неприкосновенен.<\u002Fp>\n\n          <div style=\"display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start\">\n            <div style=\"display:flex;flex-direction:column;gap:8px\">\n              <sc-for list=\"{{ extend }}\" as=\"e\" hint-placeholder-count=\"5\">\n                <div style=\"border-radius:8px;overflow:hidden;transition:background 140ms cubic-bezier(.22,.61,.36,1);border:1px solid {{ e.bd }};background:{{ e.bg }}\">\n                  <button type=\"button\" sc-camel-on-click=\"{{ e.onClick }}\" style=\"display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr) auto;gap:14px;align-items:center;width:100%;text-align:left;padding:14px 16px;border:0;background:transparent;cursor:pointer;color:#fff\">\n                    <span style=\"font:600 11px/1.25 var(--font-sans);letter-spacing:0.06em;color:#7FE7FF\">{{ e.n }}<\u002Fspan>\n                    <span style=\"font:400 13px/1.4 var(--font-sans);color:rgba(255,255,255,0.70)\">{{ e.t }}<\u002Fspan>\n                    <span style=\"font:600 10px/1 var(--font-sans);color:#12D494;white-space:nowrap\">{{ e.cost }}<\u002Fspan>\n                  <\u002Fbutton>\n                  <sc-if value=\"{{ e.open }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"padding:0 16px 14px\">\n                      <div style=\"padding:12px 14px;border-radius:8px;background:rgba(255,255,255,0.05);font:400 13px/1.5 var(--font-sans);color:rgba(255,255,255,0.75)\">{{ e.detail }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n\n            <div style=\"display:flex;flex-direction:column;gap:8px\">\n              <div style=\"font:600 10px/1 var(--font-sans);letter-spacing:0.10em;text-transform:uppercase;color:#FFC48A;margin-bottom:2px\">Три инварианта · трогать нельзя<\u002Fdiv>\n              <sc-for list=\"{{ invariants }}\" as=\"iv\" hint-placeholder-count=\"3\">\n                <div style=\"border-radius:8px;overflow:hidden;transition:background 140ms cubic-bezier(.22,.61,.36,1);border:1px solid {{ iv.bd }};background:{{ iv.bg }}\">\n                  <button type=\"button\" sc-camel-on-click=\"{{ iv.onClick }}\" style=\"display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:13px 15px;border:0;background:transparent;cursor:pointer;color:#fff\">\n                    <span style=\"width:7px;height:7px;border-radius:1px;background:#FFC48A;flex:0 0 auto\"><\u002Fspan>\n                    <span style=\"font:600 13px/1.3 var(--font-sans);color:#fff\">{{ iv.n }}<\u002Fspan>\n                  <\u002Fbutton>\n                  <sc-if value=\"{{ iv.open }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"padding:0 15px 13px\">\n                      <div style=\"padding:12px 14px;border-radius:8px;background:rgba(255,255,255,0.05);font:400 13px/1.5 var(--font-sans);color:rgba(255,255,255,0.75)\">{{ iv.why }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <div style=\"margin-top:6px;padding:16px 18px;border-radius:8px;border:1px solid rgba(127,231,255,0.28);background:rgba(1,43,158,0.28)\">\n                <div style=\"font:500 clamp(14px,1.3vw,18px)/1.35 var(--font-sans);letter-spacing:-0.02em;color:#fff\">Все остальное можно переписать.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"margin-top:16px;display:flex;flex-direction:column;gap:12px;align-items:flex-start\">\n            <button type=\"button\" sc-camel-on-click=\"{{ ex22 }}\" style=\"padding:9px 16px;border-radius:100px;cursor:pointer;font:600 12px/1 var(--font-sans);transition:background 140ms cubic-bezier(.22,.61,.36,1);border:1px solid {{ ex22bd }};background:{{ ex22bg }};color:#7FE7FF\">{{ ex22label }}<\u002Fbutton>\n            <sc-if value=\"{{ ex22open }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"width:100%;padding:18px 20px;border-radius:8px;border:1px solid rgba(127,231,255,0.30);border-left:3px solid #7FE7FF;background:rgba(127,231,255,0.06)\">\n                <div style=\"font:600 10px/1 var(--font-sans);letter-spacing:0.10em;text-transform:uppercase;color:#7FE7FF;margin-bottom:10px\">Пример · как у автора<\u002Fdiv>\n                <div style=\"font:400 14px/1.55 var(--font-sans);color:rgba(255,255,255,0.80)\">У меня так добавлялись все три коннектора, все шесть кейсов генерации и четыре AI-клиента: коннекторы - за общим интерфейсом, кейсы - политикой и корпусом образцов, клиенты - записью в их настройках, без правки ядра. Новый инструмент без строки в реестре контрактов не проходит тесты - гард заставляет описать, что он отдает и что принимает.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ deep }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top:16px;padding:22px 24px;border-radius:8px;border:1px solid rgba(127,231,255,0.22);background:linear-gradient(180deg, rgba(1,43,158,0.30) 0%, rgba(15,23,36,0.6) 100%)\">\n              <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:#7FE7FF;margin-bottom:12px\">Подробно · как расширение не ломает систему<\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;font:400 14px/1.55 var(--font-sans);color:rgba(255,255,255,0.68)\">\n                <div><b style=\"color:#fff;font-weight:600\">Сверка с источником обязательна.<\u002Fb> Адаптер, который запоминает элементы, обязан уметь свериться: закрытое в чужой системе должно само уходить из очереди, а ошибка чтения не должна выглядеть как «все закрыто».<\u002Fdiv>\n                <div><b style=\"color:#fff;font-weight:600\">Наследовать, а не воспроизводить.<\u002Fb> Новый компонент подключается к общему механизму. Скопированная логика означает, что одну и ту же ошибку придется чинить по кругу в каждой копии.<\u002Fdiv>\n                <div><b style=\"color:#fff;font-weight:600\">Проверка инвариантов.<\u002Fb> Набор тестов на направление зависимостей и контракты: расширение, нарушившее инвариант, не собирается. Модель для сводок выбирается шлюзом по классу задачи - дешевая, сильная или локальная - без правки двойника.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- 25 · Разделитель Акт IV -->\n      <section data-screen-label=\"25 Разделитель - Акт IV\" style=\"flex:0 0 100%;height:100%;overflow-y:auto;overflow-x:hidden\">\n        <div style=\"max-width:1240px;margin:0 auto;padding:clamp(26px,4vw,64px);min-height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,0.8fr);gap:clamp(24px,4vw,56px);align-items:center\">\n          <div>\n            <div style=\"font:600 clamp(12px,1.3vw,15px)/1 var(--font-sans);letter-spacing:0.14em;color:#7FE7FF;margin-bottom:22px\">АКТ IV · ТВОЙ ДВОЙНИК<\u002Fdiv>\n            <h2 style=\"margin:0;font:500 clamp(30px,4vw,56px)/1.04 var(--font-sans);letter-spacing:-0.04em;color:#fff\">Геном собран. Осталась экспрессия<\u002Fh2>\n            <p style=\"margin:22px 0 0;max-width:460px;font:400 clamp(14px,1.15vw,17px)/1.5 var(--font-sans);color:rgba(255,255,255,0.45)\">Все пять генов горят. Дальше - как из одного генома получается именно твой двойник.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"height:min(46vh,420px)\">\n            <canvas ref=\"{{ actRef }}\" style=\"width:100%;height:100%;display:block\"><\u002Fcanvas>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- 26 · Свод: десять заповедей -->\n      <section data-screen-label=\"26 Свод: десять заповедей\" style=\"flex:0 0 100%;height:100%;overflow-y:auto;overflow-x:hidden\">\n        <div style=\"max-width:1240px;margin:0 auto;padding:clamp(24px,3.2vh,44px) clamp(26px,4vw,64px) 72px\">\n          <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:#7FE7FF;margin-bottom:14px\">Акт IV · глава 26 · несущая<\u002Fdiv>\n          <h2 style=\"margin:0 0 6px;font:500 clamp(28px,3.4vw,48px)/1.07 var(--font-sans);letter-spacing:-0.03em;color:#fff\">Правила, которые наследуются вместе с генами<\u002Fh2>\n          <p style=\"margin:0 0 18px;font:400 clamp(14px,1.2vw,17px)/1.5 var(--font-sans);color:rgba(255,255,255,0.72)\">Гены - что двойник умеет. Заповеди - почему он не разваливается.<\u002Fp>\n\n          <div style=\"display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,0.95fr);gap:18px;align-items:start\">\n            <div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px\">\n              <sc-for list=\"{{ commandments }}\" as=\"c\" hint-placeholder-count=\"10\">\n                <button type=\"button\" sc-camel-on-click=\"{{ c.onClick }}\" style=\"display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:13px 15px;border-radius:8px;cursor:pointer;transition:background 140ms cubic-bezier(.22,.61,.36,1);border:1px solid {{ c.bd }};background:{{ c.bg }};color:#fff\">\n                  <span style=\"width:8px;height:8px;border-radius:100px;flex:0 0 auto;background:{{ c.dot }};box-shadow:{{ c.glow }}\"><\u002Fspan>\n                  <span style=\"font:600 clamp(12px,1.05vw,14px)/1.3 var(--font-sans);color:#fff\">{{ c.n }}<\u002Fspan>\n                <\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n\n            <div style=\"display:grid;grid-template-columns:64px minmax(0,1fr);gap:14px;align-items:stretch\">\n              <div style=\"border-radius:8px;border:1px solid rgba(255,255,255,0.10);background:rgba(255,255,255,0.02);min-height:300px\">\n                <canvas ref=\"{{ commRef }}\" style=\"width:100%;height:100%;display:block\"><\u002Fcanvas>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:12px\">\n                <div style=\"padding:18px 20px;border-radius:8px;border:1px solid rgba(255,255,255,0.12);background:#0F1724\">\n                  <div style=\"font:600 10px/1 var(--font-sans);letter-spacing:0.10em;text-transform:uppercase;color:#7FE7FF;margin-bottom:10px\">{{ commGene }}<\u002Fdiv>\n                  <div style=\"font:400 clamp(14px,1.15vw,16px)/1.55 var(--font-sans);color:rgba(255,255,255,0.84)\">{{ commText }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"padding:18px 20px;border-radius:8px;border:1px solid rgba(127,231,255,0.28);background:rgba(1,43,158,0.28)\">\n                  <div style=\"font:500 clamp(15px,1.35vw,19px)/1.32 var(--font-sans);letter-spacing:-0.02em;color:#fff\">Гены можно скопировать за минуту. Заповеди - то, что было выстрадано, и именно они переезжают вместе с ДНК.<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"margin-top:16px;display:flex;flex-direction:column;gap:12px;align-items:flex-start\">\n            <button type=\"button\" sc-camel-on-click=\"{{ exComm }}\" style=\"padding:9px 16px;border-radius:100px;cursor:pointer;font:600 12px/1 var(--font-sans);transition:background 140ms cubic-bezier(.22,.61,.36,1);border:1px solid {{ exCommBd }};background:{{ exCommBg }};color:#7FE7FF\">{{ exCommLabel }}<\u002Fbutton>\n            <sc-if value=\"{{ exCommOpen }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"width:100%;padding:18px 20px;border-radius:8px;border:1px solid rgba(127,231,255,0.30);border-left:3px solid #7FE7FF;background:rgba(127,231,255,0.06)\">\n                <div style=\"font:600 10px/1 var(--font-sans);letter-spacing:0.10em;text-transform:uppercase;color:#7FE7FF;margin-bottom:10px\">Пример · как у автора<\u002Fdiv>\n                <div style=\"font:400 14px/1.55 var(--font-sans);color:rgba(255,255,255,0.80)\">У меня этих принципов двадцать восемь, и семнадцать из них подписаны решением или инцидентом - что именно сломалось и когда. Последние пять добавились за одну осень: движок стал службой, конфиг стал одним, решение человека стало карточкой.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ deep }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top:16px;padding:22px 24px;border-radius:8px;border:1px solid rgba(127,231,255,0.22);background:linear-gradient(180deg, rgba(1,43,158,0.30) 0%, rgba(15,23,36,0.6) 100%)\">\n              <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:#7FE7FF;margin-bottom:12px\">Подробно · происхождение свода и еще шесть заповедей<\u002Fdiv>\n              <div style=\"font:400 14px/1.55 var(--font-sans);color:rgba(255,255,255,0.68);margin-bottom:16px\">Каждая заповедь появилась после конкретной поломки, а не из теории. Еще шесть, давшиеся дороже всего:<\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px\">\n                <sc-for list=\"{{ commExtra }}\" as=\"e\" hint-placeholder-count=\"3\">\n                  <div style=\"padding:14px 16px;border-radius:8px;background:rgba(255,255,255,0.04);border-left:2px solid #7FE7FF\">\n                    <div style=\"font:600 13px/1.3 var(--font-sans);color:#fff;margin-bottom:8px\">{{ e.n }}<\u002Fdiv>\n                    <div style=\"font:400 13px/1.5 var(--font-sans);color:rgba(255,255,255,0.68)\">{{ e.t }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- 27 · Геном → экспрессия → фенотип -->\n      <section data-screen-label=\"27 Геном, экспрессия, фенотип\" style=\"flex:0 0 100%;height:100%;overflow-y:auto;overflow-x:hidden\">\n        <div style=\"max-width:1240px;margin:0 auto;padding:clamp(24px,3.2vh,44px) clamp(26px,4vw,64px) 72px\">\n          <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:#7FE7FF;margin-bottom:14px\">Акт IV · глава 27 · замковая<\u002Fdiv>\n          <h2 style=\"margin:0 0 8px;font:500 clamp(28px,3.4vw,48px)/1.07 var(--font-sans);letter-spacing:-0.03em;color:#fff\">Один геном - разные двойники<\u002Fh2>\n          <p style=\"margin:0 0 20px;font:400 clamp(14px,1.1vw,16px)/1.5 var(--font-sans);color:rgba(255,255,255,0.45)\">Переключи условия среды - и посмотри, во что разворачивается та же самая ДНК.<\u002Fp>\n\n          <div style=\"display:grid;grid-template-columns:minmax(0,0.85fr) minmax(0,1fr) minmax(0,1.15fr);gap:14px;align-items:stretch\">\n            <div style=\"padding:20px;border-radius:8px;border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.03);display:flex;flex-direction:column\">\n              <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.45);margin-bottom:14px\">Геном · общий<\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:8px;margin-bottom:14px\">\n                <div style=\"padding:10px 12px;border-radius:8px;background:rgba(255,255,255,0.04);font:400 13px/1.4 var(--font-sans);color:rgba(255,255,255,0.74)\">гены: память, стиль, факты, руки<\u002Fdiv>\n                <div style=\"padding:10px 12px;border-radius:8px;background:rgba(255,255,255,0.04);font:400 13px/1.4 var(--font-sans);color:rgba(255,255,255,0.74)\">правила: десять заповедей<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"flex:1 1 auto;min-height:120px\">\n                <canvas ref=\"{{ genomeBigRef }}\" style=\"width:100%;height:100%;display:block\"><\u002Fcanvas>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"padding:20px;border-radius:8px;border:1px solid rgba(127,231,255,0.30);background:linear-gradient(180deg, rgba(1,43,158,0.42) 0%, rgba(15,23,36,0.65) 100%)\">\n              <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:#7FE7FF;margin-bottom:14px\">Экспрессия · диалог<\u002Fdiv>\n              <div style=\"font:400 14px/1.5 var(--font-sans);color:rgba(255,255,255,0.76);margin-bottom:16px\">Разговор с наставником: кто ты, что пишешь, какие задачи, какие инструменты - и ДНК разворачивается под тебя.<\u002Fdiv>\n              <div style=\"font:600 10px/1 var(--font-sans);letter-spacing:0.10em;text-transform:uppercase;color:rgba(255,255,255,0.45);margin-bottom:10px\">Условия среды<\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:8px\">\n                <sc-for list=\"{{ profiles }}\" as=\"p\" hint-placeholder-count=\"3\">\n                  <button type=\"button\" sc-camel-on-click=\"{{ p.onClick }}\" style=\"width:100%;text-align:left;padding:11px 16px;border-radius:100px;cursor:pointer;transition:background 140ms cubic-bezier(.22,.61,.36,1);border:1px solid {{ p.bd }};background:{{ p.bg }};color:{{ p.fg }};font:600 13px/1 var(--font-sans)\">{{ p.n }}<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"margin-top:16px;padding:13px 15px;border-radius:8px;background:rgba(255,255,255,0.05);font:400 13px/1.5 var(--font-sans);color:rgba(255,255,255,0.70)\">{{ profileQ }}<\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"padding:20px;border-radius:8px;border:1px solid rgba(255,255,255,0.12);background:#0F1724\">\n              <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:#7FE7FF;margin-bottom:14px\">Фенотип · твой<\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:12px\">\n                <sc-for list=\"{{ phenotype }}\" as=\"r\" hint-placeholder-count=\"4\">\n                  <div>\n                    <div style=\"font:600 11px/1.2 var(--font-sans);letter-spacing:0.04em;color:rgba(255,255,255,0.45);margin-bottom:6px\">{{ r.k }}<\u002Fdiv>\n                    <div style=\"font:400 clamp(13px,1.1vw,15px)/1.45 var(--font-sans);color:#fff\">{{ r.v }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"margin-top:16px;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start\">\n            <div style=\"padding:20px 22px;border-radius:8px;border:1px solid rgba(127,231,255,0.28);background:rgba(1,43,158,0.28)\">\n              <div style=\"font:500 clamp(16px,1.5vw,21px)/1.3 var(--font-sans);letter-spacing:-0.02em;color:#fff\">Ты не настраиваешь программу. Ты отвечаешь на вопросы - двойник собирает себя сам.<\u002Fdiv><div style=\"margin-top:10px;font:400 13px/1.45 var(--font-sans);color:#FFC48A\">Экспрессию ведет наставник - прямо в твоем AI-клиенте. Автор нужен, только если захочешь поговорить.<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:12px;align-items:flex-start\">\n              <button type=\"button\" sc-camel-on-click=\"{{ ex20 }}\" style=\"padding:9px 16px;border-radius:100px;cursor:pointer;font:600 12px/1 var(--font-sans);transition:background 140ms cubic-bezier(.22,.61,.36,1);border:1px solid {{ ex20bd }};background:{{ ex20bg }};color:#7FE7FF\">{{ ex20label }}<\u002Fbutton>\n              <sc-if value=\"{{ ex20open }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"width:100%;padding:18px 20px;border-radius:8px;border:1px solid rgba(127,231,255,0.30);border-left:3px solid #7FE7FF;background:rgba(127,231,255,0.06)\">\n                  <div style=\"font:600 10px/1 var(--font-sans);letter-spacing:0.10em;text-transform:uppercase;color:#7FE7FF;margin-bottom:10px\">Пример · как у автора<\u002Fdiv>\n                  <div style=\"font:400 14px/1.55 var(--font-sans);color:rgba(255,255,255,0.80)\">Мой двойник - первый фенотип этой ДНК, и у меня их уже два: рабочий и личный, на одном геноме. Твой будет третьим: другой стиль, другие знания, другие руки.<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ deep }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top:16px;padding:22px 24px;border-radius:8px;border:1px solid rgba(127,231,255,0.22);background:linear-gradient(180deg, rgba(1,43,158,0.30) 0%, rgba(15,23,36,0.6) 100%)\">\n              <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:#7FE7FF;margin-bottom:12px\">Подробно · как устроен инсталлер<\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;font:400 14px/1.55 var(--font-sans);color:rgba(255,255,255,0.68)\">\n                <div><b style=\"color:#fff;font-weight:600\">Рельсовый диалог по фазам.<\u002Fb> Профиль → техсетап → методология → прием стиль-корпуса → интеграции → первый прогон. Порядок фиксирован: каждая фаза опирается на результат предыдущей.<\u002Fdiv>\n                <div><b style=\"color:#fff;font-weight:600\">Живой план и прогресс.<\u002Fb> Установка ведет собственный журнал: видно, что сделано и что осталось. Можно прерваться и продолжить с места остановки.<\u002Fdiv>\n                <div><b style=\"color:#fff;font-weight:600\">Два профиля поставки.<\u002Fb> Базовый - память, стиль и факты. С рабочими коннекторами - плюс «руки» к CRM, задачнику и почте.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- 28 · Геном растет -->\n      <section data-screen-label=\"28 Геном растет\" style=\"flex:0 0 100%;height:100%;overflow-y:auto;overflow-x:hidden\">\n        <div style=\"max-width:1240px;margin:0 auto;padding:clamp(24px,3.2vh,44px) clamp(26px,4vw,64px) 72px\">\n          <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:#7FE7FF;margin-bottom:14px\">Акт IV · глава 28<\u002Fdiv>\n          <h2 style=\"margin:0 0 10px;font:500 clamp(28px,3.4vw,48px)/1.07 var(--font-sans);letter-spacing:-0.03em;color:#fff\">ДНК эволюционирует <span style=\"vertical-align:middle;margin-left:10px;padding:5px 10px;border-radius:100px;border:1px solid rgba(255,196,138,0.55);font:600 10px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:#FFC48A\">кит в репетициях<\u002Fspan><\u002Fh2>\n          <p style=\"margin:0 0 18px;max-width:900px;font:400 clamp(14px,1.2vw,17px)/1.5 var(--font-sans);color:rgba(255,255,255,0.72)\">Новые способности сначала проверяются в бою на живом двойнике. Прижилось - закрепляется в геноме. Закрепилось - наследуют все.<\u002Fp>\n\n          <div style=\"height:clamp(120px,17vh,170px);margin-bottom:14px;border-radius:8px;border:1px solid rgba(255,255,255,0.10);background:rgba(255,255,255,0.02)\">\n            <canvas ref=\"{{ growRef }}\" style=\"width:100%;height:100%;display:block\"><\u002Fcanvas>\n          <\u002Fdiv>\n\n          <div style=\"display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px\">\n            <sc-for list=\"{{ horizons }}\" as=\"h\" hint-placeholder-count=\"4\">\n              <div style=\"padding:18px 20px;border-radius:8px;transition:border-color 140ms cubic-bezier(.22,.61,.36,1);border:1px solid {{ h.bd }};background:rgba(255,255,255,0.02)\">\n                <div style=\"min-height:24px;display:flex;align-items:flex-end;font:600 11px/1.1 var(--font-sans);letter-spacing:0.08em;margin-bottom:12px;color:{{ h.fg }}\">{{ h.n }}<\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:8px\">\n                  <sc-for list=\"{{ h.items }}\" as=\"it\" hint-placeholder-count=\"2\">\n                    <div sc-camel-on-mouse-enter=\"{{ it.onEnter }}\" style=\"padding:12px 14px;border-radius:8px;transition:background 140ms cubic-bezier(.22,.61,.36,1);border:1px solid {{ it.bd }};background:{{ it.bg }};font:400 14px/1.45 var(--font-sans);color:rgba(255,255,255,0.78)\">{{ it.t }}<\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"margin-top:16px;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start\">\n            <div style=\"padding:20px 22px;border-radius:8px;border:1px solid rgba(127,231,255,0.28);background:rgba(1,43,158,0.28)\">\n              <div style=\"font:500 clamp(16px,1.5vw,21px)/1.3 var(--font-sans);letter-spacing:-0.02em;color:#fff\">Ставишь двойника - получаешь все, что геном нарастит дальше.<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:12px;align-items:flex-start\">\n              <button type=\"button\" sc-camel-on-click=\"{{ ex21 }}\" style=\"padding:9px 16px;border-radius:100px;cursor:pointer;font:600 12px/1 var(--font-sans);transition:background 140ms cubic-bezier(.22,.61,.36,1);border:1px solid {{ ex21bd }};background:{{ ex21bg }};color:#7FE7FF\">{{ ex21label }}<\u002Fbutton>\n              <sc-if value=\"{{ ex21open }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"width:100%;padding:18px 20px;border-radius:8px;border:1px solid rgba(127,231,255,0.30);border-left:3px solid #7FE7FF;background:rgba(127,231,255,0.06)\">\n                  <div style=\"font:600 10px/1 var(--font-sans);letter-spacing:0.10em;text-transform:uppercase;color:#7FE7FF;margin-bottom:10px\">Пример · как у автора<\u002Fdiv>\n                  <div style=\"font:400 14px/1.55 var(--font-sans);color:rgba(255,255,255,0.80)\">Мой двойник пережил семь релизных волн и 61 принятый элемент за пять месяцев; после каждого разбора провала в геноме появлялся новый слой: факты и оркестрация, контур выхода, контракты инструментов, самоконтроль, служба, профиль, личный контур. Так и выглядит эволюция: провал → разбор → ген.<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ deep }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top:16px;padding:22px 24px;border-radius:8px;border:1px solid rgba(127,231,255,0.22);background:linear-gradient(180deg, rgba(1,43,158,0.30) 0%, rgba(15,23,36,0.6) 100%)\">\n              <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:#7FE7FF;margin-bottom:12px\">Подробно · эволюция без хаоса<\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;font:400 14px/1.55 var(--font-sans);color:rgba(255,255,255,0.68)\">\n                <div><b style=\"color:#fff;font-weight:600\">Релизные волны.<\u002Fb> Изменения идут волнами с тестами и возможностью отката, а не бесконечным потоком мелких правок.<\u002Fdiv>\n                <div><b style=\"color:#fff;font-weight:600\">Сначала на себе.<\u002Fb> Автор - первый испытатель каждой мутации: в геном попадает только то, что выжило в реальной работе.<\u002Fdiv>\n                <div><b style=\"color:#fff;font-weight:600\">Второй носитель генома.<\u002Fb> Он потребовал версий и журнала изменений - они появились вместе с китом. «Сделано» значит принято на живой машине автора, а не «написано».<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- 29 · Наставник -->\n      <section data-screen-label=\"29 Наставник\" style=\"flex:0 0 100%;height:100%;overflow-y:auto;overflow-x:hidden\">\n        <div style=\"max-width:1240px;margin:0 auto;padding:clamp(24px,3.2vh,44px) clamp(26px,4vw,64px) 72px\">\n          <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:#7FE7FF;margin-bottom:14px\">Акт IV · глава 29 · новая<\u002Fdiv>\n          <h2 style=\"margin:0 0 6px;font:500 clamp(28px,3.4vw,48px)/1.07 var(--font-sans);letter-spacing:-0.03em;color:#fff\">Инсталлер, который объясняет<\u002Fh2>\n          <p style=\"margin:0 0 18px;font:400 clamp(14px,1.2vw,17px)/1.5 var(--font-sans);color:rgba(255,255,255,0.72)\">Ты вставляешь один текст в Claude. Дальше с тобой разговаривает наставник.<\u002Fp>\n\n          <div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:18px;align-items:start\">\n            <div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px\">\n              <div style=\"padding:15px 17px;border-radius:8px;border:1px solid rgba(255,255,255,0.12);background:#0F1724\"><div style=\"font:600 11px/1.25 var(--font-sans);letter-spacing:0.06em;color:#7FE7FF;margin-bottom:9px\">СНАЧАЛА КАРТИНА<\u002Fdiv><div style=\"font:400 13px/1.5 var(--font-sans);color:rgba(255,255,255,0.72)\">перед каждым шагом - зачем он: что такое память, голос, карта, руки, пульт и врач. Термины - по мере появления, не списком<\u002Fdiv><\u002Fdiv>\n              <div style=\"padding:15px 17px;border-radius:8px;border:1px solid rgba(255,255,255,0.12);background:#0F1724\"><div style=\"font:600 11px/1.25 var(--font-sans);letter-spacing:0.06em;color:#7FE7FF;margin-bottom:9px\">ПОД ТВОЙ УРОВЕНЬ<\u002Fdiv><div style=\"font:400 13px/1.5 var(--font-sans);color:rgba(255,255,255,0.72)\">два вопроса в начале - и наставник знает, кто ты: новичок, уверенный пользователь или эксперт. Это меняет словарь, темп и число проверок. «Проще» или «короче» - меняют на ходу<\u002Fdiv><\u002Fdiv>\n              <button type=\"button\" sc-camel-on-click=\"{{ toggleHost }}\" style=\"display:flex;flex-direction:column;justify-content:flex-start;text-align:left;padding:15px 17px;border-radius:8px;cursor:pointer;transition:background 140ms cubic-bezier(.22,.61,.36,1);border:1px solid {{ hostBd }};background:{{ hostBg }}\">\n                <div style=\"font:600 11px/1.25 var(--font-sans);letter-spacing:0.06em;color:#7FE7FF;margin-bottom:9px\">ПРОВЕРЯЕТ, НЕ СПРАШИВАЕТ<\u002Fdiv>\n                <div style=\"font:400 13px/1.5 var(--font-sans);color:rgba(255,255,255,0.72)\">сам выясняет, что умеет там, где вы говорите: читать твою папку, выполнять команды. Умеет - делает и пересказывает. Нет - дает ровно одну команду за раз и читает ответ<\u002Fdiv>\n                <div style=\"margin-top:10px;font:600 10px/1 var(--font-sans);letter-spacing:0.06em;white-space:nowrap;color:rgba(127,231,255,0.75)\">три ветки ↓<\u002Fdiv>\n              <\u002Fbutton>\n              <div style=\"padding:15px 17px;border-radius:8px;border:1px solid rgba(255,255,255,0.12);background:#0F1724\"><div style=\"font:600 11px/1.25 var(--font-sans);letter-spacing:0.06em;color:#7FE7FF;margin-bottom:9px\">С НУЛЯ<\u002Fdiv><div style=\"font:400 13px/1.5 var(--font-sans);color:rgba(255,255,255,0.72)\">на машине пусто - поставит вместе с тобой терминал, инструменты, редактор заметок, сам кит. Каждый шаг: что сделать, что увидишь, как понять, что получилось<\u002Fdiv><\u002Fdiv>\n              <sc-if value=\"{{ hostOpen }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"grid-column:1 / -1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px\">\n                  <sc-for list=\"{{ hostBranches }}\" as=\"h\" hint-placeholder-count=\"3\">\n                    <div style=\"padding:12px 14px;border-radius:8px;background:rgba(0,106,251,0.12);border:1px solid rgba(127,231,255,0.30)\">\n                      <div style=\"font:600 12px/1.2 var(--font-sans);color:#fff;margin-bottom:6px\">{{ h.n }}<\u002Fdiv>\n                      <div style=\"font:400 12px/1.45 var(--font-sans);color:rgba(255,255,255,0.68)\">{{ h.t }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n\n            <div style=\"display:flex;flex-direction:column;gap:12px\">\n              <div style=\"padding:16px;border-radius:10px;border:1px solid rgba(255,255,255,0.10);background:rgba(255,255,255,0.02)\">\n                <div style=\"display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px\">\n                  <span style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;color:#7FE7FF\">ОДИН ШАГ · ПОСТАВИТЬ UV<\u002Fspan>\n                  <div style=\"display:flex;gap:4px;padding:4px;border-radius:100px;border:1px solid rgba(255,255,255,0.14);background:rgba(255,255,255,0.03)\">\n                    <sc-for list=\"{{ levels }}\" as=\"l\" hint-placeholder-count=\"3\">\n                      <button type=\"button\" sc-camel-on-click=\"{{ l.onClick }}\" style=\"padding:7px 13px;border:0;border-radius:100px;cursor:pointer;font:600 11px/1 var(--font-sans);transition:background 140ms cubic-bezier(.22,.61,.36,1);background:{{ l.bg }};color:{{ l.fg }}\">{{ l.n }}<\u002Fbutton>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:10px\">\n                  <div style=\"padding:13px 14px;border-radius:8px;transition:background 140ms cubic-bezier(.22,.61,.36,1);border:1px solid {{ novBd }};background:{{ novBg }}\">\n                    <div style=\"font:600 10px/1 var(--font-sans);letter-spacing:0.10em;text-transform:uppercase;color:rgba(255,255,255,0.45);margin-bottom:10px\">Новичку<\u002Fdiv>\n                    <div style=\"display:flex;flex-direction:column;gap:9px;font:400 12px/1.45 var(--font-sans);color:rgba(255,255,255,0.78)\">\n                      <div><b style=\"color:#7FE7FF;font-weight:600\">картина.<\u002Fb> uv ставит библиотеки, на которых работает движок; без него двойнику не на чем стоять<\u002Fdiv>\n                      <div><b style=\"color:#7FE7FF;font-weight:600\">команда.<\u002Fb> одна, наставник дает ее в чате: скопировать в Terminal и нажать Enter<\u002Fdiv>\n                      <div><b style=\"color:#7FE7FF;font-weight:600\">что увидишь.<\u002Fb> несколько строк и номер версии в конце; проверка - <code style=\"font:400 11px/1 ui-monospace,Menlo,monospace;color:#fff\">uv --version<\u002Fcode><\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"padding:13px 14px;border-radius:8px;transition:background 140ms cubic-bezier(.22,.61,.36,1);border:1px solid {{ expBd }};background:{{ expBg }}\">\n                    <div style=\"font:600 10px/1 var(--font-sans);letter-spacing:0.10em;text-transform:uppercase;color:rgba(255,255,255,0.45);margin-bottom:10px\">Эксперту<\u002Fdiv>\n                    <div style=\"font:400 12px/1.45 var(--font-sans);color:rgba(255,255,255,0.78)\">uv: поставить, проверить <code style=\"font:400 11px/1 ui-monospace,Menlo,monospace;color:#fff\">uv --version<\u002Fcode><\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"margin-top:10px;padding:13px 15px;border-radius:8px;background:rgba(255,255,255,0.04);border-left:2px solid #7FE7FF\">\n                  <div style=\"font:600 10px/1 var(--font-sans);letter-spacing:0.10em;text-transform:uppercase;color:rgba(255,255,255,0.42);margin-bottom:8px\">Так скажет наставник · {{ lvlName }}<\u002Fdiv>\n                  <div style=\"font:400 14px/1.5 var(--font-sans);color:rgba(255,255,255,0.86)\">{{ lvlSay }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"padding:18px 20px;border-radius:8px;border:1px solid rgba(127,231,255,0.28);background:rgba(1,43,158,0.28)\"><div style=\"font:500 clamp(15px,1.4vw,20px)/1.3 var(--font-sans);letter-spacing:-0.02em;color:#fff\">Ключи и пароли наставник не просит и не принимает. Ничего не удаляет без твоего «да». Отказ движка читает буквально - и переводит на человеческий.<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"margin-top:16px;display:flex;flex-direction:column;gap:12px;align-items:flex-start\">\n            <button type=\"button\" sc-camel-on-click=\"{{ exMent }}\" style=\"padding:9px 16px;border-radius:100px;cursor:pointer;font:600 12px/1 var(--font-sans);transition:background 140ms cubic-bezier(.22,.61,.36,1);border:1px solid {{ exMentBd }};background:{{ exMentBg }};color:#7FE7FF\">{{ exMentLabel }}<\u002Fbutton>\n            <sc-if value=\"{{ exMentOpen }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"width:100%;padding:18px 20px;border-radius:8px;border:1px solid rgba(127,231,255,0.30);border-left:3px solid #7FE7FF;background:rgba(127,231,255,0.06)\">\n                <div style=\"font:600 10px/1 var(--font-sans);letter-spacing:0.10em;text-transform:uppercase;color:#7FE7FF;margin-bottom:10px\">Пример · как у автора<\u002Fdiv>\n                <div style=\"font:400 14px/1.55 var(--font-sans);color:rgba(255,255,255,0.80)\">Мой наставник - текст на 72 строки, который вставляется в Claude, плюс восемь фаз рельсов и словарь из 32 терминов; команды и коды отказов в рельсах сверены с движком 27 тестами. Первые репетиции - с новичком на чистой учетке и с экспертом в терминале - впереди.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ deep }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top:16px;padding:22px 24px;border-radius:8px;border:1px solid rgba(127,231,255,0.22);background:linear-gradient(180deg, rgba(1,43,158,0.30) 0%, rgba(15,23,36,0.6) 100%)\">\n              <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:#7FE7FF;margin-bottom:12px\">Подробно · как устроена каждая фаза<\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;font:400 13px/1.55 var(--font-sans);color:rgba(255,255,255,0.68)\">\n                <div><b style=\"color:#fff;font-weight:600\">Форма фазы.<\u002Fb> Картина (новичку и эксперту - разные) → вопросы по одному, с «зачем» → делаем (сам или даю команду) → проверка (что увидишь) → если не вышло (коды отказов и перевод) → переход только после «да».<\u002Fdiv>\n                <div><b style=\"color:#fff;font-weight:600\">Два живых файла.<\u002Fb> Состояние установки записывается по ходу: прервался - продолжил с того же места.<\u002Fdiv>\n                <div><b style=\"color:#fff;font-weight:600\">Самодостаточный текст.<\u002Fb> Даже без папки кита, в веб-чате, промпт ведет по рельсам с нуля, пока кит не окажется на диске.<\u002Fdi
