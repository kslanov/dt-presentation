v>\n                <div><b style=\"color:#fff;font-weight:600\">Словарь.<\u002Fb> Все термины двойника - одной страницей, наставник ссылается на нее по мере появления слов.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- 30 · Установка изнутри -->\n      <section data-screen-label=\"30 Установка изнутри\" style=\"flex:0 0 100%;height:100%;overflow-y:auto;overflow-x:hidden\">\n        <div style=\"max-width:1240px;margin:0 auto;padding:clamp(24px,3.2vh,44px) clamp(26px,4vw,64px) 72px\">\n          <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:#7FE7FF;margin-bottom:14px\">Акт IV · глава 30<\u002Fdiv>\n          <h2 style=\"margin:0 0 8px;font:500 clamp(28px,3.4vw,48px)/1.07 var(--font-sans);letter-spacing:-0.03em;color:#fff\">Восемь фаз - один разговор<\u002Fh2>\n          <p style=\"margin:0 0 18px;font:400 clamp(14px,1.1vw,16px)/1.5 var(--font-sans);color:rgba(255,255,255,0.45)\">Клик по фазе - что спросит и что сделает. Фаза 3 раскрывается в десять шагов.<\u002Fp>\n\n          <div style=\"display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:14px\">\n            <sc-for list=\"{{ phases }}\" as=\"p\" hint-placeholder-count=\"8\">\n              <button type=\"button\" sc-camel-on-click=\"{{ p.onClick }}\" style=\"display:flex;flex-direction:column;justify-content:flex-start;text-align:left;padding:14px 13px;border-radius:8px;cursor:pointer;min-height:104px;transition:background 140ms cubic-bezier(.22,.61,.36,1);border:1px solid {{ p.bd }};background:{{ p.bg }};color:#fff\">\n                <div style=\"font:600 12px/1.2 var(--font-sans);color:#7FE7FF;margin-bottom:9px\">{{ p.n }}<\u002Fdiv>\n                <div style=\"font:400 12px/1.4 var(--font-sans);color:rgba(255,255,255,0.66)\">{{ p.t }}<\u002Fdiv>\n              <\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ phaseIsInstall }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-bottom:14px;padding:14px 16px;border-radius:10px;border:1px dashed rgba(127,231,255,0.35);background:rgba(0,106,251,0.06)\">\n              <div style=\"font:600 10px/1 var(--font-sans);letter-spacing:0.10em;text-transform:uppercase;color:#7FE7FF;margin-bottom:10px\">Фаза 3 · десять шагов одной командой<\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px\">\n                <sc-for list=\"{{ installSteps }}\" as=\"st\" hint-placeholder-count=\"10\">\n                  <div style=\"display:flex;align-items:center;gap:8px;padding:9px 11px;border-radius:8px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.10)\">\n                    <span style=\"width:15px;height:15px;flex:0 0 auto;border-radius:3px;border:1px solid rgba(18,212,148,0.7);display:flex;align-items:center;justify-content:center;font:600 10px/1 var(--font-sans);color:#12D494\">✓<\u002Fspan>\n                    <span style=\"font:400 12px/1.3 var(--font-sans);color:rgba(255,255,255,0.80)\">{{ st.num }} · {{ st.t }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-bottom:14px\">\n            <div style=\"padding:16px 18px;border-radius:8px;background:rgba(0,106,251,0.12);border:1px solid rgba(0,106,251,0.30)\">\n              <div style=\"font:600 10px/1 var(--font-sans);letter-spacing:0.10em;text-transform:uppercase;color:#7FE7FF;margin-bottom:10px\">{{ phaseName }} · вопросы к тебе<\u002Fdiv>\n              <div style=\"font:400 14px/1.5 var(--font-sans);color:rgba(255,255,255,0.82)\">{{ phaseAsk }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"padding:16px 18px;border-radius:8px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.12)\">\n              <div style=\"font:600 10px/1 var(--font-sans);letter-spacing:0.10em;text-transform:uppercase;color:rgba(255,255,255,0.45);margin-bottom:10px\">{{ phaseName }} · работа сама<\u002Fdiv>\n              <div style=\"font:400 14px/1.5 var(--font-sans);color:rgba(255,255,255,0.82)\">{{ phaseDoes }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"padding:18px 20px;border-radius:8px;border:1px solid rgba(127,231,255,0.28);background:rgba(1,43,158,0.28)\"><div style=\"font:500 clamp(15px,1.4vw,20px)/1.3 var(--font-sans);letter-spacing:-0.02em;color:#fff\">Терминал понадобится - но одна команда за раз, и наставник объяснит каждую.<\u002Fdiv><\u002Fdiv>\n\n          <div style=\"margin-top:16px;display:flex;flex-direction:column;gap:12px;align-items:flex-start\">\n            <button type=\"button\" sc-camel-on-click=\"{{ exInst }}\" style=\"padding:9px 16px;border-radius:100px;cursor:pointer;font:600 12px/1 var(--font-sans);transition:background 140ms cubic-bezier(.22,.61,.36,1);border:1px solid {{ exInstBd }};background:{{ exInstBg }};color:#7FE7FF\">{{ exInstLabel }}<\u002Fbutton>\n            <sc-if value=\"{{ exInstOpen }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"width:100%;padding:18px 20px;border-radius:8px;border:1px solid rgba(127,231,255,0.30);border-left:3px solid #7FE7FF;background:rgba(127,231,255,0.06)\">\n                <div style=\"font:600 10px/1 var(--font-sans);letter-spacing:0.10em;text-transform:uppercase;color:#7FE7FF;margin-bottom:10px\">Пример · как у автора<\u002Fdiv>\n                <div style=\"font:400 14px/1.55 var(--font-sans);color:rgba(255,255,255,0.80)\">На моей машине проверка установки показывает 10 из 10 - все шаги идемпотентны, повторный запуск ничего не трогает. Кит - 448 файлов, 2,4 МБ архив; перед сборкой гард приватности проверяет 242 термина.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ deep }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top:16px;padding:22px 24px;border-radius:8px;border:1px solid rgba(127,231,255,0.22);background:linear-gradient(180deg, rgba(1,43,158,0.30) 0%, rgba(15,23,36,0.6) 100%)\">\n              <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:#7FE7FF;margin-bottom:12px\">Подробно · как идет установка<\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;font:400 13px/1.55 var(--font-sans);color:rgba(255,255,255,0.68)\">\n                <div><b style=\"color:#fff;font-weight:600\">Десять повторяемых шагов.<\u002Fb> Каждый шаг можно запустить снова; установка продолжает с первого незавершенного.<\u002Fdiv>\n                <div><b style=\"color:#fff;font-weight:600\">Таблица «сделано / нет».<\u002Fb> Видна в любой момент: что уже стоит, что осталось.<\u002Fdiv>\n                <div><b style=\"color:#fff;font-weight:600\">Модели поиска.<\u002Fb> Самый долгий шаг: процент виден, обрыв докачивается.<\u002Fdiv>\n                <div><b style=\"color:#fff;font-weight:600\">Подключение клиента.<\u002Fb> Запись в его настройки; клиент перезапустится.<\u002Fdiv>\n                <div><b style=\"color:#fff;font-weight:600\">Снять установку.<\u002Fb> Одна команда; твои заметки и документы остаются на месте.<\u002Fdiv>\n                <div><b style=\"color:#fff;font-weight:600\">Что уже отработано.<\u002Fb> Все фазы пройдены на машине автора; первые установки у других людей - впереди.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- 31 · Как попробовать сегодня -->\n      <section data-screen-label=\"31 Как попробовать сегодня\" style=\"flex:0 0 100%;height:100%;overflow-y:auto;overflow-x:hidden\">\n        <div style=\"max-width:1240px;margin:0 auto;padding:clamp(24px,3.2vh,44px) clamp(26px,4vw,64px) 72px\">\n          <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:14px\">\n            <span style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:#7FE7FF\">Акт IV · глава 31<\u002Fspan>\n            <span style=\"padding:5px 10px;border-radius:100px;border:1px solid rgba(255,196,138,0.55);font:600 10px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:#FFC48A\">в репетициях<\u002Fspan>\n          <\u002Fdiv>\n          <h2 style=\"margin:0 0 20px;font:500 clamp(28px,3.4vw,48px)/1.07 var(--font-sans);letter-spacing:-0.03em;color:#fff\">Три шага<\u002Fh2>\n\n          <div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:16px\">\n            <div style=\"display:flex;flex-direction:column;gap:12px;padding:22px;border-radius:8px;border:1px solid rgba(127,231,255,0.30);background:linear-gradient(180deg, rgba(1,43,158,0.40) 0%, rgba(15,23,36,0.65) 100%)\">\n              <div style=\"font:500 clamp(26px,2.4vw,34px)/1 var(--font-sans);letter-spacing:-0.03em;color:#7FE7FF\">1<\u002Fdiv>\n              <div style=\"font:600 clamp(15px,1.3vw,18px)/1.35 var(--font-sans);color:#fff\">Получи кит<\u002Fdiv>\n              <a href=\"{{ kitUrl }}\" title=\"архив ~3 МБ, модели качаются при установке\" style=\"align-self:flex-start;padding:12px 22px;border-radius:100px;background:#006AFB;color:#fff;font:600 13px/1 var(--font-sans);letter-spacing:0.02em;box-shadow:0 12px 32px rgba(0,106,251,0.24)\">Получить кит<\u002Fa>\n              <div style=\"font:400 12px/1.4 var(--font-sans);color:rgba(255,255,255,0.5)\">архив ~3 МБ, модели качаются при установке<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:12px;padding:22px;border-radius:8px;border:1px solid rgba(255,255,255,0.12);background:#0F1724\">\n              <div style=\"font:500 clamp(26px,2.4vw,34px)/1 var(--font-sans);letter-spacing:-0.03em;color:rgba(127,231,255,0.9)\">2<\u002Fdiv>\n              <div style=\"font:600 clamp(15px,1.3vw,18px)/1.35 var(--font-sans);color:#fff\">Открой Claude и вставь текст INSTALL.md из кита<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:12px;padding:22px;border-radius:8px;border:1px solid rgba(255,255,255,0.12);background:#0F1724\">\n              <div style=\"font:500 clamp(26px,2.4vw,34px)/1 var(--font-sans);letter-spacing:-0.03em;color:rgba(127,231,255,0.9)\">3<\u002Fdiv>\n              <div style=\"font:600 clamp(15px,1.3vw,18px)/1.35 var(--font-sans);color:#fff\">Дальше ведет наставник<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"padding:22px 24px;border-radius:8px;border:1px solid rgba(255,196,138,0.30);background:rgba(255,122,89,0.07);margin-bottom:14px\">\n            <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:#FFC48A;margin-bottom:16px\">Честные ожидания<\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 26px\">\n              <sc-for list=\"{{ expect }}\" as=\"e\" hint-placeholder-count=\"6\">\n                <div style=\"display:flex;gap:10px;align-items:baseline\">\n                  <span style=\"width:14px;height:14px;flex:0 0 auto;border-radius:3px;border:1px solid rgba(255,196,138,0.6);display:flex;align-items:center;justify-content:center;font:600 10px/1 var(--font-sans);color:#FFC48A\">✓<\u002Fspan>\n                  <span style=\"font:400 clamp(14px,1.15vw,16px)/1.45 var(--font-sans);color:rgba(255,255,255,0.86)\">{{ e }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:stretch\">\n            <div style=\"padding:18px 20px;border-radius:8px;border:1px solid rgba(127,231,255,0.28);background:rgba(1,43,158,0.28)\"><div style=\"font:500 clamp(15px,1.4vw,20px)/1.3 var(--font-sans);letter-spacing:-0.02em;color:#fff\">Первый шаг стоит один вечер.<\u002Fdiv><\u002Fdiv>\n            <div style=\"display:flex;align-items:center;padding:18px 20px;border-radius:8px;border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.02);font:400 15px/1.5 var(--font-sans);color:rgba(255,255,255,0.72)\">Хочешь сначала поговорить - {{ contact }}.<\u002Fdiv>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ deep }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top:16px;padding:22px 24px;border-radius:8px;border:1px solid rgba(127,231,255,0.22);background:linear-gradient(180deg, rgba(1,43,158,0.30) 0%, rgba(15,23,36,0.6) 100%)\">\n              <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:#7FE7FF;margin-bottom:12px\">Подробно · требования, пауза, откат и что значит «в репетициях»<\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;font:400 13px/1.55 var(--font-sans);color:rgba(255,255,255,0.68)\">\n                <div><b style=\"color:#fff;font-weight:600\">Минимальные требования.<\u002Fb> Mac с macOS 14 или новее, Apple Silicon рекомендован.<\u002Fdiv>\n                <div><b style=\"color:#fff;font-weight:600\">Если прервался.<\u002Fb> Наставник продолжит с записанного прогресса - переспрашивать заново не придется.<\u002Fdiv>\n                <div><b style=\"color:#fff;font-weight:600\">Как снести начисто.<\u002Fb> Одна команда; твои документы и заметки остаются на месте.<\u002Fdiv>\n                <div><b style=\"color:#fff;font-weight:600\">«В репетициях».<\u002Fb> Кит проверен на машине автора; первые установки у других людей еще не прошли - автор на связи и правит рельсы по их замечаниям.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- 32 · Финал -->\n      <section data-screen-label=\"32 Финал\" style=\"flex:0 0 100%;height:100%;overflow-y:auto;overflow-x:hidden\">\n        <div style=\"max-width:900px;margin:0 auto;padding:clamp(26px,4vw,64px);min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:clamp(28px,7vh,72px);text-align:center\">\n          <h2 style=\"margin:0;font:500 clamp(30px,4.2vw,58px)/1.06 var(--font-sans);letter-spacing:-0.04em;color:#fff\">Двойник не покупается.<br>Он выращивается - из твоей ДНК.<br>Она уже у тебя.<\u002Fh2>\n          <div style=\"margin-top:38px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:center\">\n            <a href=\"{{ kitUrl }}\" style=\"padding:16px 30px;border-radius:100px;background:#006AFB;color:#fff;font:600 15px/1 var(--font-sans);letter-spacing:0.02em;box-shadow:0 12px 32px rgba(0,106,251,0.24)\">Получить кит<\u002Fa>\n            <button type=\"button\" sc-camel-on-click=\"{{ copyContact }}\" style=\"padding:16px 30px;border-radius:100px;border:1px solid rgba(127,231,255,0.45);background:rgba(127,231,255,0.08);color:#7FE7FF;cursor:pointer;font:600 15px/1 var(--font-sans);letter-spacing:0.02em\">{{ copyLabel }}<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"margin-top:22px;font:400 14px/1.5 var(--font-sans);color:rgba(255,255,255,0.45)\">Вопросы и пилот - {{ contact }}<\u002Fdiv>\n          <div style=\"width:100%;max-width:620px;height:clamp(120px,22vh,200px);margin-top:clamp(16px,3vh,34px)\">\n            <canvas ref=\"{{ finaleRef }}\" style=\"width:100%;height:100%;display:block\"><\u002Fcanvas>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <footer style=\"flex:0 0 auto;display:flex;align-items:center;gap:22px;padding:10px 26px 12px;border-top:1px solid rgba(255,255,255,0.10);background:rgba(3,5,7,0.9);z-index:6\">\n    <div style=\"flex:0 0 auto;display:flex;align-items:flex-end;gap:12px\">\n      <sc-for list=\"{{ tracker }}\" as=\"g\" hint-placeholder-count=\"5\">\n        <button type=\"button\" sc-camel-on-click=\"{{ g.onClick }}\" title=\"{{ g.hint }}\" style=\"display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:transparent;cursor:pointer;padding:0 2px\">\n          <span style=\"font:600 9px/1 var(--font-sans);letter-spacing:0.08em;transition:color 140ms cubic-bezier(.22,.61,.36,1);color:{{ g.labelFg }}\">{{ g.name }}<\u002Fspan>\n          <span style=\"width:14px;height:14px;border-radius:100px;transition:background 220ms cubic-bezier(.22,.61,.36,1);border:1px solid {{ g.ring }};background:{{ g.fill }};box-shadow:{{ g.glow }};transform:translateY({{ g.dy }})\"><\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div style=\"flex:1 1 auto;position:relative;height:34px\">\n      <svg sc-camel-view-box=\"0 0 1000 34\" sc-camel-preserve-aspect-ratio=\"none\" style=\"position:absolute;inset:0;width:100%;height:100%;overflow:visible\">\n        <path d=\"M0 17 C 62 2, 125 2, 187 17 S 312 32, 375 17 S 500 2, 562 17 S 687 32, 750 17 S 875 2, 937 17 S 1000 24, 1000 17\" fill=\"none\" stroke=\"rgba(127,231,255,0.22)\" stroke-width=\"1\"><\u002Fpath>\n        <path d=\"M0 17 C 62 32, 125 32, 187 17 S 312 2, 375 17 S 500 32, 562 17 S 687 2, 750 17 S 875 32, 937 17 S 1000 10, 1000 17\" fill=\"none\" stroke=\"rgba(0,106,251,0.30)\" stroke-width=\"1\"><\u002Fpath>\n      <\u002Fsvg>\n      <sc-for list=\"{{ chapterDots }}\" as=\"c\" hint-placeholder-count=\"6\">\n        <button type=\"button\" sc-camel-on-click=\"{{ c.onClick }}\" title=\"{{ c.label }}\" style=\"position:absolute;transform:translate(-50%,-50%);border:0;padding:0;cursor:pointer;border-radius:100px;transition:background 140ms cubic-bezier(.22,.61,.36,1),width 140ms,height 140ms;left:{{ c.x }};top:{{ c.y }};width:{{ c.size }};height:{{ c.size }};background:{{ c.bg }}\"><\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div style=\"flex:0 0 auto;display:flex;align-items:center;gap:10px\">\n      <sc-if value=\"{{ showMini }}\" hint-placeholder-val=\"{{ false }}\">\n        <button type=\"button\" sc-camel-on-click=\"{{ toggleMini }}\" title=\"Где мы в системе - развернуть компонентную схему\" style=\"display:flex;align-items:center;gap:9px;padding:5px 12px 5px 8px;border-radius:100px;cursor:pointer;border:1px solid rgba(127,231,255,0.32);background:rgba(127,231,255,0.06)\">\n          <span style=\"display:flex;flex-direction:column;gap:2px\">\n            <sc-for list=\"{{ miniRows }}\" as=\"row\" hint-placeholder-count=\"4\">\n              <span style=\"display:flex;gap:2px\">\n                <sc-for list=\"{{ row.cells }}\" as=\"c\" hint-placeholder-count=\"4\">\n                  <span style=\"width:5px;height:4px;border-radius:1px;border:1px solid {{ c.bd }};background:{{ c.bg }}\"><\u002Fspan>\n                <\u002Fsc-for>\n              <\u002Fspan>\n            <\u002Fsc-for>\n          <\u002Fspan>\n          <span style=\"font:600 10px/1.2 var(--font-sans);letter-spacing:0.04em;color:#7FE7FF;white-space:nowrap\">где мы<br>в системе<\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fsc-if>\n      <div style=\"font:600 12px/1.3 var(--font-sans);color:rgba(255,255,255,0.5);text-align:right;max-width:230px\">{{ chapterLabel }}<\u002Fdiv>\n      <button type=\"button\" sc-camel-on-click=\"{{ toggleToc }}\" title=\"Оглавление\" style=\"width:36px;height:30px;border-radius:100px;border:1px solid rgba(255,255,255,0.14);background:transparent;color:rgba(255,255,255,0.7);cursor:pointer;font:600 12px/1 var(--font-sans)\">≡<\u002Fbutton>\n      <button type=\"button\" sc-camel-on-click=\"{{ prev }}\" title=\"Назад\" style=\"width:40px;height:30px;border-radius:100px;border:1px solid rgba(255,255,255,0.14);background:transparent;color:#fff;cursor:pointer;font:400 14px/1 var(--font-sans)\">←<\u002Fbutton>\n      <button type=\"button\" sc-camel-on-click=\"{{ next }}\" title=\"Вперед\" style=\"width:40px;height:30px;border-radius:100px;border:1px solid rgba(255,255,255,0.14);background:transparent;color:#fff;cursor:pointer;font:400 14px/1 var(--font-sans)\">→<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n  <sc-if value=\"{{ miniOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:absolute;inset:0;background:rgba(3,5,7,0.90);backdrop-filter:blur(10px);z-index:11;display:flex;align-items:center;justify-content:center;padding:clamp(24px,4vw,56px)\">\n      <div style=\"width:100%;max-width:900px\">\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px\">\n          <div style=\"font:500 clamp(20px,2.2vw,28px)/1 var(--font-sans);letter-spacing:-0.03em;color:#fff\">Компонентная схема<\u002Fdiv>\n          <div style=\"display:flex;gap:8px\">\n            <button type=\"button\" sc-camel-on-click=\"{{ goPoster }}\" style=\"padding:8px 16px;border-radius:100px;border:1px solid rgba(127,231,255,0.45);background:rgba(127,231,255,0.08);color:#7FE7FF;cursor:pointer;font:600 12px/1 var(--font-sans)\">К главе 15<\u002Fbutton>\n            <button type=\"button\" sc-camel-on-click=\"{{ toggleMini }}\" style=\"padding:8px 16px;border-radius:100px;border:1px solid rgba(255,255,255,0.18);background:transparent;color:rgba(255,255,255,0.7);cursor:pointer;font:600 12px/1 var(--font-sans)\">Закрыть<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"margin:0 0 14px;font:400 14px/1.5 var(--font-sans);color:rgba(255,255,255,0.45)\">Подсвечены компоненты, о которых идет текущая глава. Клик по компоненту - переход в его главу.<\u002Fp>\n        <div style=\"display:flex;flex-direction:column;gap:8px\">\n          <sc-for list=\"{{ miniTiers }}\" as=\"tr\" hint-placeholder-count=\"4\">\n            <div style=\"padding:12px 14px;border-radius:8px;border:1px solid rgba(255,255,255,0.10);back            <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900}}\">\nconst CY = \"#7FE7FF\";\n\nconst CHAPTERS = [\n  { t: \"Обложка\", act: \"\" },\n  { t: \"Знакомая картина\", act: \"Акт I · Зачем\" },\n  { t: \"Почему чат не решает\", act: \"Акт I · Зачем\" },\n  { t: \"Софт, который принимает твою форму\", act: \"Акт I · Зачем\" },\n  { t: \"Что такое цифровой двойник\", act: \"Акт I · Зачем\" },\n  { t: \"Карта системы одним взглядом\", act: \"Акт I · Зачем\" },\n  { t: \"Разделитель - Акт II\", act: \"Акт II · Как с ним живут\" },\n  { t: \"День с двойником\", act: \"Акт II · Как с ним живут\" },\n  { t: \"Кейсы: тексты твоим голосом\", act: \"Акт II · Как с ним живут\" },\n  { t: \"Кейсы: документы под подпись\", act: \"Акт II · Как с ним живут\" },\n  { t: \"Кейсы: операционка\", act: \"Акт II · Как с ним живут\" },\n  { t: \"Личный контур\", act: \"Акт II · Как с ним живут\" },\n  { t: \"Четыре поверхности\", act: \"Акт II · Как с ним живут\" },\n  { t: \"Правила\", act: \"Акт II · Как с ним живут\" },\n  { t: \"Разделитель - Акт III\", act: \"Акт III · Как это устроено\" },\n  { t: \"Контекст: система и ее мир\", act: \"Акт III · Как это устроено\" },\n  { t: \"Компоненты и связи\", act: \"Акт III · Как это устроено\" },\n  { t: \"Инвентарь: из чего собрано\", act: \"Акт III · Как это устроено\" },\n  { t: \"Три контура данных\", act: \"Акт III · Как это устроено\" },\n  { t: \"Сквозной сценарий: путь знания\", act: \"Акт III · Как это устроено\" },\n  { t: \"Сквозной сценарий: путь документа и обратно\", act: \"Акт III · Как это устроено\" },\n  { t: \"Оркестрация и автономия\", act: \"Акт III · Как это устроено\" },\n  { t: \"Безопасность и приватность\", act: \"Акт III · Как это устро == i ? on : off,\n        bd: s.query === i ? onBd : offBd\n      })),\n      found: QUERIES[s.query].found,\n      foundWhy: QUERIES[s.query].why,\n\n      pipe: PIPE.map((p) => {\n        const blocked = !s.gateOk && (p.id === \"build\" || p.id === \"doc\");\n        const isGate = p.gate;\n        return {\n          n: p.n, t: p.t,\n          bg: isGate ? (s.gateOk ? \"rgba(0,106,251,0.20)\" : \"rgba(255,122,89,0.16)\") : (blocked ? \"rgba(255,255,255,0.02)\" : \"rgba(255,255,255,0.04)\"),\n          bd: isGate ? (s.gateOk ? onBd : \"rgba(255,196,138,0.6)\") : (blocked ? \"rgba(255,255,255,0.08)\" : offBd),\n          fg: blocked ? \"rgba(255,255,255,0.30)\" : \"#fff\",\n          sub: blocked ? \"rgba(255,255,255,0.22)\" : \"rgba(255,255,255,0.55)\"\n        };\n      }),\n      gateOk: s.gateOk,\n      gateOn: () => this.setState({ gateOk: true }),\n      gateOff: () => this.setState({ gateOk: false }),\n      gateBgOn: s.gateOk ? \"#006AFB\" : \"transparent\",\n      gateFgOn: s.gateOk ? \"#fff\" : \"rgba(255,255,255,0.55)\",\n      gateBgOff: s.gateOk ? \"transparent\" : \"#FF7A59\",\n      gateFgOff: s.gateOk ? \"rgba(255,255,255,0.55)\" : \"#030507\",\n      gateTitle: s.gateOk ? \"Конвейер доезжает\" : \"Конвейер останавливается\",\n      gateText: s.gateOk\n        ? \"Все нужные факты подняты и имеют адрес источника. Документ собирается и уходит к тебе вместе со следом происхождения.\"\n        : \"Не хватает одного значения - сборка не запускается вовсе. Вместо документа ты получаешь перечень недостающего: какой факт, из какого источника он должен прийти и что для этого нужно.\",\n      gateRule: s.gateOk ? CY : \"#FF7A59\",\n\n      auton: AUTON.map((a, i) => ({\n        n: a.n, t: a.t, when: a.when,\n        onEnter: () => this.setState({ auton: i }),\n        bg: s.auton === i ? on : off,\n        bd: s.auton === i ? onBd : offBd,\n        dot: s.auton === i ? CY : \"rgba(127,231,255,0.35)\"\n      })),\n      autonName: AUTON[s.auton].n,\n      aut
