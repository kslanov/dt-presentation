ё содержимое сам.<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"padding:22px;border-radius:8px;border:1px solid rgba(127,231,255,0.30);background:linear-gradient(180deg, rgba(1,43,158,0.40) 0%, rgba(15,23,36,0.65) 100%)\">\n              <div style=\"font:500 clamp(26px,2.4vw,34px)/1 var(--font-sans);letter-spacing:-0.03em;color:#7FE7FF;margin-bottom:14px\">3<\u002Fdiv>\n              <div style=\"font:600 clamp(15px,1.3vw,18px)/1.3 var(--font-sans);color:#fff;margin-bottom:10px\">Вставь установочный промпт — дальше диалог<\u002Fdiv>\n              <code style=\"display:inline-block;padding:7px 12px;border-radius:8px;background:rgba(255,255,255,0.08);border:1px solid rgba(127,231,255,0.24);font:400 12px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:#7FE7FF\">{{ promptToken }}<\u002Fcode>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px\">\n            <div style=\"padding:22px 24px;border-radius:8px;border:1px solid rgba(255,196,138,0.28);background:rgba(255,122,89,0.07)\">\n              <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:#FFC48A;margin-bottom:16px\">Честные ожидания<\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 26px;font:400 clamp(14px,1.15vw,16px)/1.5 var(--font-sans);color:rgba(255,255,255,0.82)\">\n                <div>Пока только Mac + Claude Desktop<\u002Fdiv>\n                <div>Разовая загрузка модели ~2 ГБ<\u002Fdiv>\n                <div>Интервью — 1–2 часа диалога<\u002Fdiv>\n                <div>Для стиля — 5–10 твоих документов на жанр<\u002Fdiv>\n                <div style=\"grid-column:1 / -1\">~6 ГБ на диске, подписка Claude<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"padding:22px 24px;border-radius:8px;border:1px solid rgba(127,231,255,0.28);background:rgba(1,43,158,0.28);display:flex;align-items:center\">\n              <div style=\"font:500 clamp(18px,1.8vw,26px)/1.25 var(--font-sans);letter-spacing:-0.02em;color:#fff\">Первый шаг стоит один вечер.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ deep }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top:16px;padding:22px 24px;border-radius:8px;border:1px solid rgba(127,231,255,0.22);background:linear-gradient(180deg, rgba(1,43,158,0.30) 0%, rgba(15,23,36,0.6) 100%)\">\n              <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:#7FE7FF;margin-bottom:12px\">Подробно · железо, пауза и откат<\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;font:400 14px/1.55 var(--font-sans);color:rgba(255,255,255,0.68)\">\n                <div><b style=\"color:#fff;font-weight:600\">Железо.<\u002Fb> Apple Silicon рекомендован: локальная модель поиска на нём работает заметно быстрее. Диска нужно около 6 ГБ с запасом на рост памяти.<\u002Fdiv>\n                <div><b style=\"color:#fff;font-weight:600\">Если прервался на середине.<\u002Fb> Установка ведёт журнал и продолжается с той фазы, на которой остановилась: ничего переспрашивать заново не придётся.<\u002Fdiv>\n                <div><b style=\"color:#fff;font-weight:600\">Если передумал.<\u002Fb> Сносится начисто: удаляется папка двойника и регистрация в Claude Desktop. Твои документы и заметки остаются на месте — они и так твои файлы.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- 24 · Финал -->\n      <section data-screen-label=\"24 Финал\" style=\"flex:0 0 100%;height:100%;overflow-y:auto;overflow-x:hidden\">\n        <div style=\"max-width:900px;margin:0 auto;padding:clamp(26px,4vw,64px);min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:clamp(28px,7vh,72px);text-align:center\">\n          <h2 style=\"margin:0;font:500 clamp(30px,4.2vw,58px)/1.06 var(--font-sans);letter-spacing:-0.04em;color:#fff\">Двойник не покупается.<br>Он выращивается — из твоей ДНК.<br>Она уже у тебя.<\u002Fh2>\n          <div style=\"margin-top:38px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:center\">\n            <a href=\"{{ kitUrl }}\" style=\"padding:16px 30px;border-radius:100px;background:#006AFB;color:#fff;font:600 15px/1 var(--font-sans);letter-spacing:0.02em;box-shadow:0 12px 32px rgba(0,106,251,0.24)\">Скачать Starter Kit<\u002Fa>\n            <button type=\"button\" sc-camel-on-click=\"{{ copyPrompt }}\" style=\"padding:16px 30px;border-radius:100px;border:1px solid rgba(127,231,255,0.45);background:rgba(127,231,255,0.08);color:#7FE7FF;cursor:pointer;font:600 15px/1 var(--font-sans);letter-spacing:0.02em\">{{ copyLabel }}<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"margin-top:22px;font:400 14px/1.5 var(--font-sans);color:rgba(255,255,255,0.45)\">Вопросы — {{ contact }}<\u002Fdiv>\n          <div style=\"width:100%;max-width:620px;height:clamp(120px,22vh,200px);margin-top:clamp(16px,3vh,34px)\">\n            <canvas ref=\"{{ finaleRef }}\" style=\"width:100%;height:100%;display:block\"><\u002Fcanvas>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <footer style=\"flex:0 0 auto;display:flex;align-items:center;gap:22px;padding:10px 26px 12px;border-top:1px solid rgba(255,255,255,0.10);background:rgba(3,5,7,0.9);z-index:6\">\n    <div style=\"flex:0 0 auto;display:flex;align-items:flex-end;gap:12px\">\n      <sc-for list=\"{{ tracker }}\" as=\"g\" hint-placeholder-count=\"5\">\n        <button type=\"button\" sc-camel-on-click=\"{{ g.onClick }}\" title=\"{{ g.hint }}\" style=\"display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:transparent;cursor:pointer;padding:0 2px\">\n          <span style=\"font:600 9px/1 var(--font-sans);letter-spacing:0.08em;transition:color 140ms cubic-bezier(.22,.61,.36,1);color:{{ g.labelFg }}\">{{ g.name }}<\u002Fspan>\n          <span style=\"width:14px;height:14px;border-radius:100px;transition:background 220ms cubic-bezier(.22,.61,.36,1);border:1px solid {{ g.ring }};background:{{ g.fill }};box-shadow:{{ g.glow }};transform:translateY({{ g.dy }})\"><\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div style=\"flex:1 1 auto;position:relative;height:34px\">\n      <svg sc-camel-view-box=\"0 0 1000 34\" sc-camel-preserve-aspect-ratio=\"none\" style=\"position:absolute;inset:0;width:100%;height:100%;overflow:visible\">\n        <path d=\"M0 17 C 62 2, 125 2, 187 17 S 312 32, 375 17 S 500 2, 562 17 S 687 32, 750 17 S 875 2, 937 17 S 1000 24, 1000 17\" fill=\"none\" stroke=\"rgba(127,231,255,0.22)\" stroke-width=\"1\"><\u002Fpath>\n        <path d=\"M0 17 C 62 32, 125 32, 187 17 S 312 2, 375 17 S 500 32, 562 17 S 687 2, 750 17 S 875 32, 937 17 S 1000 10, 1000 17\" fill=\"none\" stroke=\"rgba(0,106,251,0.30)\" stroke-width=\"1\"><\u002Fpath>\n      <\u002Fsvg>\n      <sc-for list=\"{{ chapterDots }}\" as=\"c\" hint-placeholder-count=\"6\">\n        <button type=\"button\" sc-camel-on-click=\"{{ c.onClick }}\" title=\"{{ c.label }}\" style=\"position:absolute;transform:translate(-50%,-50%);border:0;padding:0;cursor:pointer;border-radius:100px;transition:background 140ms cubic-bezier(.22,.61,.36,1),width 140ms,height 140ms;left:{{ c.x }};top:{{ c.y }};width:{{ c.size }};height:{{ c.size }};background:{{ c.bg }}\"><\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div style=\"flex:0 0 auto;display:flex;align-items:center;gap:10px\">\n      <div style=\"font:600 12px/1.3 var(--font-sans);color:rgba(255,255,255,0.5);text-align:right;max-width:230px\">{{ chapterLabel }}<\u002Fdiv>\n      <button type=\"button\" sc-camel-on-click=\"{{ toggleToc }}\" title=\"Оглавление\" style=\"width:36px;height:30px;border-radius:100px;border:1px solid rgba(255,255,255,0.14);background:transparent;color:rgba(255,255,255,0.7);cursor:pointer;font:600 12px/1 var(--font-sans)\">≡<\u002Fbutton>\n      <button type=\"button\" sc-camel-on-click=\"{{ prev }}\" title=\"Назад\" style=\"width:40px;height:30px;border-radius:100px;border:1px solid rgba(255,255,255,0.14);background:transparent;color:#fff;cursor:pointer;font:400 14px/1 var(--font-sans)\">←<\u002Fbutton>\n      <button type=\"button\" sc-camel-on-click=\"{{ next }}\" title=\"Вперёд\" style=\"width:40px;height:30px;border-radius:100px;border:1px solid rgba(255,255,255,0.14);background:transparent;color:#fff;cursor:pointer;font:400 14px/1 var(--font-sans)\">→<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n  <sc-if value=\"{{ tocOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:absolute;inset:0;background:rgba(3,5,7,0.9);backdrop-filter:blur(10px);z-index:12;display:flex;align-items:center;justify-content:center;padding:40px\">\n      <div style=\"width:100%;max-width:1000px\">\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-bottom:22px\">\n          <div style=\"font:500 28px/1 var(--font-sans);letter-spacing:-0.03em;color:#fff\">Оглавление<\u002Fdiv>\n          <button type=\"button\" sc-camel-on-click=\"{{ toggleToc }}\" style=\"padding:8px 16px;border-radius:100px;border:1px solid rgba(255,255,255,0.18);background:transparent;color:rgba(255,255,255,0.7);cursor:pointer;font:600 12px/1 var(--font-sans)\">Закрыть<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px\">\n          <sc-for list=\"{{ chapterDots }}\" as=\"c\" hint-placeholder-count=\"6\">\n            <button type=\"button\" sc-camel-on-click=\"{{ c.onClick }}\" style=\"display:flex;gap:14px;align-items:baseline;text-align:left;padding:13px 16px;border-radius:8px;cursor:pointer;transition:background 140ms cubic-bezier(.22,.61,.36,1);border:1px solid {{ c.tocBd }};background:{{ c.tocBg }};color:#fff\">\n              <span style=\"font:600 11px/1.4 var(--font-sans);width:20px;flex:0 0 auto;color:{{ c.numFg }}\">{{ c.num }}<\u002Fspan>\n              <span style=\"font:500 14px/1.35 var(--font-sans);color:#fff\">{{ c.label }}<\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900}}\">\nconst CY = \"#7FE7FF\";\n\nconst CHAPTERS = [\n  { t: \"Обложка\", act: \"\" },\n  { t: \"Знакомая картина\", act: \"Акт I · Зачем\" },\n  { t: \"Почему чат не решает\", act: \"Акт I · Зачем\" },\n  { t: \"Что такое цифровой двойник\", act: \"Акт I · Зачем\" },\n  { t: \"Карта системы одним взглядом\", act: \"Акт I · Зачем\" },\n  { t: \"Разделитель — Акт II\", act: \"Акт II · Как с ним живут\" },\n  { t: \"День с двойником\", act: \"Акт II · Как с ним живут\" },\n  { t: \"Кейсы: тексты твоим голосом\", act: \"Акт II · Как с ним живут\" },\n  { t: \"Кейсы: документы под подпись\", act: \"Акт II · Как с ним живут\" },\n  { t: \"Кейсы: операционка\", act: \"Акт II · Как с ним живут\" },\n  { t: \"Четыре поверхности\", act: \"Акт II · Как с ним живут\" },\n  { t: \"Правила\", act: \"Акт II · Как с ним живут\" },\n  { t: \"Разделитель — Акт III\", act: \"Акт III · Как это устроено\" },\n  { t: \"Архитектура сверху\", act: \"Акт III · Как это устроено\" },\n  { t: \"Три контура данных\", act: \"Акт III · Как это устроено\" },\n  { t: \"Память и поиск\", act: \"Акт III · Как это устроено\" },\n  { t: \"Факты и генерация\", act: \"Акт III · Как это устроено\" },\n  { t: \"Оркестрация и автономия\", act: \"Акт III · Как это устроено\" },\n  { t: \"Безопасность и приватность\", act: \"Акт III · Как это устроено\" },\n  { t: \"Разделитель — Акт IV\", act: \"Акт IV · Твой двойник\" },\n  { t: \"Геном → экспрессия → фенотип\", act: \"Акт IV · Твой двойник\" },\n  { t: \"Геном растёт\", act: \"Акт IV · Твой двойник\" },\n  { t: \"Установка изнутри\", act: \"Акт IV · Твой двойник\" },\n  { t: \"Три шага и честные ожидания\", act: \"Акт IV · Твой двойник\" },\n  { t: \"Финал\", act: \"Акт IV · Твой двойник\" }\n];\n\nconst PROFILES = [\n  { id: \"law\", n: \"юрист\", q: \"«Пишу заключения и меморандумы, держу в голове дела и позиции сторон»\",\n    rows: [\n      [\"Стиль\", \"сухой и ссылочный: формулировки из твоих заключений, оговорки на месте\"],\n      [\"Карта знаний\", \"дела, контрагенты, нормы, позиции сторон, прецеденты\"],\n      [\"Кейсы\", \"заключение · меморандум · позиция по спору · письмо оппоненту\"],\n      [\"Интеграции\", \"почта, файловый архив, календарь заседаний\"]\n    ] },\n  { id: \"sales\", n: \"продажник\", q: \"«Веду сделки, пишу клиентам и готовлю предложения»\",\n    rows: [\n      [\"Стиль\", \"короткие письма, живой тон, следующий шаг в последнем абзаце\"],\n      [\"Карта знаний\", \"клиенты, сделки, продукты, отрасли, история переговоров\"],\n      [\"Кейсы\", \"письмо клиенту · коммерческое предложение · план встречи · напоминание\"],\n      [\"Интеграции\", \"CRM, почта, задачник\"]\n    ] },\n  { id: \"res\", n: \"исследователь\", q: \"«Читаю много, пишу обзоры и доклады, слежу за гипотезами»\",\n    rows: [\n      [\"Стиль\", \"академичный: с оговорками, с разделением фактов и интерпретаций\"],\n      [\"Карта знаний\", \"темы, источники, гипотезы, эксперименты, открытые вопросы\"],\n      [\"Кейсы\", \"обзор литературы · исследовательская справка · доклад · заявка\"],\n      [\"Интеграции\", \"библиотека документов, заметки, календарь\"]\n    ] }\n];\n\nconst HORIZONS = [\n  { id: \"now\", n: \"В РАБОТЕ\", items: [\"двойник из любого AI-клиента, не только одного\", \"версии и миграции генома — обновление без переустановки\"] },\n  { id: \"plan\", n: \"В ПЛАНАХ\", items: [\"Windows и Linux\", \"персональный контур: дневник, личные заметки, жизнь за пределами работы\", \"новые «руки»: больше готовых коннекторов к почте, задачникам, CRM\"] },\n  { id: \"idea\", n: \"В ИДЕЯХ\", items: [\"обмен «мутациями» между двойниками: полезный кейс одного — в геном для всех\", \"рост автономии: от подтверждения каждого шага к доверенным классам операций\"] }\n];\n\nconst PHASES = [\n  { n: \"0 · Профиль\", t: \"кто ты, что пишешь, какие задачи\",\n    ask: \"Спросит: чем занимаешься, какие тексты пишешь чаще всего, какие задачи ведёшь и в каких системах.\",\n    does: \"Сам: соберёт из ответов профиль и предложит набор кейсов под него — соглашаться или менять будешь ты.\" },\n  { n: \"1 · Техника\", t: \"проверит окружение, поставит движок, скачает модель, проверит сам себя\",\n    ask: \"Спросит: куда положить папку двойника и разрешить ли загрузку локальной модели.\",\n    does: \"Сам: проверит окружение, поставит зависимости и движок, скачает модель, зарегистрируется в Claude Desktop и прогонит проверку.\" },\n  { n: \"2 · Методология\", t: \"спроектирует твои кейсы и карту знаний\",\n    ask: \"Спросит: какие сущности для тебя главные — клиенты, дела, темы, продукты — и как ты их называешь.\",\n    does: \"Сам: спроектирует структуру памяти под эти сущности и заведёт заготовки хабов и жанров.\" },\n  { n: \"3 · Стиль\", t: \"примет 5–10 твоих документов на жанр, соберёт твой голос\",\n    ask: \"Спросит: дай примеры своих текстов по каждому жанру — 5–10 на жанр.\",\n    does: \"Сам: разберёт их, выведет описание твоего голоса и покажет пробный текст на проверку.\" },\n  { n: \"4 · Интеграции\", t: \"по желанию: почта, задачник, CRM\",\n    ask: \"Спросит: подключать ли рабочие системы и что им разрешено — только читать или предлагать записи.\",\n    does: \"Сам: настроит коннекторы, поднимет зеркала и заведёт очередь подтверждений.\" },\n  { n: \"5 · Первый прогон\", t: \"первый артефакт твоим стилем — и ключи у тебя\",\n    ask: \"Спросит: с какой задачи начнём — письмо, справка или документ.\",\n    does: \"Сам: пройдёт весь путь целиком и отдаст результат вместе с объяснением, из чего он собран.\" }\n];\n\nconst ARCH = [\n  { id: \"kb\", n: \"БАЗА ЗНАНИЙ\", t: \"твои заметки и документы — простые текстовые файлы, источник истины\",\n    role: \"Единственное место, где живёт истина. Всё остальное система умеет пересобрать заново.\",\n    without: \"Знания оказываются заперты внутри чужого формата: их нельзя ни унести, ни прочитать без самой системы.\" },\n  { id: \"engine\", n: \"ДВИЖОК\", t: \"код: поиск, факты, генерация, интеграции, автономия\",\n    role: \"Читает базу, строит производное, собирает контекст, ходит во внешние системы и держит расписание.\",\n    without: \"Остаётся папка с файлами: всё нужно искать, сопоставлять и собирать руками.\" },\n  { id: \"derived\", n: \"ПРОИЗВОДНОЕ\", t: \"индексы, зеркала, кэши — то, что движок строит из базы\",\n    role: \"Ускоряет работу: поиск по смыслу, быстрые ответы, зеркала внешних систем. Живёт на конкретной машине.\",\n    without: \"Каждый вопрос требует полного прохода по корпусу — работать станет невозможно медленно.\" },\n  { id: \"ui\", n: \"ИНТЕРФЕЙСЫ\", t: \"диалог, командная строка, редактор заметок, пульт\",\n    role: \"Тонкие слои над одним ядром: любой интерфейс делает одно и то же через один и тот же движок.\",\n    without: \"Каждый интерфейс обзаводится своей логикой — и они начинают расходиться в поведении.\" }\n];\n\nconst CONTOURS = [\n  { id: \"know\", n: \"ЗНАНИЕВЫЙ\", steps: [\"заметки, письма, документы\", \"курирование\", \"память\", \"поиск и генерация\"],\n    mech: \"Курируется: на входе — отбор, потому что мусор в памяти превращается в мусор в генерации.\",\n    deep: \"Слои свежести: курированное важнее текущего сырья, сырьё важнее архива. Поиск ранжирует слои по-разному, поэтому свежее и проверенное всплывает первым.\" },\n  { id: \"oper\", n: \"ОПЕРАТИВНЫЙ\", steps: [\"рабочие файлы\", \"подъём в момент задачи\", \"факты\", \"документ\"],\n    mech: \"Не курируется вовсе: файл поднимается на лету под конкретную задачу, а факты живут отдельно от текста.\",\n    deep: \"Оперативный контур принципиально не пополняет память: он извлекает типизированные значения с адресом источника и отдаёт их конвейеру документа.\" },\n  { id: \"ops\", n: \"ОПЕРАЦИОННЫЙ\", steps: [\"задачи и сделки\", \"зеркало внешних систем\", \"очередь подтверждений\", \"запись\"],\n    mech: \"Двусторонний: состояние зеркалится в обе стороны, но запись наружу идёт только через очередь.\",\n    deep: \"Зеркало держит копию состояния внешних систем локально, чтобы работать без сети и не дёргать их на каждый вопрос; расхождения разрешаются в пользу внешней системы.\" }\n];\n\nconst KNOWPATH = [\n  { n: \"Захват\", t: \"телефон, почта, папки, файлы\" },\n  { n: \"Разбор и раскладка\", t: \"что это и куда положить\" },\n  { n: \"Связывание\", t: \"хабы: люди, проекты, темы\" },\n  { n: \"Индексация\", t: \"подготовка к поиску\" },\n  { n: \"Поиск\", t: \"по смыслу и по словам\" }\n];\n\nconst QUERIES = [\n  { q: \"что мы обещали по проекту Y\", found: [\"встреча 12.03 — договорённости\", \"письмо клиенту от 14.03\", \"хаб проекта Y — статус и сроки\"],\n    why: \"Совпадение по смыслу — «обещали» находит «договорённости» и «обязательства», хотя этих слов в запросе нет. Хаб проекта подтягивает связанные заметки.\" },\n  { q: \"кто отвечал за приёмку\", found: [\"хаб человека — роль в проекте\", \"протокол приёмки — участники\", \"переписка по этапу\"],\n    why: \"Работает связка: сущность-человек связана с проектом и с документами, поэтому ответ собирается из трёх разных мест сразу.\" },\n  { q: \"чем закончился спор по срокам\", found: [\"заметка после звонка\", \"письмо с итоговой позицией\", \"правка в графике\"],\n    why: \"Лексическая часть ловит точное слово «сроки», семантическая — «сдвиг», «перенос», «дедлайн». Результаты сливаются в один список.\" }\n];\n\nconst PIPE = [\n  { id: \"task\", n: \"Задача\", t: \"«собери документ»\" },\n  { id: \"plan\", n: \"План\", t: \"что нужно: факты, образец, контекст\" },\n  { id: \"lift\", n: \"Подъём источников\", t: \"таблицы и документы\" },\n  { id: \"facts\", n: \"Факты с адресами\", t: \"значение + откуда взято\" },\n  { id: \"gate\", n: \"Гейт\", t: \"всё ли есть?\", gate: true },\n  { id: \"build\", n: \"Сборка\", t: \"контекст + стиль + факты → текст\" },\n  { id: \"doc\", n: \"Документ\", t: \"и след происхождения\" }\n];\n\nconst AUTON = [\n  { n: \"Синхронизация\", t: \"подтянуть изменения и разложить новое\", when: \"часто, короткими проходами\" },\n  { n: \"Разбор захваченного\", t: \"превратить сырьё в заметки и задачи\", when: \"по мере поступления\" },\n  { n: \"Индексация\", t: \"тяжёлый проход по корпусу\", when: \"ночью, когда машина свободна\" },\n  { n: \"Зеркала\", t: \"сверить состояние внешних систем\", when: \"регулярно в течение дня\" }\n];\n\nconst SECLOCAL = [\n  { n: \"база знаний\", why: \"Это твои файлы на твоём диске. Наружу они не копируются — ни целиком, ни по частям «для ускорения».\" },\n  { n: \"индексы\", why: \"Производное от базы. Строится и хранится локально; на чужой стороне ему просто нечего делать.\" },\n  { n: \"факты\", why: \"Поднимаются из твоих документов в момент задачи и остаются в локальном хранилище с адресами источников.\" },\n  { n: \"журналы\", why: \"История действий — чувствительный след. Он нужен тебе для разбора и не нужен никому снаружи.\" },\n  { n: \"зеркала\", why: \"Локальная копия состояния твоих рабочих систем: позволяет работать без сети и не спрашивать их лишний раз.\" },\n  { n: \"модель поиска\", why: \"Поиск по смыслу работает локальной моделью, поэтому тексты не уезжают наружу даже ради поиска.\" }\n];\n\nconst DAY = [\n  { time: \"08:30\", t: \"«Что меня ждёт?» — бриф: встречи, дедлайны, что застряло\", who: \"Двойник собрал бриф сам, до того как ты сел за стол. Ты — прочитал и поправил приоритеты.\", stage: \"mem\" },\n  { time: \"10:00\", t: \"мысль по дороге — кинул с телефона, дальше она разберётся сама\", who: \"Ты — одна строка с телефона. Двойник — принял, распознал и отложил на разбор.\", stage: \"cap\" },\n  { time: \"14:00\", t: \"«Сделай справку по проекту» — готова, твоим стилем, с фактами\", who: \"Ты — сказал словами, что нужно. Двойник — собрал из памяти и документов и написал текст.\", stage: \"gen\" },\n  { time: \"17:30\", t: \"после встречи: «оформи договорённости» — задачи ушли на подтверждение\", who: \"Двойник — разобрал встречу и предложил задачи. Ты — подтверждаешь то, что согласен отдать в работу.\", stage: \"conf\" },\n  { time: \"ночью\", t: \"система сама разобрала, связала и проиндексировала день\", who: \"Двойник — один, по расписанию. Тебя не будили и ничего наружу не записывали.\", stage: \"und\" }\n];\n\nconst CYCLE = [\n  { id: \"cap\", n: \"ЗАХВАТ\" }, { id: \"und\", n: \"ПОНИМАНИЕ\" }, { id: \"mem\", n: \"ПАМЯТЬ\" },\n  { id: \"ops\", n: \"ОПЕРАЦИОНКА\" }, { id: \"gen\", n: \"ГЕНЕРАЦИЯ\" }, { id: \"conf\", n: \"ПОДТВЕРЖДЕНИЕ\" }\n];\n\nconst TEXTCASES = [\n  { id: \"letter\", name: \"Письмо\", sub: \"клиенту, партнёру, команде — твоим тоном, с историей отношений\",\n    req: \"«Ответь им по срокам — мягко, но без новых обещаний»\",\n    plain: \"Добрый день! Благодарим за обращение. Мы внимательно изучили ваш запрос и в ближайшее время вернёмся с ответом по срокам. С уважением, команда.\",\n    twin: \"По срокам: приёмка сдвигается на две недели — причина та же, о которой говорили весной. Предлагаю дату запуска не трогать, а перераспределить работы внутри этапа. Готов обсудить в четверг.\" },\n  { id: \"memo\", name: \"Справка для решения\", sub: \"резюме вперёд, аргументы, риски — как ты привык\",\n    req: \"«Нужна справка: идём в этот проект или нет»\",\n    result: \"Резюме первым абзацем — рекомендация и почему. Ниже: три аргумента за, два против, риски с оценкой и одно решение, которое требуется от тебя именно сейчас.\" },\n  { id: \"research\", name: \"        dot: s.day === i ? CY : \"rgba(255,255,255,0.28)\",\n        glow: s.day === i ? \"0 0 10px rgba(127,231,255,0.6)\" : \"none\",\n        fg: s.day === i ? \"#fff\" : \"rgba(255,255,255,0.62)\"\n      })),\n      daySel: daySel,\n      cycle: CYCLE.map((c) => ({\n        n: c.n,\n        bg: daySel.stage === c.id ? on : \"rgba(255,255,255,0.03)\",\n        bd: daySel.stage === c.id ? onBd : offBd,\n        fg: daySel.stage === c.id ? \"#fff\" : \"rgba(255,255,255,0.55)\"\n      })),\n\n      textcases: TEXTCASES.map((c) => ({\n        name: c.name, sub: c.sub, req: c.req,\n        result: c.id === \"letter\" ? (s.tcTwin ? c.twin : c.plain) : c.result,\n        hasToggle: c.id === \"letter\",\n        open: !!s.tcOpen[c.id],\n        hint: s.tcOpen[c.id] ? \"свернуть\" : \"запрос → результат\",\n        bd: s.tcOpen[c.id] ? onBd : offBd,\n        onClick: () => this.setState((st) => { const o = Object.assign({}, st.tcOpen); o[c.id] = !o[c.id]; return { tcOpen: o }; })\n      })),\n      twinOn: () => this.setState({ tcTwin: true }),\n      twinOff: () => this.setState({ tcTwin: false }),\n      twinBgOn: s.tcTwin ? \"#006AFB\" : \"transparent\",\n      twinFgOn: s.tcTwin ? \"#fff\" : \"rgba(255,255,255,0.55)\",\n      twinBgOff: s.tcTwin ? \"transparent\" : \"#006AFB\",\n      twinFgOff: s.tcTwin ? \"rgba(255,255,255,0.55)\" : \"#fff\",\n      twinNote: s.tcTwin ? \"Тот же запрос, тот же адресат — разница только в том, кто пишет.\" : \"Так отвечает чат без твоей истории: вежливо и ни о чём.\",\n\n      docfacts: DOCFACTS.map((f, i) => ({\n        label: f.label, value: f.value,\n        onEnter: () => this.setState({ fact: i }),\n        bg: s.fact === i ? (f.missing ? \"rgba(255,122,89,0.16)\" : on) : off,\n        bd: s.fact === i ? (f.missing ? \"rgba(255,196,138,0.55)\" : onBd) : offBd,\n        fg: f.missing ? \"#FFC48A\" : (s.fact === i ? CY : \"#fff\")\n      })),\n      factSrcTitle: factSel.missing ? \"Разрыв конвейера\" : \"Адрес источника\",\n      factSrc: factSel.src,\n      factSrcRule: factSel.missing ? \"#FF7A59\" : CY,\n      factSrcLabel: factSel.label,\n\n      ops: OPSLOOP.map((o2) => {\n        const skipped = s.opsAuto && (o2.id === \"offer\" || o2.id === \"you\");\n        return {\n          n: o2.n, t: o2.t,\n          bg: o2.me ? (s.opsAuto ? \"rgba(255,255,255,0.03)\" : \"rgba(0,106,251,0.22)\") : \"rgba(255,255,255,0.03)\",\n          bd: o2.me ? (s.opsAuto ? \"rgba(255,196,138,0.45)\" : CY) : offBd,\n          fg: skipped ? \"rgba(255,255,255,0.45)\" : \"#fff\",\n          note: o2.me ? (s.opsAuto ? \"рутина проходит мимо — остальное всё равно через тебя\" : \"мимо тебя дороги нет\") : \"\"\n        };\n      }),\n      opsAuto: s.opsAuto,\n      toggleOps: () => this.setState({ opsAuto: !s.opsAuto }),\n      opsBtnLabel: s.opsAuto ? \"рутину — автоматом\" : \"подтверждать всё\",\n      opsBtnBg: s.opsAuto ? \"rgba(255,122,89,0.14)\" : \"rgba(0,106,251,0.18)\",\n      opsBtnBd: s.opsAuto ? \"rgba(255,196,138,0.5)\" : onBd,\n      opsNote: s.opsAuto\n        ? \"Ступень доверия выше: рутинный класс операций записывается сам, но каждая такая запись остаётся в журнале, а всё нерутинное по-прежнему ждёт твоего «да».\"\n        : \"Стартовая ступень: любая запись во внешнюю систему проходит через тебя. Так двойник начинает работать у всех.\",\n\n      surfaces: SURFACES.map((f) => ({\n        n: f.n, sub: f.sub,\n        onClick: () => this.setState({ surface: f.id }),\n        bg: s.surface === f.id ? on : off,\n        bd: s.surface === f.id ? onBd : offBd\n      })),\n      surfName: surfSel.n,\n      surfSub: surfSel.sub,\n      surfRows: surfSel.rows.map((r) => ({ k: r[0], v: r[1] })),\n\n      rules: RULES.map((r, i) => ({\n        n: r.n, t: r.t,\n        onEnter: () => this.setState({ rule: i }),\n        bg: s.rule === i ? on : off,\n        bd: s.rule === i ? onBd : offBd\n      })),\n      ruleName: ruleSel.n,\n      ruleHow: ruleSel.how,\n\n      ex13: ex13.toggle, ex13open: ex13.open, ex13label: ex13.label, ex13bg: ex13.bg, ex13bd: ex13.bd,\n      ex14: ex14.toggle, ex14open: ex14.open, ex14label: ex14.label, ex14bg: ex14.bg, ex14bd: ex14.bd,\n      ex15: ex15.toggle, ex15open: ex15.open, ex15label: ex15.label, ex15bg: ex15.bg, ex15bd: ex15.bd,\n      ex16: ex16.toggle, ex16open: ex16.open, ex16label: ex16.label, ex16bg: ex16.bg, ex16bd: ex16.bd,\n      ex17: ex17.toggle, ex17open: ex17.open, ex17label: ex17.label, ex17bg: ex17.bg, ex17bd: ex17.bd,\n      ex18: ex18.toggle, ex18open: ex18.open, ex18label: ex18.label, ex18bg: ex18.bg, ex18bd: ex18.bd,\n\n      skipTech: () => this.go(19),\n\n      arch: ARCH.map((a) => ({\n        n: a.n, t: a.t,\n        onClick: () => this.setState({ arch: a.id }),\n        bg: s.arch === a.id ? on : off,\n        bd: s.arch === a.id ? onBd : offBd\n      })),\n      archName: archSel.n,\n      archRole: archSel.role,\n      archWithout: archSel.without,\n\n      contours: CONTOURS.map((c) => ({\n        n: c.n, mech: c.mech,\n        onClick: () => this.setState({ contour: c.id }),\n        bg: s.contour === c.id ? on : off,\n        bd: s.contour === c.id ? onBd : offBd,\n        steps: c.steps.map((st, i) => ({\n          t: st,\n          notLast: i !== c.steps.length - 1,\n          bg: s.contour === c.id ? \"rgba(127,231,255,0.10)\" : \"rgba(255,255,255,0.03)\",\n          bd: s.contour === c.id ? \"rgba(127,231,255,0.35)\" : \"rgba(255,255,255,0.10)\",\n          fg: s.contour === c.id ? \"#fff\" : \"rgba(255,255,255,0.55)\"\n        }))\n      })),\n      contourDeep: contourSel.deep,\n      contourName: contourSel.n,\n      contourMech: contourSel.mech,\n      techRef: this.techRef,\n\n      knowpath: KNOWPATH,\n      queries: QUERIES.map((q, i) => ({\n        q: q.q,\n        onClick: () => this.setState({ query: i }),\n        bg: s.query === i ? on : off,\n        bd: s.query === i ? onBd : offBd\n      })),\n      found: QUERIES[s.query].found,\n      foundWhy: QUERIES[s.query].why,\n\n      pipe: PIPE.map((p) => {\n        const blocked = !s.gateOk && (p.id === \"build\" || p.id === \"doc\");\n        const isGate = p.gate;\n        return {\n          n: p.n, t: p.t,\n          bg: isGate ? (s.gateOk ? \"rgba(0,106,251,0.20)\" : \"rgba(255,122,89,0.16)\") : (blocked ? \"rgba(255,255,255,0.02)\" : \"rgba(255,255,255,0.04)\"),\n          bd: isGate ? (s.gateOk ? onBd : \"rgba(255,196,138,0.6)\") : (blocked ? \"rgba(255,255,255,0.08)\" : offBd),\n          fg: blocked ? \"rgba(255,255,255,0.30)\" : \"#fff\",\n          sub: blocked ? \"rgba(255,255,255,0.22)\" : \"rgba(255,255,255,0.55)\"\n        };\n      }),\n      gateOk: s.gateOk,\n      gateOn: () => this.setState({ gateOk: true }),\n      gateOff: () => this.setState({ gateOk: false }),\n      gateBgOn: s.gateOk ? \"#006AFB\" : \"transparent\",\n      gateFgOn: s.gateOk ? \"#fff\" : \"rgba(255,255,255,0.55)\",\n      gateBgOff: s.gateOk ? \"transparent\" : \"#FF7A59\",\n      gateFgOff: s.gateOk ? \"rgba(255,255,255,0.55)\" : \"#030507\",\n      gateTitle: s.gateOk ? \"Конвейер доезжает\" : \"Конвейер останавливается\",\n      gateText: s.gateOk\n        ? \"Все нужные факты подняты и имеют адрес источника. Документ собирается и уходит к тебе вместе со следом происхождения.\"\n        : \"Не хватает одного значения — сборка не запускается вовсе. Вместо документа ты получаешь перечень недостающего: какой факт, из какого источника он должен прийти и что для этого нужно.\",\n      gateRule: s.gateOk ? CY : \"#FF7A59\",\n\n      auton: AUTON.map((a, i) => ({\n        n: a.n, t: a.t, when: a.when,\n        onEnter: () => this.setState({ auton: i }),\n        bg: s.auton === i ? on : off,\n        bd: s.auton === i ? onBd : offBd,\n        dot: s.auton === i ? CY : \"rgba(127,231,255,0.35)\"\n      })),\n      autonName: AUTON[s.auton].n,\n      autonWhen: AUTON[s.auton].when,\n      autonText: AUTON[s.auton].t,\n\n      seclocal: SECLOCAL.map((x, i) => ({\n        n: x.n,\n        onEnter: () => this.setState({ sec: i, secArrow: false }),\n        bg: s.sec === i && !s.secArrow ? on : off,\n        bd: s.sec === i && !s.secArrow ? onBd : offBd\n      })),\n      secArrowClick: () => this.setState({ secArrow: true }),\n      secArrowBd: s.secArrow ? CY : \"rgba(127,231,255,0.35)\",\n      secTitle: s.secArrow ? \"Из чего состоит запрос к облаку\" : \"Почему это не может уехать · \" + SECLOCAL[s.sec].n,\n      secText: s.secArrow\n        ? \"Три части: сам вопрос, подобранный под него кусок контекста — обычно несколько фрагментов заметок и поднятые факты — и указание, в каком жанре писать. Ни базы, ни индексов, ни журналов в запросе нет; помеченное приватным исключено ещё до сборки.\"\n        : SECLOCAL[s.sec].why,\n\n      ex20: ex20.toggle, ex20open: ex20.open, ex20label: ex20.label, ex20bg: ex20.bg, ex20bd: ex20.bd,\n      ex21: ex21.toggle, ex21open: ex21.open, ex21label: ex21.label, ex21bg: ex21.bg, ex21bd: ex21.bd,\n\n      finaleRef: this.finaleRef,\n      actRef: this.actRef,\n      genomeBigRef: this.genomeBigRef,\n      growRef: this.growRef,\n\n      profiles: PROFILES.map((p, i) => ({\n        n: p.n,\n        onClick: () => this.setState({ profile: i }),\n        bg: s.profile === i ? \"#006AFB\" : \"transparent\",\n        bd: s.profile === i ? \"#006AFB\" : \"rgba(255,255,255,0.18)\",\n        fg: s.profile === i ? \"#fff\" : \"rgba(255,255,255,0.66)\"\n      })),\n      profileQ: PROFILES[s.profile].q,\n      phenotype: PROFILES[s.profile].rows.map((r) => ({ k: r[0], v: r[1] })),\n\n      horizons: HORIZONS.map((h) => ({\n        n: h.n,\n        items: h.items.map((it) => ({\n          t: it,\n          onEnter: () => this.setState({ horizon: h.id }),\n          bd: s.horizon === h.id ? onBd : \"rgba(255,255,255,0.14)\",\n          bg: s.horizon === h.id ? \"rgba(0,106,251,0.14)\" : \"rgba(255,255,255,0.03)\"\n        })),\n        bd: s.horizon === h.id ? onBd : offBd,\n        fg: s.horizon === h.id ? CY : \"rgba(255,255,255,0.45)\"\n      })),\n\n      phases: PHASES.map((p, i) => ({\n        n: p.n, t: p.t,\n        onClick: () => this.setState({ phase: i }),\n        bg: s.phase === i ? on : off,\n        bd: s.phase === i ? onBd : offBd\n      })),\n      phaseName: PHASES[s.phase].n,\n      phaseAsk: PHASES[s.phase].ask,\n      phaseDoes: PHASES[s.phase].does,\n\n      kitUrl: \"{\" + \"{KIT_URL}\" + \"}\",\n      promptToken: \"{\" + \"{INSTALL_PROMPT}\" + \"}\",\n      copyPrompt: () => this.copyPrompt(),\n      copyLabel: s.copied ? \"Скопировано\" : \"Скопировать установочный промпт\"\n    };\n  }\n}\n<\u002Fscript>\n\n\n\n\n\n\n\n\n\n\n\n\n\n<\u002Fbody><\u002Fhtml>"
