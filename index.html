verflow-y:auto;overflow-x:hidden\">\n        <div style=\"max-width:1240px;margin:0 auto;padding:clamp(24px,3.2vh,44px) clamp(26px,4vw,64px) 72px\">\n          <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:#7FE7FF;margin-bottom:14px\">Акт II · глава 9<\u002Fdiv>\n          <h2 style=\"margin:0 0 8px;font:500 clamp(28px,3.4vw,48px)/1.07 var(--font-sans);letter-spacing:-0.03em;color:#fff\">Одна команда - документ под подпись<\u002Fh2>\n          <p style=\"margin:0 0 20px;font:400 clamp(14px,1.1vw,16px)/1.5 var(--font-sans);color:rgba(255,255,255,0.45)\">Наведи на цифру в документе - подсветится ее источник. Цифры в примере синтетические.<\u002Fp>\n\n          <div style=\"display:grid;grid-template-columns:minmax(0,1fr) 40px minmax(0,1fr) 40px minmax(0,1fr);align-items:center;gap:0;margin-bottom:16px\">\n            <div style=\"padding:18px 20px;border-radius:8px;border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.03)\">\n              <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.42);margin-bottom:12px\">1 · Источники<\u002Fdiv>\n              <div style=\"font:400 14px/1.5 var(--font-sans);color:rgba(255,255,255,0.72)\">«Собери коммерческое предложение по проекту X» - двойник поднимает исходные файлы: смету, график, договор-образец.<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"text-align:center;font:400 16px/1 var(--font-sans);color:rgba(127,231,255,0.6)\">→<\u002Fdiv>\n            <div style=\"padding:18px 20px;border-radius:8px;border:1px solid rgba(127,231,255,0.28);background:rgba(1,43,158,0.22)\">\n              <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:#7FE7FF;margin-bottom:12px\">2 · Цифры с адресами<\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:8px\">\n                <sc-for list=\"{{ docfacts }}\" as=\"f\" hint-placeholder-count=\"4\">\n                  <button type=\"button\" sc-camel-on-mouse-enter=\"{{ f.onEnter }}\" sc-camel-on-click=\"{{ f.onEnter }}\" style=\"display:flex;justify-content:space-between;align-items:baseline;gap:12px;width:100%;text-align:left;padding:10px 12px;border-radius:8px;cursor:default;transition:background 140ms cubic-bezier(.22,.61,.36,1);border:1px solid {{ f.bd }};background:{{ f.bg }}\">\n                    <span style=\"font:400 13px/1.3 var(--font-sans);color:rgba(255,255,255,0.62)\">{{ f.label }}<\u002Fspan>\n                    <span style=\"font:600 13px/1.3 var(--font-sans);white-space:nowrap;color:{{ f.fg }}\">{{ f.value }}<\u002Fspan>\n                  <\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"text-align:center;font:400 16px/1 var(--font-sans);color:rgba(127,231,255,0.6)\">→<\u002Fdiv>\n            <div style=\"padding:18px 20px;border-radius:8px;border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.03)\">\n              <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.42);margin-bottom:12px\">3 · Документ<\u002Fdiv>\n              <div style=\"font:400 14px/1.5 var(--font-sans);color:rgba(255,255,255,0.72)\">Собран по твоему образцу: разделы на месте, цифры проставлены, формулировки - твои. Остается прочитать и подписать. Файл ложится в рабочую папку, а в памяти остается след: из чего собран.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start\">\n            <div style=\"padding:18px 20px;border-radius:8px;background:rgba(255,255,255,0.04);border-left:2px solid {{ factSrcRule }}\">\n              <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.42);margin-bottom:8px\">{{ factSrcTitle }} · {{ factSrcLabel }}<\u002Fdiv>\n              <div style=\"font:400 15px/1.5 var(--font-sans);color:rgba(255,255,255,0.80)\">{{ factSrc }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"padding:20px 22px;border-radius:8px;border:1px solid rgba(127,231,255,0.28);background:rgba(1,43,158,0.28)\">\n              <div style=\"font:500 clamp(17px,1.55vw,22px)/1.3 var(--font-sans);letter-spacing:-0.02em;color:#fff\">Недостающий факт - это вопрос тебе, а не повод для фантазии.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"margin-top:16px;display:flex;flex-direction:column;gap:12px;align-items:flex-start\">\n            <button type=\"button\" sc-camel-on-click=\"{{ ex8 }}\" style=\"padding:9px 16px;border-radius:100px;cursor:pointer;font:600 12px/1 var(--font-sans);transition:background 140ms cubic-bezier(.22,.61,.36,1);border:1px solid {{ ex8bd }};background:{{ ex8bg }};color:#7FE7FF\">{{ ex8label }}<\u002Fbutton>\n            <sc-if value=\"{{ ex8open }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"width:100%;padding:18px 20px;border-radius:8px;border:1px solid rgba(127,231,255,0.30);border-left:3px solid #7FE7FF;background:rgba(127,231,255,0.06)\">\n                <div style=\"font:600 10px/1 var(--font-sans);letter-spacing:0.10em;text-transform:uppercase;color:#7FE7FF;margin-bottom:10px\">Пример · как у автора<\u002Fdiv>\n                <div style=\"font:400 14px/1.55 var(--font-sans);color:rgba(255,255,255,0.80)\">Реальный случай: «КП под подпись» по сложному проекту. Раньше ~15 итераций диалога; теперь 1 команда, цифры из исходного xlsx не спутаны, на выходе .docx. Фактов в памяти 2,9 тыс., у каждого адрес до ячейки и две даты. А один провал этой осени - документ с фактом, противоположным письму, - закрыт проверкой полноты: теперь система сама скажет, что ответ контрагента не дочитан.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ deep }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top:16px;padding:22px 24px;border-radius:8px;border:1px solid rgba(127,231,255,0.22);background:linear-gradient(180deg, rgba(1,43,158,0.30) 0%, rgba(15,23,36,0.6) 100%)\">\n              <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:#7FE7FF;margin-bottom:12px\">Подробно · откуда берутся цифры и что такое честный отказ<\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;font:400 14px/1.55 var(--font-sans);color:rgba(255,255,255,0.68)\">\n                <div><b style=\"color:#fff;font-weight:600\">Адрес до ячейки и две даты.<\u002Fb> Каждое число поднимается из реальной таблицы с адресом источника. У факта две даты - с какой он действует и когда система о нем узнала: «какая была цена в марте» отвечается на март, новая версия вытесняет старую, не стирая ее.<\u002Fdiv>\n                <div><b style=\"color:#fff;font-weight:600\">Честный отказ.<\u002Fb> Не хватает данных - документ не собирается вовсе: вместо него ты получаешь перечень недостающего. Заглушек и «примерных» цифр не бывает.<\u002Fdiv>\n                <div><b style=\"color:#fff;font-weight:600\">След происхождения.<\u002Fb> У готового документа сохраняется состав: какие файлы и какие заметки в него вошли, откуда каждое число.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- 10 · Операционка -->\n      <section data-screen-label=\"10 Операционка\" style=\"flex:0 0 100%;height:100%;overflow-y:auto;overflow-x:hidden\">\n        <div style=\"max-width:1240px;margin:0 auto;padding:clamp(24px,3.2vh,44px) clamp(26px,4vw,64px) 72px\">\n          <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:#7FE7FF;margin-bottom:14px\">Акт II · глава 10<\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:20px\">\n            <div>\n              <h2 style=\"margin:0 0 8px;font:500 clamp(28px,3.4vw,48px)/1.07 var(--font-sans);letter-spacing:-0.03em;color:#fff\">Задачи, сделки, договоренности<\u002Fh2>\n              <p style=\"margin:0;font:400 clamp(14px,1.1vw,16px)/1.5 var(--font-sans);color:rgba(255,255,255,0.45)\">Открой карточку - что двойник подобрал сам, а что осталось человеку.<\u002Fp>\n            <\u002Fdiv>\n            <button type=\"button\" sc-camel-on-click=\"{{ toggleOps }}\" style=\"padding:11px 20px;border-radius:100px;cursor:pointer;font:600 12px/1 var(--font-sans);white-space:nowrap;transition:background 140ms cubic-bezier(.22,.61,.36,1);border:1px solid {{ opsBtnBd }};background:{{ opsBtnBg }};color:#fff\">{{ opsBtnLabel }}<\u002Fbutton>\n          <\u002Fdiv>\n\n          <div style=\"display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:14px\">\n            <sc-for list=\"{{ ops }}\" as=\"o\" hint-placeholder-count=\"6\">\n              <div style=\"padding:16px 14px;border-radius:8px;transition:background 140ms cubic-bezier(.22,.61,.36,1);border:1px solid {{ o.bd }};background:{{ o.bg }};display:flex;flex-direction:column;gap:8px;min-height:118px\">\n                <span style=\"font:600 13px/1.2 var(--font-sans);color:{{ o.fg }}\">{{ o.n }}<\u002Fspan>\n                <span style=\"font:400 13px/1.4 var(--font-sans);color:rgba(255,255,255,0.58)\">{{ o.t }}<\u002Fspan>\n                <span style=\"margin-top:auto;font:400 11px/1.3 var(--font-sans);color:#7FE7FF\">{{ o.note }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;align-items:start\">\n            <div style=\"padding:18px 20px;border-radius:8px;background:rgba(255,255,255,0.04);border-left:2px solid #7FE7FF\">\n              <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.42);margin-bottom:8px\">Карточка поручения<\u002Fdiv>\n              <div style=\"font:400 15px/1.5 var(--font-sans);color:rgba(255,255,255,0.80)\">{{ opsNote }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"padding:20px 22px;border-radius:8px;border:1px solid rgba(127,231,255,0.28);background:rgba(1,43,158,0.28)\">\n              <div style=\"font:500 clamp(17px,1.55vw,22px)/1.3 var(--font-sans);letter-spacing:-0.02em;color:#fff\">Двойник читает и готовит. В рабочие системы пишут люди.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"margin-top:16px;display:flex;flex-direction:column;gap:12px;align-items:flex-start\">\n            <button type=\"button\" sc-camel-on-click=\"{{ ex9 }}\" style=\"padding:9px 16px;border-radius:100px;cursor:pointer;font:600 12px/1 var(--font-sans);transition:background 140ms cubic-bezier(.22,.61,.36,1);border:1px solid {{ ex9bd }};background:{{ ex9bg }};color:#7FE7FF\">{{ ex9label }}<\u002Fbutton>\n            <sc-if value=\"{{ ex9open }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"width:100%;padding:18px 20px;border-radius:8px;border:1px solid rgba(127,231,255,0.30);border-left:3px solid #7FE7FF;background:rgba(127,231,255,0.06)\">\n                <div style=\"font:600 10px/1 var(--font-sans);letter-spacing:0.10em;text-transform:uppercase;color:#7FE7FF;margin-bottom:10px\">Пример · как у автора<\u002Fdiv>\n                <div style=\"font:400 14px/1.55 var(--font-sans);color:rgba(255,255,255,0.80)\">У меня CRM (Timetta) ведет администратор: захват с телефона превращается в карточку «поручение администратору» с готовым письмом - сделка подобрана из моей орбиты, текст и срок разобраны. Раньше движок умел писать в CRM сам через очередь подтверждений; за все время я не подтвердил ни одной записи - контур выведен из эксплуатации, код в архиве. Задачник (TickTick) и почта (Outlook) - чтение.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ deep }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top:16px;padding:22px 24px;border-radius:8px;border:1px solid rgba(127,231,255,0.22);background:linear-gradient(180deg, rgba(1,43,158,0.30) 0%, rgba(15,23,36,0.6) 100%)\">\n              <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:#7FE7FF;margin-bottom:12px\">Подробно · чтение без записи и сверка с источником<\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;font:400 14px/1.55 var(--font-sans);color:rgba(255,255,255,0.68)\">\n                <div><b style=\"color:#fff;font-weight:600\">Записи наружу нет.<\u002Fb> Двойник читает рабочие системы сам - зеркало, орбита сделок, история изменений коллег, - а записи наружу у него нет вовсе: не «по подтверждению», а нет. Это свойство конструкции, которое проверяет тест.<\u002Fdiv>\n                <div><b style=\"color:#fff;font-weight:600\">Поручение одним действием.<\u002Fb> Из захвата собирается черновик - кому, по какой сделке, что сделать, к какому сроку; закрыл карточку - захват ушел из очереди. Закрытое тобой в задачнике само уходит из очереди, а переезд рабочего файла в папку другого клиента выносится тебе на решение.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- 11 · Личный контур -->\n      <section data-screen-label=\"11 Личный контур\" style=\"flex:0 0 100%;height:100%;overflow-y:auto;overflow-x:hidden\">\n        <div style=\"max-width:1240px;margin:0 auto;padding:clamp(24px,3.2vh,44px) clamp(26px,4vw,64px) 72px\">\n          <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:#7FE7FF;margin-bottom:14px\">Акт II · глава 11 · новая<\u002Fdiv>\n          <h2 style=\"margin:0 0 8px;font:500 clamp(28px,3.4vw,48px)/1.07 var(--font-sans);letter-spacing:-0.03em;color:#fff\">Второй двойник - для жизни<\u002Fh2>\n          <p style=\"margin:0 0 18px;font:400 clamp(14px,1.1vw,16px)/1.5 var(--font-sans);color:rgba(255,255,255,0.45)\">Наведи на мост - что по нему ходит. Попробуй обратную стрелку. Клик по личной спирали - что в ней.<\u002Fp>\n\n          <div style=\"display:grid;grid-template-columns:minmax(0,0.9fr) minmax(0,1.25fr);gap:18px;align-items:start\">\n            <div style=\"display:flex;flex-direction:column;gap:10px\">\n              <div style=\"padding:15px 17px;border-radius:8px;border:1px solid rgba(255,255,255,0.12);background:#0F1724\"><div style=\"font:600 11px/1.25 var(--font-sans);letter-spacing:0.06em;color:#7FE7FF;margin-bottom:9px\">СВОЯ ПАМЯТЬ<\u002Fdiv><div style=\"font:400 13px/1.5 var(--font-sans);color:rgba(255,255,255,0.72)\">дневник, случайные мысли, прочитанное и услышанное - отдельная память на тех же генах<\u002Fdiv><\u002Fdiv>\n              <div style=\"padding:15px 17px;border-radius:8px;border:1px solid rgba(255,255,255,0.12);background:#0F1724\"><div style=\"font:600 11px/1.25 var(--font-sans);letter-spacing:0.06em;color:#7FE7FF;margin-bottom:9px\">ОДНОСТОРОННИЙ КЛАПАН<\u002Fdiv><div style=\"font:400 13px/1.5 var(--font-sans);color:rgba(255,255,255,0.72)\">личный двойник читает рабочее; рабочий о личном не знает - ни в поиске, ни в контексте, ни в пульте<\u002Fdiv><\u002Fdiv>\n              <div style=\"padding:15px 17px;border-radius:8px;border:1px solid rgba(255,255,255,0.12);background:#0F1724\"><div style=\"font:600 11px/1.25 var(--font-sans);letter-spacing:0.06em;color:#7FE7FF;margin-bottom:9px\">МОСТ<\u002Fdiv><div style=\"font:400 13px/1.5 var(--font-sans);color:rgba(255,255,255,0.72)\">связи между личным и рабочим находит личная сторона и только предлагает: «ты слушал об этом - это ложится на рабочую тему»<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"display:flex;flex-direction:column;gap:12px\">\n              <div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,150px) minmax(0,0.72fr);gap:10px;align-items:stretch;padding:14px;border-radius:10px;border:1px solid rgba(255,255,255,0.10);background:rgba(255,255,255,0.02)\">\n                <div style=\"display:flex;flex-direction:column;gap:8px\">\n                  <div style=\"height:clamp(200px,30vh,280px)\"><canvas ref=\"{{ lichWorkRef }}\" style=\"width:100%;height:100%;display:block\"><\u002Fcanvas><\u002Fdiv>\n                  <div style=\"text-align:center;font:600 11px/1.3 var(--font-sans);letter-spacing:0.08em;color:#fff\">РАБОЧИЙ<\u002Fdiv>\n                  <div style=\"text-align:center;font:400 11px/1.3 var(--font-sans);color:rgba(255,255,255,0.45)\">пять генов<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;justify-content:center;gap:12px\">\n                  <button type=\"button\" sc-camel-on-mouse-enter=\"{{ lichBridge }}\" sc-camel-on-click=\"{{ lichBridge }}\" style=\"display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 8px;border-radius:8px;cursor:pointer;transition:border-color 140ms cubic-bezier(.22,.61,.36,1);border:1px solid {{ lichBridgeBd }};background:rgba(0,106,251,0.14)\">\n                    <span style=\"font:600 10px/1 var(--font-sans);letter-spacing:0.08em;color:#7FE7FF\">МОСТ<\u002Fspan>\n                    <span style=\"font:400 20px/1 var(--font-sans);color:#7FE7FF\">←<\u002Fspan>\n                    <span style=\"font:400 11px/1.3 var(--font-sans);text-align:center;color:rgba(255,255,255,0.72)\">личное читает рабочее<\u002Fspan>\n                  <\u002Fbutton>\n                  <button type=\"button\" sc-camel-on-click=\"{{ lichReverse }}\" style=\"display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 8px;border-radius:8px;cursor:pointer;transition:border-color 140ms cubic-bezier(.22,.61,.36,1);border:1px dashed {{ lichRevBd }};background:transparent\">\n                    <span style=\"font:400 18px/1 var(--font-sans);color:rgba(255,122,89,0.9);text-decoration:line-through\">→<\u002Fspan>\n                    <span style=\"font:400 11px/1.3 var(--font-sans);text-align:center;color:rgba(255,255,255,0.45);text-decoration:line-through\">рабочее → личное<\u002Fspan>\n                  <\u002Fbutton>\n                <\u002Fdiv>\n                <button type=\"button\" sc-camel-on-click=\"{{ lichPers }}\" style=\"display:flex;flex-direction:column;gap:8px;padding:0;border-radius:8px;cursor:pointer;transition:border-color 140ms cubic-bezier(.22,.61,.36,1);border:1px solid {{ lichPersBd }};background:transparent\">\n                  <div style=\"height:clamp(150px,22vh,210px);width:100%;margin-top:28px\"><canvas ref=\"{{ lichPersRef }}\" style=\"width:100%;height:100%;display:block\"><\u002Fcanvas><\u002Fdiv>\n                  <div style=\"text-align:center;font:600 11px/1.3 var(--font-sans);letter-spacing:0.08em;color:#fff\">ЛИЧНЫЙ<\u002Fdiv>\n                  <div style=\"text-align:center;font:400 11px/1.3 var(--font-sans);color:rgba(255,255,255,0.45);padding-bottom:8px\">те же пять генов<\u002Fdiv>\n                <\u002Fbutton>\n              <\u002Fdiv>\n              <div style=\"padding:15px 17px;border-radius:8px;background:rgba(255,255,255,0.04);border-left:2px solid {{ lichRule }}\">\n                <div style=\"font:600 10px/1 var(--font-sans);letter-spacing:0.10em;text-transform:uppercase;color:rgba(255,255,255,0.42);margin-bottom:8px\">{{ lichTitle }}<\u002Fdiv>\n                <div style=\"font:400 14px/1.5 var(--font-sans);color:rgba(255,255,255,0.82)\">{{ lichText }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"padding:18px 20px;border-radius:8px;border:1px solid rgba(127,231,255,0.28);background:rgba(1,43,158,0.28)\"><div style=\"font:500 clamp(15px,1.4vw,20px)/1.3 var(--font-sans);letter-spacing:-0.02em;color:#fff\">Один геном - два фенотипа на одной машине. Граница между ними - направление стрелки.<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"margin-top:16px;display:flex;flex-direction:column;gap:12px;align-items:flex-start\">\n            <button type=\"button\" sc-camel-on-click=\"{{ exLich }}\" style=\"padding:9px 16px;border-radius:100px;cursor:pointer;font:600 12px/1 var(--font-sans);transition:background 140ms cubic-bezier(.22,.61,.36,1);border:1px solid {{ exLichBd }};background:{{ exLichBg }};color:#7FE7FF\">{{ exLichLabel }}<\u002Fbutton>\n            <sc-if value=\"{{ exLichOpen }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"width:100%;padding:18px 20px;border-radius:8px;border:1px solid rgba(127,231,255,0.30);border-left:3px solid #7FE7FF;background:rgba(127,231,255,0.06)\">\n                <div style=\"font:600 10px/1 var(--font-sans);letter-spacing:0.10em;text-transform:uppercase;color:#7FE7FF;margin-bottom:10px\">Пример · как у автора<\u002Fdiv>\n                <div style=\"font:400 14px/1.55 var(--font-sans);color:rgba(255,255,255,0.80)\">У меня второй экземпляр стоит на личной папке заметок в Obsidian: дневник, случайные мысли, подкасты, статьи, книги. Шаблоны и самые личные папки исключены до первого индекса. В пульте - переключатель «Работа | Личное»; мост за ночь предлагает несколько связей, решаю я.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ deep }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top:16px;padding:22px 24px;border-radius:8px;border:1px solid rgba(127,231,255,0.22);background:linear-gradient(180deg, rgba(1,43,158,0.30) 0%, rgba(15,23,36,0.6) 100%)\">\n              <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:#7FE7FF;margin-bottom:12px\">Подробно · как устроен личный контур<\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;font:400 13px/1.55 var(--font-sans);color:rgba(255,255,255,0.68)\">\n                <div><b style=\"color:#fff;font-weight:600\">Второй экземпляр.<\u002Fb> Тот же движок на второй папке заметок, со своим пультом и своими фоновыми заданиями.<\u002Fdiv>\n                <div><b style=\"color:#fff;font-weight:600\">Клапан - отсутствие пути.<\u002Fb> Это не правило в инструкции: у рабочего экземпляра нет ни адреса, ни ключа к личному.<\u002Fdiv>\n                <div><b style=\"color:#fff;font-weight:600\">Исключения - до первого чтения.<\u002Fb> Шаблоны и самые приватные папки исключаются из личной памяти заранее, а не после того, как попали внутрь.<\u002Fdiv>\n                <div><b style=\"color:#fff;font-weight:600\">«Что я читал и думал по теме X».<\u002Fb> Отдельная способность личной стороны: она же поднимает связанный рабочий контекст.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- 12 · Четыре поверхности -->\n      <section data-screen-label=\"12 Четыре поверхности\" style=\"flex:0 0 100%;height:100%;overflow-y:auto;overflow-x:hidden\">\n        <div style=\"max-width:1240px;margin:0 auto;padding:clamp(24px,3.2vh,44px) clamp(26px,4vw,64px) 72px\">\n          <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:#7FE7FF;margin-bottom:14px\">Акт II · глава 12<\u002Fdiv>\n          <h2 style=\"margin:0 0 8px;font:500 clamp(28px,3.4vw,48px)/1.07 var(--font-sans);letter-spacing:-0.03em;color:#fff\">Где ты его встречаешь<\u002Fh2>\n          <p style=\"margin:0 0 20px;font:400 clamp(14px,1.1vw,16px)/1.5 var(--font-sans);color:rgba(255,255,255,0.45)\">Клик по поверхности - как она выглядит в руках. Экраны синтетические.<\u002Fp>\n\n          <div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:18px;align-items:start\">\n            <div style=\"position:relative;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px\">\n              <sc-for list=\"{{ surfaces }}\" as=\"f\" hint-placeholder-count=\"4\">\n                <button type=\"button\" sc-camel-on-click=\"{{ f.onClick }}\" style=\"text-align:left;padding:18px;border-radius:8px;cursor:pointer;min-height:120px;transition:background 140ms cubic-bezier(.22,.61,.36,1);border:1px solid {{ f.bd }};background:{{ f.bg }};color:#fff\">\n                  <div style=\"font:600 12px/1 var(--font-sans);letter-spacing:0.08em;color:#7FE7FF;margin-bottom:12px\">{{ f.n }}<\u002Fdiv>\n                  <div style=\"font:400 14px/1.45 var(--font-sans);color:rgba(255,255,255,0.68)\">{{ f.sub }}<\u002Fdiv>\n                <\u002Fbutton>\n              <\u002Fsc-for>\n              <div style=\"position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:78px;height:78px;border-radius:100px;border:1px solid rgba(127,231,255,0.45);background:#030507;display:flex;align-items:center;justify-content:center;font:600 12px/1.2 var(--font-sans);color:#fff;text-align:center\">ты<\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"padding:20px 22px;border-radius:8px;border:1px solid rgba(255,255,255,0.12);background:#0F1724\">\n              <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:14px\">\n                <span style=\"font:600 12px/1 var(--font-sans);letter-spacing:0.08em;color:#7FE7FF\">{{ surfName }}<\u002Fspan>\n                <span style=\"font:400 12px/1.3 var(--font-sans);color:rgba(255,255,255,0.42);text-align:right\">{{ surfSub }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:8px\">\n                <sc-for list=\"{{ surfRows }}\" as=\"r\" hint-placeholder-count=\"4\">\n                  <div style=\"display:grid;grid-template-columns:110px minmax(0,1fr);gap:14px;padding:12px 14px;border-radius:8px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08)\">\n                    <span style=\"font:600 12px/1.35 var(--font-sans);color:rgba(255,255,255,0.45)\">{{ r.k }}<\u002Fspan>\n                    <span style=\"font:400 14px/1.45 var(--font-sans);color:rgba(255,255,255,0.82)\">{{ r.v }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"margin-top:16px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start\">\n            <div style=\"padding:20px 22px;border-radius:8px;border:1px solid rgba(127,231,255,0.28);background:rgba(1,43,158,0.28)\">\n              <div style=\"font:500 clamp(17px,1.55vw,22px)/1.3 var(--font-sans);letter-spacing:-0.02em;color:#fff\">Двойник - не еще одно приложение. Он живет там, где ты и так работаешь.<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:12px;align-items:flex-start\">\n              <button type=\"button\" sc-camel-on-click=\"{{ ex10 }}\" style=\"padding:9px 16px;border-radius:100px;cursor:pointer;font:600 12px/1 var(--font-sans);transition:background 140ms cubic-bezier(.22,.61,.36,1);border:1px solid {{ ex10bd }};background:{{ ex10bg }};color:#7FE7FF\">{{ ex10label }}<\u002Fbutton>\n              <sc-if value=\"{{ ex10open }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"width:100%;padding:18px 20px;border-radius:8px;border:1px solid rgba(127,231,255,0.30);border-left:3px solid #7FE7FF;background:rgba(127,231,255,0.06)\">\n                  <div style=\"font:600 10px/1 var(--font-sans);letter-spacing:0.10em;text-transform:uppercase;color:#7FE7FF;margin-bottom:10px\">Пример · как у автора<\u002Fdiv>\n                  <div style=\"font:400 14px/1.55 var(--font-sans);color:rgba(255,255,255,0.80)\">У меня: диалог - Claude Desktop и Cowork, Claude Code, Kimi, Cherry Studio - все к одному движку; заметки - Obsidian; телефон - TickTick; пульт свой, четыре вкладки: Работа / Двойник / Мониторинг / Настройки, плюс переключатель «Работа | Личное»; доктор - 74 проверки.<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ deep }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top:16px;padding:22px 24px;border-radius:8px;border:1px solid rgba(127,231,255,0.22);background:linear-gradient(180deg, rgba(1,43,158,0.30) 0%, rgba(15,23,36,0.6) 100%)\">\n              <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:#7FE7FF;margin-bottom:12px\">Подробно · почему память - обычные файлы и что показывает пульт<\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;font:400 14px/1.55 var(--font-sans);color:rgba(255,255,255,0.68)\">\n                <div><b style=\"color:#fff;font-weight:600\">Файлы, а не база в чьем-то облаке.<\u002Fb> Переносимость: папку можно скопировать и унести. Вечный формат: текст читается любым редактором и через двадцать лет. Правится чем угодно - двойник не единственный способ добраться до собственных знаний. Движок - служба на твоем компьютере, AI-клиенты подключаются к ней как окна: их можно менять, не трогая двойника.<\u002Fdiv>\n                <div><b style=\"color:#fff;font-weight:600\">Пульт.<\u002Fb> Очереди решений, лента внимания, журнал событий и здоровье - доктор с проверками всего, что может сломаться тихо. У пульта свой дизайн-канон: каждый виджет отвечает на вопрос и дает действие.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- 13 · Правила -->\n      <section data-screen-label=\"13 Правила\" style=\"flex:0 0 100%;height:100%;overflow-y:auto;overflow-x:hidden\">\n        <div style=\"max-width:1240px;margin:0 auto;padding:clamp(24px,3.2vh,44px) clamp(26px,4vw,64px) 72px\">\n          <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:#7FE7FF;margin-bottom:14px\">Акт II · глава 13<\u002Fdiv>\n          <h2 style=\"margin:0 0 8px;font:500 clamp(28px,3.4vw,48px)/1.07 var(--font-sans);letter-spacing:-0.03em;color:#fff\">Грани, которые двойник не переступает<\u002Fh2>\n          <p style=\"margin:0 0 20px;font:400 clamp(14px,1.1vw,16px)/1.5 var(--font-sans);color:rgba(255,255,255,0.45)\">Наведи на правило - одна строка о том, как оно устроено. Правила прошиты в нить, а не наклеены сверху.<\u002Fp>\n\n          <div style=\"display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,0.85fr);gap:18px;align-items:start\">\n            <div style=\"display:flex;flex-direction:column;gap:9px\">\n              <sc-for list=\"{{ rules }}\" as=\"r\" hint-placeholder-count=\"5\">\n                <div sc-camel-on-mouse-enter=\"{{ r.onEnter }}\" style=\"display:grid;grid-template-columns:minmax(0,215px) minmax(0,1fr);gap:18px;align-items:center;padding:15px 18px;border-radius:8px;transition:background 140ms cubic-bezier(.22,.61,.36,1);border:1px solid {{ r.bd }};background:{{ r.bg }}\">\n                  <div style=\"display:flex;align-items:center;gap:10px\">\n                    <span style=\"width:7px;height:7px;border-radius:100px;background:#7FE7FF;flex:0 0 auto\"><\u002Fspan>\n                    <span style=\"font:600 clamp(14px,1.2vw,17px)/1.2 var(--font-sans);letter-spacing:-0.01em;color:#fff\">{{ r.n }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"font:400 clamp(13px,1.05vw,15px)/1.45 var(--font-sans);color:rgba(255,255,255,0.68)\">{{ r.t }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <div style=\"margin-top:6px;padding:16px 18px;border-radius:8px;background:rgba(255,255,255,0.04);border-left:2px solid #7FE7FF\">\n                <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.42);margin-bottom:8px\">Как это устроено · {{ ruleName }}<\u002Fdiv>\n                <div style=\"font:400 15px/1.5 var(--font-sans);color:rgba(255,255,255,0.80)\">{{ ruleHow }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"display:flex;flex-direction:column;gap:14px\">\n              <div style=\"height:clamp(220px,32vh,320px);border-radius:8px;border:1px solid rgba(255,255,255,0.10);background:rgba(255,255,255,0.02)\">\n                <canvas ref=\"{{ rulesRef }}\" style=\"width:100%;height:100%;display:block\"><\u002Fcanvas>\n              <\u002Fdiv>\n              <div style=\"padding:20px 22px;border-radius:8px;border:1px solid rgba(127,231,255,0.28);background:rgba(1,43,158,0.28)\">\n                <div style=\"font:500 clamp(17px,1.55vw,22px)/1.3 var(--font-sans);letter-spacing:-0.02em;color:#fff\">Это гарантии тебе. Правила, по которым он построен, - отдельный свод, он будет дальше.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ deep }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top:16px;padding:22px 24px;border-radius:8px;border:1px solid rgba(127,231,255,0.22);background:linear-gradient(180deg, rgba(1,43,158,0.30) 0%, rgba(15,23,36,0.6) 100%)\">\n              <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:#7FE7FF;margin-bottom:12px\">Подробно · правила как встроенные механизмы<\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;font:400 14px/1.55 var(--font-sans);color:rgba(255,255,255,0.68)\">\n                <div><b style=\"color:#fff;font-weight:600\">Барьер приватности.<\u002Fb> Работает на всех уровнях сразу - от захвата до генерации: помеченное не индексируется, не находится и не попадает в контекст. Барьер проверяется сам: доктор и еженедельный прогон подтверждают «протечек нет». Что считать приватным, задает твой профиль - один файл: кто ты, твои адреса, чьи личные документы в твоих папках не читать.<\u002Fdiv>\n                <div><b style=\"color:#fff;font-weight:600\">Журнал аудита.<\u002Fb> Каждая запись во внешнюю систему оставляет след: что, куда, когда и по чьему подтверждению.<\u002Fdiv>\n                <div><b style=\"color:#fff;font-weight:600\">Блокировка вместо заглушки.<\u002Fb> Нет данных - задача останавливается со списком недостающего; правдоподобный текст без опоры не выдается никогда. Честность распространяется и на сбои: «не смог прочитать» никогда не выглядит как «ничего нет».<\u002Fdiv>\n                <div><b style=\"color:#fff;font-weight:600\">Конституция системы.<\u002Fb> У автора таких архитектурных принципов 19: каждое изменение проверяется на соответствие им, иначе оно не попадает в геном.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- 14 · Разделитель Акт III -->\n      <section data-screen-label=\"14 Разделитель - Акт III\" style=\"flex:0 0 100%;height:100%;overflow-y:auto;overflow-x:hidden\">\n        <div style=\"max-width:1240px;margin:0 auto;padding:clamp(24px,3.2vh,48px) clamp(26px,4vw,64px) 64px;min-height:100%;display:flex;flex-direction:column;justify-content:center\">\n          <div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,0.62fr);gap:clamp(24px,4vw,48px);align-items:center;margin-bottom:clamp(20px,3vh,34px)\">\n            <div>\n              <div style=\"font:600 clamp(12px,1.3vw,15px)/1 var(--font-sans);letter-spacing:0.14em;color:#7FE7FF;margin-bottom:18px\">АКТ III · КАК ЭТО УСТРОЕНО<\u002Fdiv>\n              <h2 style=\"margin:0;font:500 clamp(26px,3.2vw,44px)/1.07 var(--font-sans);letter-spacing:-0.04em;color:#fff\">Дальше - инженерная часть: для тех, кто захочет собрать похожее<\u002Fh2>\n              <button type=\"button\" sc-camel-on-click=\"{{ skipTech }}\" style=\"margin-top:22px;padding:14px 26px;border-radius:100px;cursor:pointer;font:600 14px/1 var(--font-sans);border:1px solid rgba(127,231,255,0.45);background:rgba(127,231,255,0.08);color:#7FE7FF\">Пропустить технику →<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"height:clamp(150px,24vh,240px)\">\n              <canvas ref=\"{{ techRef }}\" style=\"width:100%;height:100%;display:block\"><\u002Fcanvas>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"font:600 10px/1 var(--font-sans);letter-spacing:0.10em;text-transform:uppercase;color:rgba(255,255,255,0.38);margin-bottom:12px\">Маршрут акта · десять шагов<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px\">\n            <sc-for list=\"{{ route }}\" as=\"r\" hint-placeholder-count=\"10\">\n              <button type=\"button\" sc-camel-on-click=\"{{ r.onClick }}\" style=\"display:flex;flex-direction:column;gap:7px;text-align:left;padding:14px 16px;border-radius:8px;cursor:pointer;transition:background 140ms cubic-bezier(.22,.61,.36,1);border:1px solid {{ r.bd }};background:{{ r.bg }};color:#fff\">\n                <span style=\"font:600 12px/1.2 var(--font-sans);color:#7FE7FF\">{{ r.n }}<\u002Fspan>\n                <span style=\"font:400 13px/1.4 var(--font-sans);color:rgba(255,255,255,0.65)\">{{ r.t }}<\u002Fspan>\n              <\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- 15 · Контекст -->\n      <section data-screen-label=\"15 Контекст: система и ее мир\" style=\"flex:0 0 100%;height:100%;overflow-y:auto;overflow-x:hidden\">\n        <div style=\"max-width:1240px;margin:0 auto;padding:clamp(24px,3.2vh,44px) clamp(26px,4vw,64px) 72px\">\n          <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:#7FE7FF;margin-bottom:12px\">Акт III · глава 15 · 1 из 10<\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:14px;padding:9px 14px;border-radius:100px;background:rgba(127,231,255,0.06);border:1px solid rgba(127,231,255,0.20)\">\n            <span style=\"width:6px;height:6px;border-radius:100px;background:#7FE7FF;flex:0 0 auto\"><\u002Fspan>\n            <span style=\"font:400 clamp(12px,1vw,13px)/1.4 var(--font-sans);color:rgba(255,255,255,0.62)\">Начинаем снаружи: где проходит граница двойника и с кем он разговаривает. Дальше заглянем внутрь.<\u002Fspan>\n          <\u002Fdiv>\n          <h2 style=\"margin:0 0 8px;font:500 clamp(28px,3.4vw,48px)/1.07 var(--font-sans);letter-spacing:-0.03em;color:#fff\">Границы и окружение<\u002Fh2>\n          <p style=\"margin:0 0 18px;font:400 clamp(14px,1.1vw,16px)/1.5 var(--font-sans);color:rgba(255,255,255,0.45)\">Клик по внешнему участнику - что ходит по каналу и что будет при его недоступности.<\u002Fp>\n\n          <div style=\"display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;align-items:start\">\n            <div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px\">\n              <div style=\"grid-column:1 / -1;padding:16px 18px;border-radius:8px;border:1px solid rgba(127,231,255,0.42);background:rgba(1,43,158,0.34);text-align:center\">\n                <div style=\"font:600 13px/1.2 var(--font-sans);letter-spacing:0.08em;color:#7FE7FF;margin-bottom:6px\">ЦИФРОВОЙ ДВОЙНИК (служба на твоей машине)<\u002Fdiv>\n                <div style=\"font:400 12px/1.4 var(--font-sans);color:rgba(255,255,255,0.5)\">граница доверия - по этой рамке · единственный вход - локальный адрес под токеном<\u002Fdiv>\n              <\u002Fdiv>\n              <sc-for list=\"{{ context }}\" as=\"c\" hint-placeholder-count=\"4\">\n                <button type=\"button\" sc-camel-on-click=\"{{ c.onClick }}\" style=\"display:flex;flex-direction:column;gap:8px;text-align:left;padding:15px 16px;border-radius:8px;cursor:pointer;min-height:118px;transition:background 140ms cubic-bezier(.22,.61,.36,1);border:1px solid {{ c.bd }};background:{{ c.bg }};color:#fff\">\n                  <span style=\"font:600 11px/1.25 var(--font-sans);letter-spacing:0.06em;color:#7FE7FF\">{{ c.n }}<\u002Fspan>\n                  <span style=\"font:400 13px/1.4 var(--font-sans);color:rgba(255,255,255,0.70)\">{{ c.t }}<\u002Fspan>\n                  <span style=\"margin-top:auto;font:600 11px/1.3 var(--font-sans);color:rgba(255,255,255,0.40)\">{{ c.mode }}<\u002Fspan>\n                <\u002Fbutton>\n              <\u002Fsc-for>\n              <div style=\"grid-column:1 / -1;padding:15px 18px;border-radius:8px;border:1px dashed rgba(255,196,138,0.35);background:rgba(255,122,89,0.05)\">\n                <div style=\"font:600 10px/1 var(--font-sans);letter-spacing:0.10em;text-transform:uppercase;color:#FFC48A;margin-bottom:10px\">Чего система не делает<\u002Fdiv>\n                <div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 22px\">\n                  <sc-for list=\"{{ contextNot }}\" as=\"x\" hint-placeholder-count=\"4\">\n                    <div style=\"font:400 13px/1.45 var(--font-sans);color:rgba(255,255,255,0.70)\">{{ x.t }}<\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"display:flex;flex-direction:column;gap:14px\">\n              <div style=\"padding:18px 20px;border-radius:8px;border:1px solid rgba(255,255,255,0.12);background:#0F1724\">\n                <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:#7FE7FF;margin-bottom:10px\">{{ ctxName }}<\u002Fdiv>\n                <div style=\"font:400 14px/1.5 var(--font-sans);color:rgba(255,255,255,0.82);margin-bottom:14px\">{{ ctxFlow }}<\u002Fdiv>\n                <div style=\"padding:13px 15px;border-radius:8px;background:rgba(255,122,89,0.08);border-left:2px solid #FF7A59\">\n                  <div style=\"font:600 10px/1 var(--font-sans);letter-spacing:0.10em;text-transform:uppercase;color:#FFC48A;margin-bottom:8px\">Если недоступен<\u002Fdiv>\n                  <div style=\"font:400 13px/1.5 var(--font-sans);color:rgba(255,255,255,0.72)\">{{ ctxFail }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"padding:18px 20px;border-radius:8px;border:1px solid rgba(127,231,255,0.28);background:rgba(1,43,158,0.28)\">\n                <div style=\"font:500 clamp(15px,1.4vw,20px)/1.3 var(--font-sans);letter-spacing:-0.02em;color:#fff\">С улицы внутрь никто не ходит: единственный вход - локальный адрес с токеном, для твоих же клиентов и пульта. Наружу - только исходящие вызовы.<\u002Fdiv>\n              <\u002Fdiv>\n              <button type=\"button\" sc-camel-on-click=\"{{ exCtx }}\" style=\"align-self:flex-start;padding:9px 16px;border-radius:100px;cursor:pointer;font:600 12px/1 var(--font-sans);transition:background 140ms cubic-bezier(.22,.61,.36,1);border:1px solid {{ exCtxBd }};background:{{ exCtxBg }};color:#7FE7FF\">{{ exCtxLabel }}<\u002Fbutton>\n              <sc-if value=\"{{ exCtxOpen }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"padding:18px 20px;border-radius:8px;border:1px solid rgba(127,231,255,0.30);border-left:3px solid #7FE7FF;background:rgba(127,231,255,0.06)\">\n                  <div style=\"font:600 10px/1 var(--font-sans);letter-spacing:0.10em;text-transform:uppercase;color:#7FE7FF;margin-bottom:10px\">Пример · как у автора<\u002Fdiv>\n                  <div style=\"font:400 14px/1.55 var(--font-sans);color:rgba(255,255,255,0.80)\">У меня внешних участников четыре: корпоративная CRM (чтение через отчетный API; записи от двойника нет - поручение администратору), мобильный задачник, почтовый клиент через локальный мост только на чтение, и облачная папка как наблюдаемый корень - в нее же возвращаются готовые документы. AI-клиентов пять: Claude Desktop, Cowork, Claude Code, Kimi, Cherry Studio - все к одной службе на одном адресе.<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ deep }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top:16px;padding:22px 24px;border-radius:8px;border:1px solid rgba(127,231,255,0.22);background:linear-gradient(180deg, rgba(1,43,158,0.30) 0%, rgba(15,23,36,0.6) 100%)\">\n              <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:#7FE7FF;margin-bottom:12px\">Подробно · границы доверия и деградация<\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;font:400 14px/1.55 var(--font-sans);color:rgba(255,255,255,0.68)\">\n                <div><b style=\"color:#fff;font-weight:600\">Три зоны.<\u002Fb> Локальная зона (файлы, индексы, факты, журналы), доверенный локальный транспорт (панель, сервер инструментов) и внешние вызовы. Данные из первой зоны во вторую отдаются целиком, в третью - только тем срезом, что нужен запросу.<\u002Fdiv>\n                <div><b style=\"color:#fff;font-weight:600\">Служба, а не библиотека внутри клиента.<\u002Fb> Один процесс обслуживает много клиентов, пульт жив без клиента. Доступ к пульту с телефона - тот же локальный адрес через приватную сеть, токен на границе транспорта. Отказ моста обязан выглядеть как отказ, а не как «данных нет».<\u002Fdiv>\n                <div><b style=\"color:#fff;font-weight:600\">Деградация по каждому участнику.<\u002Fb> Отказ любого внешнего звена сужает функциональность, но не роняет систему: работа продолжается на локальных данных, а невыполненное остается в очереди с ретраями.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- 16 · Компоненты и связи -->\n      <section data-screen-label=\"16 Компоненты и связи\" style=\"flex:0 0 100%;height:100%;overflow-y:auto;overflow-x:hidden\">\n        <div style=\"max-width:1240px;margin:0 auto;padding:clamp(24px,3.2vh,44px) clamp(26px,4vw,64px) 72px\">\n          <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:#7FE7FF;margin-bottom:12px\">Акт III · глава 16 · 2 из 10 · несущая<\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:14px;padding:9px 14px;border-radius:100px;background:rgba(127,231,255,0.06);border:1px solid rgba(127,231,255,0.20)\">\n            <span style=\"width:6px;height:6px;border-radius:100px;background:#7FE7FF;flex:0 0 auto\"><\u002Fspan>\n            <span style=\"font:400 clamp(12px,1vw,13px)/1.4 var(--font-sans);color:rgba(255,255,255,0.62)\">Границу очертили - открываем корпус: какие компоненты внутри и кто кого вызывает. Эта диаграмма дальше висит мини-картой.<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:18px;flex-wrap:wrap;margin-bottom:12px\">\n            <div>\n              <h2 style=\"margin:0 0 6px;font:500 clamp(28px,3.4vw,48px)/1.07 var(--font-sans);letter-spacing:-0.03em;color:#fff\">Что внутри и кто кого вызывает<\u002Fh2>\n              <p style=\"margin:0;font:400 clamp(14px,1.1vw,16px)/1.5 var(--font-sans);color:rgba(255,255,255,0.45)\">{{ arrowNote }}<\u002Fp>\n            <\u002Fdiv>\n            <button type=\"button\" sc-camel-on-click=\"{{ traceRun }}\" style=\"padding:11px 20px;border-radius:100px;cursor:pointer;font:600 12px/1 var(--font-sans);white-space:nowrap;transition:background 140ms cubic-bezier(.22,.61,.36,1);border:1px solid rgba(127,231,255,0.45);background:{{ traceBg }};color:#7FE7FF\">{{ traceLabel }}<\u002Fbutton>\n          <\u002Fdiv>\n\n          <div style=\"display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,0.95fr);gap:18px;align-items:start\">\n            <div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,132px);gap:10px;align-items:start\">\n              <div style=\"display:flex;flex-direction:column;gap:0\">\n                <sc-for list=\"{{ tiers }}\" as=\"tr\" hint-placeholder-count=\"4\">\n                  <div>\n                    <div style=\"padding:12px 14px;border-radius:8px;border:1px solid rgba(255,255,255,0.10);background:rgba(255,255,255,0.02)\">\n                      <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:9px\">\n                        <span style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;color:#7FE7FF\">{{ tr.n }}<\u002Fspan>\n                        <span style=\"font:400 11px/1.3 var(--font-sans);color:rgba(255,255,255,0.38);text-align:right\">{{ tr.note }}<\u002Fspan>\n                      <\u002Fdiv>\n                      <div style=\"display:flex;flex-wrap:wrap;gap:6px\">\n                        <sc-for list=\"{{ tr.items }}\" as=\"c\" hint-placeholder-count=\"4\">\n                          <button type=\"button\" sc-camel-on-click=\"{{ c.onClick }}\" style=\"padding:9px 13px;cursor:pointer;font:500 12px/1.25 var(--font-sans);transition:background 140ms cubic-bezier(.22,.61,.36,1);border-radius:{{ c.radius }};border:1px {{ c.style }} {{ c.bd }};background:{{ c.bg }};color:{{ c.fg }}\">{{ c.n }}<\u002Fbutton>\n                        <\u002Fsc-for>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                    <sc-if value=\"{{ tr.hasDown }}\" hint-placeholder-val=\"{{ true }}\">\n                      <div style=\"display:flex;align-items:center;gap:9px;padding:5px 14px\">\n                        <span style=\"font:400 13px/1 var(--font-sans);color:rgba(127,231,255,0.75)\">↓<\u002Fspan>\n                        <span style=\"font:400 11px/1.3 var(--font-sans);color:rgba(255,255,255,0.48)\">{{ tr.down }}<\u002Fspan>\n                      <\u002Fdiv>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n                <div style=\"display:flex;align-items:center;gap:12px;margin-top:10px;padding:10px 14px;border-radius:8px;background:rgba(255,255,255,0.03);border:1px dashed rgba(127,231,255,0.28)\">\n                  <span style=\"font:600 11px/1 var(--font-sans);color:#7FE7FF;white-space:nowrap\">{{ adapterArrow }}<\u002Fspan>\n                  <span style=\"flex:1 1 auto;height:2px;border-radius:100px;background:linear-gradient(90deg, rgba(127,231,255,0.7) 0%, rgba(127,231,255,0.08) 100%)\"><\u002Fspan>\n                  <span style=\"font:400 12px/1.35 var(--font-sans);color:rgba(255,255,255,0.55)\">адаптеры сидят на краю ядра, за общим интерфейсом<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"display:flex;flex-direction:column;gap:10px\">\n                <button type=\"button\" sc-camel-on-click=\"{{ jobsBlock.onClick }}\" style=\"display:flex;flex-direction:column;gap:9px;text-align:left;padding:14px;border-radius:100px 100px 8px 8px;cursor:pointer;min-height:150px;transition:background 140ms cubic-bezier(.22,.61,.36,1);border:1px dashed {{ jobsBlock.bd }};background:{{ jobsBlock.bg }};color:#fff\">\n                  <span style=\"font:600 11px/1.25 var(--font-sans);letter-spacing:0.06em;color:#7FE7FF\">{{ jobsBlock.n }}<\u002Fspan>\n                  <span style=\"font:400 12px/1.4 var(--font-sans);color:rgba(255,255,255,0.60)\">{{ jobsBlock.t }}<\u002Fspan>\n                  <span style=\"margin-top:auto;font:400 11px/1.3 var(--font-sans);color:rgba(127,231,255,0.8)\">↳ {{ jobsBlock.arrow }}<\u002Fspan>\n                <\u002Fbutton>\n\n                <div style=\"padding:12px 13px;border-radius:8px;border:1px solid rgba(255,255,255,0.10);background:rgba(255,255,255,0.02)\">\n                  <div style=\"font:600 9px/1 var(--font-sans);letter-spacing:0.10em;text-transform:uppercase;color:rgba(255,255,255,0.38);margin-bottom:9px\">Тип узла<\u002Fdiv>\n                  <div style=\"display:flex;flex-direction:column;gap:7px\">\n                    <sc-for list=\"{{ legend }}\" as=\"l\" hint-placeholder-count=\"4\">\n                      <div style=\"display:flex;align-items:center;gap:8px\">\n                        <span style=\"width:22px;height:13px;flex:0 0 auto;border-radius:{{ l.radius }};border:1px {{ l.style }} rgba(127,231,255,0.6);background:rgba(127,231,255,0.08)\"><\u002Fspan>\n                        <span style=\"font:400 10px/1.25 var(--font-sans);color:rgba(255,255,255,0.6)\">{{ l.n }}<\u002Fspan>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"display:flex;flex-direction:column;gap:14px\">\n              <div style=\"padding:18px 20px;border-radius:8px;border:1px solid rgba(255,255,255,0.12);background:#0F1724\">\n                <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:#7FE7FF;margin-bottom:10px\">{{ compName }}<\u002Fdiv>\n                <div style=\"font:400 14px/1.5 var(--font-sans);color:rgba(255,255,255,0.82);margin-bottom:13px\">{{ compRole }}<\u002Fdiv>\n                <div style=\"padding:12px 14px;border-radius:8px;background:rgba(255,122,89,0.08);border-left:2px solid #FF7A59;margin-bottom:13px\">\n                  <div style=\"font:600 10px/1 var(--font-sans);letter-spacing:0.10em;text-transform:uppercase;color:#FFC48A;margin-bottom:8px\">Что сломается без него<\u002Fdiv>\n                  <div style=\"font:400 13px/1.5 var(--font-sans);color:rgba(255,255,255,0.72)\">{{ compWithout }}<\u002Fdiv>\n                <\u002Fdiv>\n                <button type=\"button\" sc-camel-on-click=\"{{ compGo }}\" style=\"padding:9px 16px;border-radius:100px;cursor:pointer;font:600 12px/1 var(--font-sans);border:1px solid rgba(127,231,255,0.45);background:rgba(127,231,255,0.08);color:#7FE7FF\">{{ compGoLabel }}<\u002Fbutton>\n                <sc-if value=\"{{ compLegendOn }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"display:flex;flex-direction:column;gap:7px;margin-top:13px;padding-top:13px;border-top:1px solid rgba(255,255,255,0.10)\">\n                    <div style=\"display:flex;align-items:center;gap:8px\">\n                      <span style=\"width:12px;height:12px;flex:0 0 auto;border-radius:3px;border:1px solid rgba(18,212,148,0.55);background:rgba(18,212,148,0.14)\"><\u002Fspan>\n                      <span style=\"font:400 12px/1.3 var(--font-sans);color:rgba(255,255,255,0.62)\">{{ compCallsLabel }}<\u002Fspan>\n                    <\u002Fdiv>\n                    <div style=\"display:flex;align-items:center;gap:8px\">\n                      <span style=\"width:12px;height:12px;flex:0 0 auto;border-radius:3px;border:1px solid rgba(255,196,138,0.55);background:rgba(255,122,89,0.14)\"><\u002Fspan>\n                      <span style=\"font:400 12px/1.3 var(--font-sans);color:rgba(255,255,255,0.62)\">{{ compByLabel }}<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n\n              <sc-if value=\"{{ tracing }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"padding:15px 17px;border-radius:8px;border:1px solid rgba(127,231,255,0.40);background:rgba(0,106,251,0.16)\">\n                  <div style=\"font:600 10px/1 var(--font-sans);letter-spacing:0.10em;text-transform:uppercase;color:#7FE7FF;margin-bottom:8px\">Трассировка запроса<\u002Fdiv>\n                  <div style=\"font:400 14px/1.5 var(--font-sans);color:#fff\">{{ traceText }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n\n              <div style=\"padding:15px 17px;border-radius:8px;border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.02)\">\n                <div style=\"display:flex;align-items:center;gap:9px;margin-bottom:9px\">\n                  <span style=\"font:600 10px/1 var(--font-sans);letter-spacing:0.08em;color:#12D494\">РАЗРЕШЕНО<\u002Fspan>\n                  <span style=\"font:400 11px/1.35 var(--font-sans);color:rgba(255,255,255,0.7)\">поверхность → интерфейсный слой → ядро → хранилище<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"display:flex;align-items:center;gap:9px\">\n                  <span style=\"font:600 10px/1 var(--font-sans);letter-spacing:0.08em;color:#FF7A59\">ЗАПРЕЩЕНО<\u002Fspan>\n                  <span style=\"font:400 11px/1.35 var(--font-sans);color:rgba(255,255,255,0.45);text-decoration:line-through;text-decoration-color:rgba(255,122,89,0.9)\">ядро → поверхность<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"margin-top:11px;padding-top:11px;border-top:1px solid rgba(255,255,255,0.10);font:400 12px/1.5 var(--font-sans);color:rgba(255,255,255,0.62)\">Если бы ядро знало о поверхности, новую поверхность нельзя было бы добавить, не переписав логику. Поэтому направление - часть архитектуры, а не стиль оформления.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"margin-top:16px;display:flex;flex-direction:column;gap:12px;align-items:flex-start\">\n            <button type=\"button\" sc-camel-on-click=\"{{ ex13 }}\" style=\"padding:9px 16px;border-radius:100px;cursor:pointer;font:600 12px/1 var(--font-sans);transition:background 140ms cubic-bezier(.22,.61,.36,1);border:1px solid {{ ex13bd }};background:{{ ex13bg }};color:#7FE7FF\">{{ ex13label }}<\u002Fbutton>\n            <sc-if value=\"{{ ex13open }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"width:100%;padding:18px 20px;border-radius:8px;border:1px solid rgba(127,231,255,0.30);border-left:3px solid #7FE7FF;background:rgba(127,231,255,0.06)\">\n                <div style=\"font:600 10px/1 var(--font-sans);letter-spacing:0.10em;text-transform:uppercase;color:#7FE7FF;margin-bottom:10px\">Пример · как у автора<\u002Fdiv>\n                <div style=\"font:400 14px/1.55 var(--font-sans);color:rgba(255,255,255,0.80)\">У меня ядро - Python-библиотека; служба отдает 82 инструмента тремя профилями (12 / 62 / 82) и пульт на одном локальном порту; 49 CLI-скриптов, редактор заметок - Obsidian. Инвариант «ядро не зависит от интерфейсов» охраняется отдельным тестом - как и реестр контрактов на все 82 инструмента и отказ на неизвестный аргумент.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ deep }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top:16px;padding:22px 24px;border-radius:8px;border:1px solid rgba(127,231,255,0.22);background:linear-gradient(180deg, rgba(1,43,158,0.30) 0%, rgba(15,23,36,0.6) 100%)\">\n              <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:#7FE7FF;margin-bottom:12px\">Подробно · инварианты и разделение хранилищ<\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;font:400 13px/1.5 var(--font-sans);color:rgba(255,255,255,0.68)\">\n                <div><b style=\"color:#fff;font-weight:600\">Проверяется автоматически.<\u002Fb> Тест-инвариант на направление импортов: попытка втащить интерфейс в ядро валит сборку.<\u002Fdiv>\n                <div><b style=\"color:#fff;font-weight:600\">Адаптеры на краю ядра.<\u002Fb> За общим интерфейсом: ядро знает контракт «читать, зеркалить, предлагать», но не знает, какая система за ним.<\u002Fdiv>\n                <div><b style=\"color:#fff;font-weight:600\">Хранилища разделены по природе.<\u002Fb> Файлы - под человека и версионирование; векторный индекс - под смысловой поиск; реляционная база - под факты, задания и очереди; зеркала - под чужие системы.<\u002Fdiv>\n                <div><b style=\"color:#fff;font-weight:600\">Восстановимо все, кроме файловой базы.<\u002Fb> Индексы, зеркала и журналы можно снести и пересобрать; файлы - единственное, что нельзя потерять. Состав инструментов отдается профилями под клиента: минимальный для чата, полный для пульта. Второй экземпляр - тот же код, другая папка, другой порт.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- 17 · Инвентарь -->\n      <section data-screen-label=\"17 Инвентарь\" style=\"flex:0 0 100%;height:100%;overflow-y:auto;overflow-x:hidden\">\n        <div style=\"max-width:1240px;margin:0 auto;padding:clamp(24px,3.2vh,44px) clamp(26px,4vw,64px) 72px\">\n          <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:#7FE7FF;margin-bottom:12px\">Акт III · глава 17 · 3 из 10<\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:14px;padding:9px 14px;border-radius:100px;background:rgba(127,231,255,0.06);border:1px solid rgba(127,231,255,0.20)\">\n            <span style=\"width:6px;height:6px;border-radius:100px;background:#7FE7FF;flex:0 0 auto\"><\u002Fspan>\n            <span style=\"font:400 clamp(12px,1vw,13px)/1.4 var(--font-sans);color:rgba(255,255,255,0.62)\">Компоненты назвали - теперь конкретика: что реально развернуто на машине и в каких количествах.<\u002Fspan>\n          <\u002Fdiv>\n          <h2 style=\"margin:0 0 8px;font:500 clamp(28px,3.4vw,48px)/1.07 var(--font-sans);letter-spacing:-0.03em;color:#fff\">Что стоит на машине<\u002Fh2>\n          <p style=\"margin:0 0 16px;font:400 clamp(14px,1.1vw,16px)/1.5 var(--font-sans);color:rgba(255,255,255,0.45)\">Наведи на строку - подсветится компонент на мини-карте.<\u002Fp>\n\n          <div style=\"display:grid;grid-template-columns:minmax(0,140px) minmax(0,200px) minmax(0,1fr);gap:0 16px;padding:0 14px 8px;font:600 10px/1 var(--font-sans);letter-spacing:0.10em;text-transform:uppercase;color:rgba(255,255,255,0.35)\">\n            <div>Что это<\u002Fdiv><div>Чем является<\u002Fdiv><div>За что отвечает<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:5px\">\n            <sc-for list=\"{{ inventory }}\" as=\"r\" hint-placeholder-count=\"11\">\n              <div sc-camel-on-mouse-enter=\"{{ r.onEnter }}\" style=\"display:grid;grid-template-columns:minmax(0,140px) minmax(0,200px) minmax(0,1fr);gap:16px;align-items:center;padding:11px 14px;border-radius:8px;transition:background 140ms cubic-bezier(.22,.61,.36,1);border:1px solid {{ r.bd }};background:{{ r.bg }}\">\n                <div style=\"font:600 13px/1.3 var(--font-sans);color:#fff\">{{ r.n }}<\u002Fdiv>\n                <div style=\"font:400 12px/1.4 var(--font-sans);color:#7FE7FF\">{{ r.what }}<\u002Fdiv>\n                <div style=\"font:400 13px/1.45 var(--font-sans);color:rgba(255,255,255,0.66)\">{{ r.role }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"margin-top:14px;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start\">\n            <div style=\"padding:18px 20px;border-radius:8px;border:1px solid rgba(127,231,255,0.28);background:rgba(1,43,158,0.28)\">\n              <div style=\"font:500 clamp(15px,1.4vw,20px)/1.3 var(--font-sans);letter-spacing:-0.02em;color:#fff\">Ничего серверного. Все перечисленное живет на одной машине и переживает перезагрузку.<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:10px;align-items:flex-start\">\n              <button type=\"button\" sc-camel-on-click=\"{{ toggleGroups }}\" style=\"padding:9px 16px;border-radius:100px;cursor:pointer;font:600 12px/1 var(--font-sans);transition:background 140ms cubic-bezier(.22,.61,.36,1);border:1px solid {{ groupsBd }};background:{{ groupsBg }};color:#7FE7FF\">{{ groupsLabel }}<\u002Fbutton>\n              <button type=\"button\" sc-camel-on-click=\"{{ exInv }}\" style=\"padding:9px 16px;border-radius:100px;cursor:pointer;font:600 12px/1 var(--font-sans);transition:background 140ms cubic-bezier(.22,.61,.36,1);border:1px solid {{ exInvBd }};background:{{ exInvBg }};color:#7FE7FF\">{{ exInvLabel }}<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ groupsOpen }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top:14px;padding:18px 20px;border-radius:8px;border:1px solid rgba(255,255,255,0.12);background:#0F1724\">\n              <div style=\"font:600 10px/1 var(--font-sans);letter-spacing:0.10em;text-transform:uppercase;color:#7FE7FF;margin-bottom:12px\">Группы инструментов сервера<\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px\">\n                <sc-for list=\"{{ toolgroups }}\" as=\"g\" hint-placeholder-count=\"7\">\n                  <div style=\"padding:12px 14px;border-radius:8px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08)\">\n                    <div style=\"font:600 12px/1.3 var(--font-sans);color:#fff;margin-bottom:6px\">{{ g.n }}<\u002Fdiv>\n                    <div style=\"font:400 12px/1.4 var(--font-sans);color:rgba(255,255,255,0.60)\">{{ g.t }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ exInvOpen }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top:14px;padding:18px 20px;border-radius:8px;border:1px solid rgba(127,231,255,0.30);border-left:3px solid #7FE7FF;background:rgba(127,231,255,0.06)\">\n              <div style=\"font:600 10px/1 var(--font-sans);letter-spacing:0.10em;text-transform:uppercase;color:#7FE7FF;margin-bottom:12px\">Пример · инвентарь как у автора<\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;font:400 13px/1.55 var(--font-sans);color:rgba(255,255,255,0.78)\">\n                <div><b style=\"color:#fff;font-weight:600\">82 инструмента службы тремя профилями.<\u002Fb> Минимальный для чата 12 · для пульта 62 · полный 82; пишущих 26.<\u002Fdiv>\n                <div><b style=\"color:#fff;font-weight:600\">Плюс.<\u002Fb> 49 CLI-скриптов, 9 сценариев-скиллов (и 1 личный), 8 фоновых заданий, 74 проверки доктора.<\u002Fdiv>\n                <div><b style=\"color:#fff;font-weight:600\">Стек.<\u002Fb> Python 3.11+, две модели поиска локально - BGE-M3 и реранкер (~4,5 ГБ), LanceDB (индекс 5,0 ГБ), SQLite (2,9 тыс. фактов, 1,5 тыс. источников, 52,8 тыс. событий), pandoc, launchd. 6163 автотеста; ядро не зависит от интерфейсов и каждый инструмент принимает обратно все, что отдает, - оба инварианта проверяются тестами.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ deep }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top:14px;padding:22px 24px;border-radius:8px;border:1px solid rgba(127,231,255,0.22);background:linear-gradient(180deg, rgba(1,43,158,0.30) 0%, rgba(15,23,36,0.6) 100%)\">\n              <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:#7FE7FF;margin-bottom:12px\">Подробно · сценарии-скиллы, стек и тесты<\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;font:400 14px/1.55 var(--font-sans);color:rgba(255,255,255,0.68)\">\n                <div><b style=\"color:#fff;font-weight:600\">Скиллы - не код.<\u002Fb> Это описание задачи плюс порядок вызова инструментов обычным текстом. Клиент подхватывает скилл по описанию и сам решает, когда он уместен: «разбери инбокс» превращается в цепочку из десятка вызовов.<\u002Fdiv>\n                <div><b style=\"color:#fff;font-weight:600\">Стек по ролям.<\u002Fb> Интерпретируемый язык общего назначения для ядра, локальная модель эмбеддингов для смыслового поиска, векторная база под индекс, встроенная реляционная база под факты и очереди, конвертер документов на выводе, системный планировщик под расписание.<\u002Fdiv>\n                <div><b style=\"color:#fff;font-weight:600\">Тесты - часть инвентаря.<\u002Fb> Проверяются не только функции, но и инварианты: направление зависимостей, обязательная строка аудита у каждого пишущего инструмента, барьер приватности на всех уровнях.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- 18 · Три контура -->\n      <section data-screen-label=\"18 Три контура данных\" style=\"flex:0 0 100%;height:100%;overflow-y:auto;overflow-x:hidden\">\n        <div style=\"max-width:1240px;margin:0 auto;padding:clamp(24px,3.2vh,44px) clamp(26px,4vw,64px) 72px\">\n          <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:#7FE7FF;margin-bottom:12px\">Акт III · глава 18 · 4 из 10<\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:14px;padding:9px 14px;border-radius:100px;background:rgba(127,231,255,0.06);border:1px solid rgba(127,231,255,0.20)\">\n            <span style=\"width:6px;height:6px;border-radius:100px;background:#7FE7FF;flex:0 0 auto\"><\u002Fspan>\n            <span style=\"font:400 clamp(12px,1vw,13px)/1.4 var(--font-sans);color:rgba(255,255,255,0.62)\">Статику разобрали. Дальше - динамика: данные текут тремя разными способами, и путать их нельзя.<\u002Fspan>\n          <\u002Fdiv>\n          <h2 style=\"margin:0 0 8px;font:500 clamp(28px,3.4vw,48px)/1.07 var(--font-sans);letter-spacing:-0.03em;color:#fff\">Три контура<\u002Fh2>\n          <p style=\"margin:0 0 16px;font:400 clamp(14px,1.1vw,16px)/1.5 var(--font-sans);color:rgba(255,255,255,0.45)\">Выбери контур - подсветится его путь; мини-карта покажет задействованные компоненты.<\u002Fp>\n\n          <div style=\"display:flex;flex-direction:column;gap:10px;margin-bottom:16px\">\n            <sc-for list=\"{{ contours }}\" as=\"c\" hint-placeholder-count=\"3\">\n              <button type=\"button\" sc-camel-on-click=\"{{ c.onClick }}\" style=\"display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr);gap:16px;align-items:center;width:100%;text-align:left;padding:14px 18px;border-radius:8px;cursor:pointer;transition:background 140ms cubic-bezier(.22,.61,.36,1);border:1px solid {{ c.bd }};background:{{ c.bg }};color:#fff\">\n                <span style=\"display:flex;flex-direction:column;gap:6px\">\n                  <span style=\"font:600 12px/1.2 var(--font-sans);letter-spacing:0.08em;color:#7FE7FF\">{{ c.n }}<\u002Fspan>\n                  <span style=\"font:400 11px/1.3 var(--font-sans);color:rgba(255,255,255,0.42)\">{{ c.kind }}<\u002Fspan>\n                <\u002Fspan>\n                <span style=\"display:flex;align-items:center;gap:8px;flex-wrap:wrap\">\n                  <sc-for list=\"{{ c.steps }}\" as=\"st\" hint-placeholder-count=\"5\">\n                    <span style=\"display:flex;align-items:center;gap:8px\">\n                      <span style=\"padding:8px 12px;border-radius:8px;font:400 13px/1.3 var(--font-sans);transition:background 140ms cubic-bezier(.22,.61,.36,1);border:1px solid {{ st.bd }};background:{{ st.bg }};color:{{ st.fg }}\">{{ st.t }}<\u002Fspan>\n                      <sc-if value=\"{{ st.notLast }}\" hint-placeholder-val=\"{{ true }}\">\n                        <span style=\"font:400 12px/1 var(--font-sans);color:rgba(127,231,255,0.5)\">→<\u002Fspan>\n                      <\u002Fsc-if>\n                    <\u002Fspan>\n                  <\u002Fsc-for>\n                <\u002Fspan>\n              <\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start\">\n            <div style=\"padding:18px 20px;border-radius:8px;background:rgba(255,255,255,0.04);border-left:2px solid #7FE7FF\">\n              <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.42);margin-bottom:8px\">Механика контура · {{ contourName }}<\u002Fdiv>\n              <div style=\"font:400 15px/1.5 var(--font-sans);color:rgba(255,255,255,0.80)\">{{ contourMech }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"padding:18px 20px;border-radius:8px;border:1px solid rgba(127,231,255,0.28);background:rgba(1,43,158,0.28)\">\n              <div style=\"font:500 clamp(15px,1.4vw,20px)/1.3 var(--font-sans);letter-spacing:-0.02em;color:#fff\">Смешать контуры - получить кашу. Разделить - получить систему.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"margin-top:16px;display:flex;flex-direction:column;gap:12px;align-items:flex-start\">\n            <button type=\"button\" sc-camel-on-click=\"{{ ex14 }}\" style=\"padding:9px 16px;border-radius:100px;cursor:pointer;font:600 12px/1 var(--font-sans);transition:background 140ms cubic-bezier(.22,.61,.36,1);border:1px solid {{ ex14bd }};background:{{ ex14bg }};color:#7FE7FF\">{{ ex14label }}<\u002Fbutton>\n            <sc-if value=\"{{ ex14open }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"width:100%;padding:18px 20px;border-radius:8px;border:1px solid rgba(127,231,255,0.30);border-left:3px solid #7FE7FF;background:rgba(127,231,255,0.06)\">\n                <div style=\"font:600 10px/1 var(--font-sans);letter-spacing:0.10em;text-transform:uppercase;color:#7FE7FF;margin-bottom:10px\">Пример · как у автора<\u002Fdiv>\n                <div style=\"font:400 14px/1.55 var(--font-sans);color:rgba(255,255,255,0.80)\">Мой корпус трехслойный: курированная база, текущее сырье, архив с 2018 года - поиск ранжирует слои по-разному.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ deep }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top:16px;padding:22px 24px;border-radius:8px;border:1px solid rgba(127,231,255,0.22);background:linear-gradient(180deg, rgba(1,43,158,0.30) 0%, rgba(15,23,36,0.6) 100%)\">\n              <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:#7FE7FF;margin-bottom:12px\">Подробно · {{ contourName }} контур<\u002Fdiv>\n              <div style=\"font:400 14px/1.55 var(--font-sans);color:rgba(255,255,255,0.70)\">{{ contourDeep }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- 19 · Путь знания -->\n      <section data-screen-label=\"19 Путь знания\" style=\"flex:0 0 100%;height:100%;overflow-y:auto;overflow-x:hidden\">\n        <div style=\"max-width:1240px;margin:0 auto;padding:clamp(24px,3.2vh,44px) clamp(26px,4vw,64px) 72px\">\n          <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:#7FE7FF;margin-bottom:12px\">Акт III · глава 19 · 5 из 10<\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:14px;padding:9px 14px;border-radius:100px;background:rgba(127,231,255,0.06);border:1px solid rgba(127,231,255,0.20)\">\n            <span style=\"width:6px;height:6px;border-radius:100px;background:#7FE7FF;flex:0 0 auto\"><\u002Fspan>\n            <span style=\"font:400 clamp(12px,1vw,13px)/1.4 var(--font-sans);color:rgba(255,255,255,0.62)\">Контуры назвали - проследим первый вживую: как мысль или письмо становится тем, что двойник помнит и находит.<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:16px\">\n            <div>\n              <h2 style=\"margin:0 0 6px;font:500 clamp(28px,3.4vw,48px)/1.07 var(--font-sans);letter-spacing:-0.03em;color:#fff\">От захвата до ответа<\u002Fh2>\n              <p style=\"margin:0;font:400 clamp(14px,1.1vw,16px)/1.5 var(--font-sans);color:rgba(255,255,255,0.45)\">Клик по шагу - что произойдет, если он откажет.<\u002Fp>\n            <\u002Fdiv>\n            <button type=\"button\" sc-camel-on-click=\"{{ playKnow }}\" style=\"padding:11px 20px;border-radius:100px;cursor:pointer;font:600 12px/1 var(--font-sans);white-space:nowrap;border:1px solid rgba(127,231,255,0.45);background:rgba(127,231,255,0.10);color:#7FE7FF\">{{ playKnowLabel }}<\u002Fbutton>\n          <\u002Fdiv>\n\n          <div style=\"display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:14px\">\n            <sc-for list=\"{{ knowSteps }}\" as=\"k\" hint-placeholder-count=\"8\">\n              <button type=\"button\" sc-camel-on-click=\"{{ k.onClick }}\" style=\"display:flex;flex-direction:column;gap:7px;text-align:left;padding:13px 14px;border-radius:8px;cursor:pointer;min-height:122px;transition:background 140ms cubic-bezier(.22,.61,.36,1);border:1px solid {{ k.bd }};background:{{ k.bg }}\">\n                <span style=\"font:600 12px/1.2 var(--font-sans);color:{{ k.fg }}\">{{ k.n }}<\u002Fspan>\n                <span style=\"font:600 10px/1 var(--font-sans);letter-spacing:0.06em;text-transform:uppercase;color:#7FE7FF\">{{ k.by }}<\u002Fspan>\n                <span style=\"font:400 12px/1.4 var(--font-sans);color:rgba(255,255,255,0.58)\">{{ k.t }}<\u002Fspan>\n              <\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;align-items:start\">\n            <div style=\"padding:18px 20px;border-radius:8px;background:rgba(255,122,89,0.07);border-left:2px solid #FF7A59\">\n              <div style=\"font:600 10px/1 var(--font-sans);letter-spacing:0.10em;text-transform:uppercase;color:#FFC48A;margin-bottom:8px\">{{ kstepName }} · если шаг откажет<\u002Fdiv>\n              <div style=\"font:400 15px/1.5 var(--font-sans);color:rgba(255,255,255,0.80)\">{{ kstepFail }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"padding:18px 20px;border-radius:8px;border:1px solid rgba(127,231,255,0.28);background:rgba(1,43,158,0.28)\">\n              <div style=\"font:500 clamp(15px,1.4vw,20px)/1.3 var(--font-sans);letter-spacing:-0.02em;color:#fff\">Между «положил» и «нашел» - пять служебных шагов. Именно они отличают память от папки с файлами.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"margin-top:16px;display:flex;flex-direction:column;gap:12px;align-items:flex-start\">\n            <button type=\"button\" sc-camel-on-click=\"{{ ex15 }}\" style=\"padding:9px 16px;border-radius:100px;cursor:pointer;font:600 12px/1 var(--font-sans);transition:background 140ms cubic-bezier(.22,.61,.36,1);border:1px solid {{ ex15bd }};background:{{ ex15bg }};color:#7FE7FF\">{{ ex15label }}<\u002Fbutton>\n            <sc-if value=\"{{ ex15open }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"width:100%;padding:18px 20px;border-radius:8px;border:1px solid rgba(127,231,255,0.30);border-left:3px solid #7FE7FF;background:rgba(127,231,255,0.06)\">\n                <div style=\"font:600 10px/1 var(--font-sans);letter-spacing:0.10em;text-transform:uppercase;color:#7FE7FF;margin-bottom:10px\">Пример · как у автора<\u002Fdiv>\n                <div style=\"font:400 14px/1.55 var(--font-sans);color:rgba(255,255,255,0.80)\">У меня повторная индексация неизмененного корпуса - 0,2 с вместо ~19 мин: без этого ночная сборка была бы бессмысленной.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ deep }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top:16px;padding:22px 24px;border-radius:8px;border:1px sol
