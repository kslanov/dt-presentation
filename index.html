verflow-x:hidden\">\n        <div style=\"max-width:1240px;margin:0 auto;padding:clamp(24px,3.2vh,44px) clamp(26px,4vw,64px) 72px\">\n          <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:#7FE7FF;margin-bottom:14px\">Акт II · глава 9<\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:20px\">\n            <div>\n              <h2 style=\"margin:0 0 8px;font:500 clamp(28px,3.4vw,48px)/1.07 var(--font-sans);letter-spacing:-0.03em;color:#fff\">Задачи, сделки, договорённости<\u002Fh2>\n              <p style=\"margin:0;font:400 clamp(14px,1.1vw,16px)/1.5 var(--font-sans);color:rgba(255,255,255,0.45)\">Переключи режим доверия — и посмотри, как меняется петля.<\u002Fp>\n            <\u002Fdiv>\n            <button type=\"button\" sc-camel-on-click=\"{{ toggleOps }}\" style=\"padding:11px 20px;border-radius:100px;cursor:pointer;font:600 12px/1 var(--font-sans);white-space:nowrap;transition:background 140ms cubic-bezier(.22,.61,.36,1);border:1px solid {{ opsBtnBd }};background:{{ opsBtnBg }};color:#fff\">Режим: {{ opsBtnLabel }}<\u002Fbutton>\n          <\u002Fdiv>\n\n          <div style=\"display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:14px\">\n            <sc-for list=\"{{ ops }}\" as=\"o\" hint-placeholder-count=\"6\">\n              <div style=\"padding:16px 14px;border-radius:8px;transition:background 140ms cubic-bezier(.22,.61,.36,1);border:1px solid {{ o.bd }};background:{{ o.bg }};display:flex;flex-direction:column;gap:8px;min-height:118px\">\n                <span style=\"font:600 13px/1.2 var(--font-sans);color:{{ o.fg }}\">{{ o.n }}<\u002Fspan>\n                <span style=\"font:400 13px/1.4 var(--font-sans);color:rgba(255,255,255,0.58)\">{{ o.t }}<\u002Fspan>\n                <span style=\"margin-top:auto;font:400 11px/1.3 var(--font-sans);color:#7FE7FF\">{{ o.note }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;align-items:start\">\n            <div style=\"padding:18px 20px;border-radius:8px;background:rgba(255,255,255,0.04);border-left:2px solid #7FE7FF\">\n              <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.42);margin-bottom:8px\">Лестница доверия<\u002Fdiv>\n              <div style=\"font:400 15px/1.5 var(--font-sans);color:rgba(255,255,255,0.80)\">{{ opsNote }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"padding:20px 22px;border-radius:8px;border:1px solid rgba(127,231,255,0.28);background:rgba(1,43,158,0.28)\">\n              <div style=\"font:500 clamp(17px,1.55vw,22px)/1.3 var(--font-sans);letter-spacing:-0.02em;color:#fff\">Двойник предлагает. Записываешь — ты. Всегда.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"margin-top:16px;display:flex;flex-direction:column;gap:12px;align-items:flex-start\">\n            <button type=\"button\" sc-camel-on-click=\"{{ ex9 }}\" style=\"padding:9px 16px;border-radius:100px;cursor:pointer;font:600 12px/1 var(--font-sans);transition:background 140ms cubic-bezier(.22,.61,.36,1);border:1px solid {{ ex9bd }};background:{{ ex9bg }};color:#7FE7FF\">{{ ex9label }}<\u002Fbutton>\n            <sc-if value=\"{{ ex9open }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"width:100%;padding:18px 20px;border-radius:8px;border:1px solid rgba(127,231,255,0.30);border-left:3px solid #7FE7FF;background:rgba(127,231,255,0.06)\">\n                <div style=\"font:600 10px/1 var(--font-sans);letter-spacing:0.10em;text-transform:uppercase;color:#7FE7FF;margin-bottom:10px\">Пример · как у автора<\u002Fdiv>\n                <div style=\"font:400 14px/1.55 var(--font-sans);color:rgba(255,255,255,0.80)\">У меня «руками» работают корпоративная CRM (Timetta), мобильный задачник (TickTick) и почта (Outlook): захват с телефона, зеркало сделок, чек-листы — всё через очередь подтверждений. Это опциональные коннекторы: у твоего двойника будут твои.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ deep }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top:16px;padding:22px 24px;border-radius:8px;border:1px solid rgba(127,231,255,0.22);background:linear-gradient(180deg, rgba(1,43,158,0.30) 0%, rgba(15,23,36,0.6) 100%)\">\n              <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:#7FE7FF;margin-bottom:12px\">Подробно · очередь подтверждений и лестница доверия<\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;font:400 14px/1.55 var(--font-sans);color:rgba(255,255,255,0.68)\">\n                <div><b style=\"color:#fff;font-weight:600\">Очередь как механизм.<\u002Fb> Каждая запись во внешнюю систему проходит через явное «да»: до подтверждения существует только предложение. Все действия — и согласия, и отказы — попадают в журнал, по которому можно разобрать любую запись задним числом.<\u002Fdiv>\n                <div><b style=\"color:#fff;font-weight:600\">Лестница доверия.<\u002Fb> По мере привыкания рутинные классы операций переводятся в полуавтомат: двойник делает сам, ты видишь результат в журнале. Новые и рискованные операции остаются на подтверждении независимо от ступени.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- 10 · Четыре поверхности -->\n      <section data-screen-label=\"10 Четыре поверхности\" style=\"flex:0 0 100%;height:100%;overflow-y:auto;overflow-x:hidden\">\n        <div style=\"max-width:1240px;margin:0 auto;padding:clamp(24px,3.2vh,44px) clamp(26px,4vw,64px) 72px\">\n          <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:#7FE7FF;margin-bottom:14px\">Акт II · глава 10<\u002Fdiv>\n          <h2 style=\"margin:0 0 8px;font:500 clamp(28px,3.4vw,48px)/1.07 var(--font-sans);letter-spacing:-0.03em;color:#fff\">Где ты его встречаешь<\u002Fh2>\n          <p style=\"margin:0 0 20px;font:400 clamp(14px,1.1vw,16px)/1.5 var(--font-sans);color:rgba(255,255,255,0.45)\">Клик по поверхности — как она выглядит в руках. Экраны синтетические.<\u002Fp>\n\n          <div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:18px;align-items:start\">\n            <div style=\"position:relative;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px\">\n              <sc-for list=\"{{ surfaces }}\" as=\"f\" hint-placeholder-count=\"4\">\n                <button type=\"button\" sc-camel-on-click=\"{{ f.onClick }}\" style=\"text-align:left;padding:18px;border-radius:8px;cursor:pointer;min-height:120px;transition:background 140ms cubic-bezier(.22,.61,.36,1);border:1px solid {{ f.bd }};background:{{ f.bg }};color:#fff\">\n                  <div style=\"font:600 12px/1 var(--font-sans);letter-spacing:0.08em;color:#7FE7FF;margin-bottom:12px\">{{ f.n }}<\u002Fdiv>\n                  <div style=\"font:400 14px/1.45 var(--font-sans);color:rgba(255,255,255,0.68)\">{{ f.sub }}<\u002Fdiv>\n                <\u002Fbutton>\n              <\u002Fsc-for>\n              <div style=\"position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:78px;height:78px;border-radius:100px;border:1px solid rgba(127,231,255,0.45);background:#030507;display:flex;align-items:center;justify-content:center;font:600 12px/1.2 var(--font-sans);color:#fff;text-align:center\">ты<\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"padding:20px 22px;border-radius:8px;border:1px solid rgba(255,255,255,0.12);background:#0F1724\">\n              <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:14px\">\n                <span style=\"font:600 12px/1 var(--font-sans);letter-spacing:0.08em;color:#7FE7FF\">{{ surfName }}<\u002Fspan>\n                <span style=\"font:400 12px/1.3 var(--font-sans);color:rgba(255,255,255,0.42);text-align:right\">{{ surfSub }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:8px\">\n                <sc-for list=\"{{ surfRows }}\" as=\"r\" hint-placeholder-count=\"4\">\n                  <div style=\"display:grid;grid-template-columns:110px minmax(0,1fr);gap:14px;padding:12px 14px;border-radius:8px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08)\">\n                    <span style=\"font:600 12px/1.35 var(--font-sans);color:rgba(255,255,255,0.45)\">{{ r.k }}<\u002Fspan>\n                    <span style=\"font:400 14px/1.45 var(--font-sans);color:rgba(255,255,255,0.82)\">{{ r.v }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"margin-top:16px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start\">\n            <div style=\"padding:20px 22px;border-radius:8px;border:1px solid rgba(127,231,255,0.28);background:rgba(1,43,158,0.28)\">\n              <div style=\"font:500 clamp(17px,1.55vw,22px)/1.3 var(--font-sans);letter-spacing:-0.02em;color:#fff\">Двойник — не ещё одно приложение. Он живёт в тех местах, где ты и так работаешь.<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:12px;align-items:flex-start\">\n              <button type=\"button\" sc-camel-on-click=\"{{ ex10 }}\" style=\"padding:9px 16px;border-radius:100px;cursor:pointer;font:600 12px/1 var(--font-sans);transition:background 140ms cubic-bezier(.22,.61,.36,1);border:1px solid {{ ex10bd }};background:{{ ex10bg }};color:#7FE7FF\">{{ ex10label }}<\u002Fbutton>\n              <sc-if value=\"{{ ex10open }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"width:100%;padding:18px 20px;border-radius:8px;border:1px solid rgba(127,231,255,0.30);border-left:3px solid #7FE7FF;background:rgba(127,231,255,0.06)\">\n                  <div style=\"font:600 10px/1 var(--font-sans);letter-spacing:0.10em;text-transform:uppercase;color:#7FE7FF;margin-bottom:10px\">Пример · как у автора<\u002Fdiv>\n                  <div style=\"font:400 14px/1.55 var(--font-sans);color:rgba(255,255,255,0.80)\">У меня: диалог — Claude/Cowork, заметки — Obsidian, телефон — TickTick, пульт — свой, четыре вкладки: Работа / Двойник / Мониторинг / Настройки.<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ deep }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top:16px;padding:22px 24px;border-radius:8px;border:1px solid rgba(127,231,255,0.22);background:linear-gradient(180deg, rgba(1,43,158,0.30) 0%, rgba(15,23,36,0.6) 100%)\">\n              <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:#7FE7FF;margin-bottom:12px\">Подробно · почему память — обычные файлы и что показывает пульт<\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;font:400 14px/1.55 var(--font-sans);color:rgba(255,255,255,0.68)\">\n                <div><b style=\"color:#fff;font-weight:600\">Файлы, а не база в чьём-то облаке.<\u002Fb> Переносимость: папку можно скопировать и унести. Вечный формат: текст читается любым редактором и через двадцать лет. Правится чем угодно — двойник не единственный способ добраться до собственных знаний.<\u002Fdiv>\n                <div><b style=\"color:#fff;font-weight:600\">Пульт.<\u002Fb> Очереди: что ждёт подтверждения. Журнал событий: что произошло и по чьей команде. Здоровье системы: на месте ли память, факты и связи, когда последний раз проходила фоновая работа.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- 11 · Правила -->\n      <section data-screen-label=\"11 Правила\" style=\"flex:0 0 100%;height:100%;overflow-y:auto;overflow-x:hidden\">\n        <div style=\"max-width:1240px;margin:0 auto;padding:clamp(24px,3.2vh,44px) clamp(26px,4vw,64px) 72px\">\n          <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:#7FE7FF;margin-bottom:14px\">Акт II · глава 11<\u002Fdiv>\n          <h2 style=\"margin:0 0 8px;font:500 clamp(28px,3.4vw,48px)/1.07 var(--font-sans);letter-spacing:-0.03em;color:#fff\">Грани, которые двойник не переступает<\u002Fh2>\n          <p style=\"margin:0 0 20px;font:400 clamp(14px,1.1vw,16px)/1.5 var(--font-sans);color:rgba(255,255,255,0.45)\">Наведи на правило — одна строка о том, как оно устроено. Правила прошиты в нить, а не наклеены сверху.<\u002Fp>\n\n          <div style=\"display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,0.85fr);gap:18px;align-items:start\">\n            <div style=\"display:flex;flex-direction:column;gap:9px\">\n              <sc-for list=\"{{ rules }}\" as=\"r\" hint-placeholder-count=\"5\">\n                <div sc-camel-on-mouse-enter=\"{{ r.onEnter }}\" style=\"display:grid;grid-template-columns:minmax(0,215px) minmax(0,1fr);gap:18px;align-items:center;padding:15px 18px;border-radius:8px;transition:background 140ms cubic-bezier(.22,.61,.36,1);border:1px solid {{ r.bd }};background:{{ r.bg }}\">\n                  <div style=\"display:flex;align-items:center;gap:10px\">\n                    <span style=\"width:7px;height:7px;border-radius:100px;background:#7FE7FF;flex:0 0 auto\"><\u002Fspan>\n                    <span style=\"font:600 clamp(14px,1.2vw,17px)/1.2 var(--font-sans);letter-spacing:-0.01em;color:#fff\">{{ r.n }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"font:400 clamp(13px,1.05vw,15px)/1.45 var(--font-sans);color:rgba(255,255,255,0.68)\">{{ r.t }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <div style=\"margin-top:6px;padding:16px 18px;border-radius:8px;background:rgba(255,255,255,0.04);border-left:2px solid #7FE7FF\">\n                <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.42);margin-bottom:8px\">Как это устроено · {{ ruleName }}<\u002Fdiv>\n                <div style=\"font:400 15px/1.5 var(--font-sans);color:rgba(255,255,255,0.80)\">{{ ruleHow }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"display:flex;flex-direction:column;gap:14px\">\n              <div style=\"height:clamp(220px,32vh,320px);border-radius:8px;border:1px solid rgba(255,255,255,0.10);background:rgba(255,255,255,0.02)\">\n                <canvas ref=\"{{ rulesRef }}\" style=\"width:100%;height:100%;display:block\"><\u002Fcanvas>\n              <\u002Fdiv>\n              <div style=\"padding:20px 22px;border-radius:8px;border:1px solid rgba(127,231,255,0.28);background:rgba(1,43,158,0.28)\">\n                <div style=\"font:500 clamp(17px,1.55vw,22px)/1.3 var(--font-sans);letter-spacing:-0.02em;color:#fff\">Доверие двойнику растёт ступенями — как сотруднику.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ deep }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top:16px;padding:22px 24px;border-radius:8px;border:1px solid rgba(127,231,255,0.22);background:linear-gradient(180deg, rgba(1,43,158,0.30) 0%, rgba(15,23,36,0.6) 100%)\">\n              <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:#7FE7FF;margin-bottom:12px\">Подробно · правила как встроенные механизмы<\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;font:400 14px/1.55 var(--font-sans);color:rgba(255,255,255,0.68)\">\n                <div><b style=\"color:#fff;font-weight:600\">Барьер приватности.<\u002Fb> Работает на всех уровнях сразу — от захвата до генерации: помеченное не индексируется, не находится и не попадает в контекст.<\u002Fdiv>\n                <div><b style=\"color:#fff;font-weight:600\">Журнал аудита.<\u002Fb> Каждая запись во внешнюю систему оставляет след: что, куда, когда и по чьему подтверждению.<\u002Fdiv>\n                <div><b style=\"color:#fff;font-weight:600\">Блокировка вместо заглушки.<\u002Fb> Нет данных — задача останавливается со списком недостающего; правдоподобный текст без опоры не выдаётся никогда.<\u002Fdiv>\n                <div><b style=\"color:#fff;font-weight:600\">Конституция системы.<\u002Fb> У автора таких архитектурных принципов 19: каждое изменение проверяется на соответствие им, иначе оно не попадает в геном.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- 12 · Разделитель Акт III -->\n      <section data-screen-label=\"12 Разделитель — Акт III\" style=\"flex:0 0 100%;height:100%;overflow-y:auto;overflow-x:hidden\">\n        <div style=\"max-width:1240px;margin:0 auto;padding:clamp(26px,4vw,64px);min-height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,0.75fr);gap:clamp(24px,4vw,56px);align-items:center\">\n          <div>\n            <div style=\"font:600 clamp(12px,1.3vw,15px)/1 var(--font-sans);letter-spacing:0.14em;color:#7FE7FF;margin-bottom:22px\">АКТ III · КАК ЭТО УСТРОЕНО<\u002Fdiv>\n            <h2 style=\"margin:0;font:500 clamp(28px,3.6vw,50px)/1.06 var(--font-sans);letter-spacing:-0.04em;color:#fff\">Дальше — машинное отделение: слои, потоки, механизмы<\u002Fh2>\n            <p style=\"margin:22px 0 32px;max-width:520px;font:400 clamp(14px,1.15vw,17px)/1.5 var(--font-sans);color:rgba(255,255,255,0.45)\">Здесь термины разрешены. Если техника не нужна — акт можно пропустить целиком, ничего не потеряв в понимании.<\u002Fp>\n            <button type=\"button\" sc-camel-on-click=\"{{ skipTech }}\" style=\"padding:14px 26px;border-radius:100px;cursor:pointer;font:600 14px/1 var(--font-sans);border:1px solid rgba(127,231,255,0.45);background:rgba(127,231,255,0.08);color:#7FE7FF\">Пропустить технику →<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"height:min(46vh,420px)\">\n            <canvas ref=\"{{ techRef }}\" style=\"width:100%;height:100%;display:block\"><\u002Fcanvas>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- 13 · Архитектура сверху -->\n      <section data-screen-label=\"13 Архитектура сверху\" style=\"flex:0 0 100%;height:100%;overflow-y:auto;overflow-x:hidden\">\n        <div style=\"max-width:1240px;margin:0 auto;padding:clamp(24px,3.2vh,44px) clamp(26px,4vw,64px) 72px\">\n          <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:#7FE7FF;margin-bottom:14px\">Акт III · глава 13<\u002Fdiv>\n          <h2 style=\"margin:0 0 8px;font:500 clamp(28px,3.4vw,48px)/1.07 var(--font-sans);letter-spacing:-0.03em;color:#fff\">Две половины<\u002Fh2>\n          <p style=\"margin:0 0 20px;font:400 clamp(14px,1.1vw,16px)/1.5 var(--font-sans);color:rgba(255,255,255,0.45)\">Клик по блоку — его роль и что сломается без него.<\u002Fp>\n\n          <div style=\"display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px;align-items:start\">\n            <div style=\"display:flex;flex-direction:column;gap:10px\">\n              <sc-for list=\"{{ arch }}\" as=\"a\" hint-placeholder-count=\"4\">\n                <button type=\"button\" sc-camel-on-click=\"{{ a.onClick }}\" style=\"display:grid;grid-template-columns:minmax(0,180px) minmax(0,1fr);gap:18px;align-items:center;width:100%;text-align:left;padding:16px 18px;border-radius:8px;cursor:pointer;transition:background 140ms cubic-bezier(.22,.61,.36,1);border:1px solid {{ a.bd }};background:{{ a.bg }};color:#fff\">\n                  <span style=\"font:600 12px/1.2 var(--font-sans);letter-spacing:0.08em;color:#7FE7FF\">{{ a.n }}<\u002Fspan>\n                  <span style=\"font:400 clamp(13px,1.05vw,15px)/1.45 var(--font-sans);color:rgba(255,255,255,0.70)\">{{ a.t }}<\u002Fspan>\n                <\u002Fbutton>\n              <\u002Fsc-for>\n              <div style=\"display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:8px;background:rgba(255,255,255,0.03);border:1px dashed rgba(127,231,255,0.30)\">\n                <span style=\"font:600 12px/1 var(--font-sans);color:#7FE7FF;white-space:nowrap\">база → производное<\u002Fspan>\n                <span style=\"flex:1 1 auto;height:2px;border-radius:100px;background:linear-gradient(90deg, rgba(127,231,255,0.7) 0%, rgba(127,231,255,0.1) 100%)\"><\u002Fspan>\n                <span style=\"font:400 13px/1.4 var(--font-sans);color:rgba(255,255,255,0.62)\">движок читает базу и строит производные — база остаётся чистой и переносимой<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"display:flex;flex-direction:column;gap:14px\">\n              <div style=\"padding:20px 22px;border-radius:8px;border:1px solid rgba(255,255,255,0.12);background:#0F1724\">\n                <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:#7FE7FF;margin-bottom:10px\">{{ archName }}<\u002Fdiv>\n                <div style=\"font:400 15px/1.5 var(--font-sans);color:rgba(255,255,255,0.82);margin-bottom:14px\">{{ archRole }}<\u002Fdiv>\n                <div style=\"padding:13px 15px;border-radius:8px;background:rgba(255,122,89,0.08);border-left:2px solid #FF7A59\">\n                  <div style=\"font:600 10px/1 var(--font-sans);letter-spacing:0.10em;text-transform:uppercase;color:#FFC48A;margin-bottom:8px\">Что сломается без него<\u002Fdiv>\n                  <div style=\"font:400 14px/1.5 var(--font-sans);color:rgba(255,255,255,0.72)\">{{ archWithout }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"padding:20px 22px;border-radius:8px;border:1px solid rgba(127,231,255,0.28);background:rgba(1,43,158,0.28)\">\n                <div style=\"font:500 clamp(16px,1.5vw,21px)/1.3 var(--font-sans);letter-spacing:-0.02em;color:#fff\">Всё производное можно снести и пересобрать. Источник истины — только файлы.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"margin-top:16px;display:flex;flex-direction:column;gap:12px;align-items:flex-start\">\n            <button type=\"button\" sc-camel-on-click=\"{{ ex13 }}\" style=\"padding:9px 16px;border-radius:100px;cursor:pointer;font:600 12px/1 var(--font-sans);transition:background 140ms cubic-bezier(.22,.61,.36,1);border:1px solid {{ ex13bd }};background:{{ ex13bg }};color:#7FE7FF\">{{ ex13label }}<\u002Fbutton>\n            <sc-if value=\"{{ ex13open }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"width:100%;padding:18px 20px;border-radius:8px;border:1px solid rgba(127,231,255,0.30);border-left:3px solid #7FE7FF;background:rgba(127,231,255,0.06)\">\n                <div style=\"font:600 10px/1 var(--font-sans);letter-spacing:0.10em;text-transform:uppercase;color:#7FE7FF;margin-bottom:10px\">Пример · как у автора<\u002Fdiv>\n                <div style=\"font:400 14px/1.55 var(--font-sans);color:rgba(255,255,255,0.80)\">У меня: vault (markdown, git, Obsidian Sync) + engine (Python). Ядро не зависит от интерфейсов — это охраняется тестом.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ deep }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top:16px;padding:22px 24px;border-radius:8px;border:1px solid rgba(127,231,255,0.22);background:linear-gradient(180deg, rgba(1,43,158,0.30) 0%, rgba(15,23,36,0.6) 100%)\">\n              <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:#7FE7FF;margin-bottom:12px\">Подробно · почему разделение именно такое<\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;font:400 14px/1.55 var(--font-sans);color:rgba(255,255,255,0.68)\">\n                <div><b style=\"color:#fff;font-weight:600\">База живёт в git и синхронизируется.<\u002Fb> История правок, откат, перенос на другую машину — всё это даёт версионирование обычных файлов, а не отдельный механизм внутри системы.<\u002Fdiv>\n                <div><b style=\"color:#fff;font-weight:600\">Движок обновляется независимо.<\u002Fb> Новая версия кода не трогает содержимое базы: обновление — это замена движка, а не миграция знаний.<\u002Fdiv>\n                <div><b style=\"color:#fff;font-weight:600\">Производное — per-machine и восстановимо.<\u002Fb> Индексы, кэши и зеркала не синхронизируются между машинами: их дешевле пересобрать, чем согласовывать.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- 14 · Три контура -->\n      <section data-screen-label=\"14 Три контура данных\" style=\"flex:0 0 100%;height:100%;overflow-y:auto;overflow-x:hidden\">\n        <div style=\"max-width:1240px;margin:0 auto;padding:clamp(24px,3.2vh,44px) clamp(26px,4vw,64px) 72px\">\n          <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:#7FE7FF;margin-bottom:14px\">Акт III · глава 14<\u002Fdiv>\n          <h2 style=\"margin:0 0 8px;font:500 clamp(28px,3.4vw,48px)/1.07 var(--font-sans);letter-spacing:-0.03em;color:#fff\">Три контура<\u002Fh2>\n          <p style=\"margin:0 0 20px;font:400 clamp(14px,1.1vw,16px)/1.5 var(--font-sans);color:rgba(255,255,255,0.45)\">Выбери контур — подсветится его путь от источника до результата.<\u002Fp>\n\n          <div style=\"display:flex;flex-direction:column;gap:10px;margin-bottom:16px\">\n            <sc-for list=\"{{ contours }}\" as=\"c\" hint-placeholder-count=\"3\">\n              <button type=\"button\" sc-camel-on-click=\"{{ c.onClick }}\" style=\"display:grid;grid-template-columns:minmax(0,165px) minmax(0,1fr);gap:16px;align-items:center;width:100%;text-align:left;padding:14px 18px;border-radius:8px;cursor:pointer;transition:background 140ms cubic-bezier(.22,.61,.36,1);border:1px solid {{ c.bd }};background:{{ c.bg }};color:#fff\">\n                <span style=\"font:600 12px/1.2 var(--font-sans);letter-spacing:0.08em;color:#7FE7FF\">{{ c.n }}<\u002Fspan>\n                <span style=\"display:flex;align-items:center;gap:8px;flex-wrap:wrap\">\n                  <sc-for list=\"{{ c.steps }}\" as=\"st\" hint-placeholder-count=\"4\">\n                    <span style=\"display:flex;align-items:center;gap:8px\">\n                      <span style=\"padding:8px 12px;border-radius:8px;font:400 13px/1.3 var(--font-sans);transition:background 140ms cubic-bezier(.22,.61,.36,1);border:1px solid {{ st.bd }};background:{{ st.bg }};color:{{ st.fg }}\">{{ st.t }}<\u002Fspan>\n                      <sc-if value=\"{{ st.notLast }}\" hint-placeholder-val=\"{{ true }}\">\n                        <span style=\"font:400 12px/1 var(--font-sans);color:rgba(127,231,255,0.5)\">→<\u002Fspan>\n                      <\u002Fsc-if>\n                    <\u002Fspan>\n                  <\u002Fsc-for>\n                <\u002Fspan>\n              <\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start\">\n            <div style=\"padding:18px 20px;border-radius:8px;background:rgba(255,255,255,0.04);border-left:2px solid #7FE7FF\">\n              <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.42);margin-bottom:8px\">Механика контура · {{ contourName }}<\u002Fdiv>\n              <div style=\"font:400 15px/1.5 var(--font-sans);color:rgba(255,255,255,0.80)\">{{ contourMech }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"padding:20px 22px;border-radius:8px;border:1px solid rgba(127,231,255,0.28);background:rgba(1,43,158,0.28)\">\n              <div style=\"font:500 clamp(16px,1.5vw,21px)/1.3 var(--font-sans);letter-spacing:-0.02em;color:#fff\">Смешать контуры — получить кашу. Разделить — получить систему.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"margin-top:16px;display:flex;flex-direction:column;gap:12px;align-items:flex-start\">\n            <button type=\"button\" sc-camel-on-click=\"{{ ex14 }}\" style=\"padding:9px 16px;border-radius:100px;cursor:pointer;font:600 12px/1 var(--font-sans);transition:background 140ms cubic-bezier(.22,.61,.36,1);border:1px solid {{ ex14bd }};background:{{ ex14bg }};color:#7FE7FF\">{{ ex14label }}<\u002Fbutton>\n            <sc-if value=\"{{ ex14open }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"width:100%;padding:18px 20px;border-radius:8px;border:1px solid rgba(127,231,255,0.30);border-left:3px solid #7FE7FF;background:rgba(127,231,255,0.06)\">\n                <div style=\"font:600 10px/1 var(--font-sans);letter-spacing:0.10em;text-transform:uppercase;color:#7FE7FF;margin-bottom:10px\">Пример · как у автора<\u002Fdiv>\n                <div style=\"font:400 14px/1.55 var(--font-sans);color:rgba(255,255,255,0.80)\">Мой корпус трёхслойный: курированный vault, текущее сырьё, архив с 2018 года — поиск ранжирует слои по-разному.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ deep }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top:16px;padding:22px 24px;border-radius:8px;border:1px solid rgba(127,231,255,0.22);background:linear-gradient(180deg, rgba(1,43,158,0.30) 0%, rgba(15,23,36,0.6) 100%)\">\n              <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:#7FE7FF;margin-bottom:12px\">Подробно · {{ contourName }} контур в деталях<\u002Fdiv>\n              <div style=\"font:400 14px/1.55 var(--font-sans);color:rgba(255,255,255,0.70)\">{{ contourDeep }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- 15 · Память и поиск -->\n      <section data-screen-label=\"15 Память и поиск\" style=\"flex:0 0 100%;height:100%;overflow-y:auto;overflow-x:hidden\">\n        <div style=\"max-width:1240px;margin:0 auto;padding:clamp(24px,3.2vh,44px) clamp(26px,4vw,64px) 72px\">\n          <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:#7FE7FF;margin-bottom:14px\">Акт III · глава 15<\u002Fdiv>\n          <h2 style=\"margin:0 0 8px;font:500 clamp(28px,3.4vw,48px)/1.07 var(--font-sans);letter-spacing:-0.03em;color:#fff\">Путь знания<\u002Fh2>\n          <p style=\"margin:0 0 18px;font:400 clamp(14px,1.1vw,16px)/1.5 var(--font-sans);color:rgba(255,255,255,0.45)\">Спроси память — заметки в примере синтетические.<\u002Fp>\n\n          <div style=\"display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:10px\">\n            <sc-for list=\"{{ knowpath }}\" as=\"k\" hint-placeholder-count=\"5\">\n              <div style=\"padding:15px 16px;border-radius:8px;border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.03)\">\n                <div style=\"font:600 13px/1.2 var(--font-sans);color:#fff;margin-bottom:8px\">{{ k.n }}<\u002Fdiv>\n                <div style=\"font:400 12px/1.4 var(--font-sans);color:rgba(255,255,255,0.55)\">{{ k.t }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:16px;padding:10px 16px;border-radius:8px;background:rgba(255,255,255,0.03);border:1px dashed rgba(127,231,255,0.25)\">\n            <span style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;color:#7FE7FF;white-space:nowrap\">ответвление<\u002Fspan>\n            <span style=\"font:400 13px/1.4 var(--font-sans);color:rgba(255,255,255,0.62)\">хабы сущностей — люди, проекты, темы — держат связи между заметками, поэтому ответ собирается из нескольких мест сразу<\u002Fspan>\n          <\u002Fdiv>\n\n          <div style=\"display:grid;grid-template-columns:minmax(0,0.85fr) minmax(0,1.15fr);gap:16px;align-items:start\">\n            <div style=\"padding:18px 20px;border-radius:8px;border:1px solid rgba(255,255,255,0.12);background:#0F1724\">\n              <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:#7FE7FF;margin-bottom:12px\">Спроси память<\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:8px\">\n                <sc-for list=\"{{ queries }}\" as=\"q\" hint-placeholder-count=\"3\">\n                  <button type=\"button\" sc-camel-on-click=\"{{ q.onClick }}\" style=\"width:100%;text-align:left;padding:12px 14px;border-radius:8px;cursor:pointer;transition:background 140ms cubic-bezier(.22,.61,.36,1);border:1px solid {{ q.bd }};background:{{ q.bg }};color:#fff;font:400 14px/1.4 var(--font-sans)\">«{{ q.q }}»<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"padding:18px 20px;border-radius:8px;border:1px solid rgba(127,231,255,0.28);background:rgba(1,43,158,0.22)\">\n              <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:#7FE7FF;margin-bottom:12px\">Что нашлось<\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:7px;margin-bottom:12px\">\n                <sc-for list=\"{{ found }}\" as=\"f\" hint-placeholder-count=\"3\">\n                  <div style=\"padding:10px 12px;border-radius:8px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.10);font:400 13px/1.4 var(--font-sans);color:rgba(255,255,255,0.82)\">{{ f }}<\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"padding-top:12px;border-top:1px solid rgba(255,255,255,0.12);font:400 13px/1.5 var(--font-sans);color:rgba(255,255,255,0.66)\"><span style=\"color:#7FE7FF;font-weight:600\">Почему. <\u002Fspan>{{ foundWhy }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"margin-top:16px;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start\">\n            <div style=\"padding:20px 22px;border-radius:8px;border:1px solid rgba(127,231,255,0.28);background:rgba(1,43,158,0.28)\">\n              <div style=\"font:500 clamp(16px,1.5vw,21px)/1.3 var(--font-sans);letter-spacing:-0.02em;color:#fff\">Память — это не свалка файлов. Это файлы + связи + поиск по смыслу.<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:12px;align-items:flex-start\">\n              <button type=\"button\" sc-camel-on-click=\"{{ ex15 }}\" style=\"padding:9px 16px;border-radius:100px;cursor:pointer;font:600 12px/1 var(--font-sans);transition:background 140ms cubic-bezier(.22,.61,.36,1);border:1px solid {{ ex15bd }};background:{{ ex15bg }};color:#7FE7FF\">{{ ex15label }}<\u002Fbutton>\n              <sc-if value=\"{{ ex15open }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"width:100%;padding:18px 20px;border-radius:8px;border:1px solid rgba(127,231,255,0.30);border-left:3px solid #7FE7FF;background:rgba(127,231,255,0.06)\">\n                  <div style=\"font:600 10px/1 var(--font-sans);letter-spacing:0.10em;text-transform:uppercase;color:#7FE7FF;margin-bottom:10px\">Пример · как у автора<\u002Fdiv>\n                  <div style=\"font:400 14px/1.55 var(--font-sans);color:rgba(255,255,255,0.80)\">У меня: BGE-M3 (~2 ГБ, локально) + LanceDB; повторная индексация неизменённого корпуса — 0,2 с вместо ~19 мин; 12,9 тыс. заметок.<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ deep }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top:16px;padding:22px 24px;border-radius:8px;border:1px solid rgba(127,231,255,0.22);background:linear-gradient(180deg, rgba(1,43,158,0.30) 0%, rgba(15,23,36,0.6) 100%)\">\n              <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:#7FE7FF;margin-bottom:12px\">Подробно · механика поиска<\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;font:400 14px/1.55 var(--font-sans);color:rgba(255,255,255,0.68)\">\n                <div><b style=\"color:#fff;font-weight:600\">Гибридный поиск.<\u002Fb> Семантический по эмбеддингам и лексический по словам работают параллельно, результаты сливаются в один ранжированный список.<\u002Fdiv>\n                <div><b style=\"color:#fff;font-weight:600\">Локальные эмбеддинги.<\u002Fb> Модель, превращающая текст в векторы, работает на твоей машине — смысл заметок не уезжает в облако даже ради поиска.<\u002Fdiv>\n                <div><b style=\"color:#fff;font-weight:600\">Инкрементальная индексация.<\u002Fb> Пересчитывается только изменившееся; неизменённый корпус проходится за доли секунды.<\u002Fdiv>\n                <div><b style=\"color:#fff;font-weight:600\">Дедупликация по содержимому.<\u002Fb> Один и тот же файл, пришедший из двух источников, не удваивается в памяти.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- 16 · Факты и генерация -->\n      <section data-screen-label=\"16 Конвейер документа\" style=\"flex:0 0 100%;height:100%;overflow-y:auto;overflow-x:hidden\">\n        <div style=\"max-width:1240px;margin:0 auto;padding:clamp(24px,3.2vh,44px) clamp(26px,4vw,64px) 72px\">\n          <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:#7FE7FF;margin-bottom:14px\">Акт III · глава 16<\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:18px\">\n            <div>\n              <h2 style=\"margin:0 0 8px;font:500 clamp(28px,3.4vw,48px)/1.07 var(--font-sans);letter-spacing:-0.03em;color:#fff\">Конвейер документа<\u002Fh2>\n              <p style=\"margin:0;font:400 clamp(14px,1.1vw,16px)/1.5 var(--font-sans);color:rgba(255,255,255,0.45)\">Переключи состояние фактов — и посмотри, доезжает ли конвейер.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:6px;padding:4px;border-radius:100px;border:1px solid rgba(255,255,255,0.14);background:rgba(255,255,255,0.03)\">\n              <button type=\"button\" sc-camel-on-click=\"{{ gateOn }}\" style=\"padding:9px 16px;border:0;border-radius:100px;cursor:pointer;font:600 12px/1 var(--font-sans);transition:background 140ms cubic-bezier(.22,.61,.36,1);background:{{ gateBgOn }};color:{{ gateFgOn }}\">факты есть<\u002Fbutton>\n              <button type=\"button\" sc-camel-on-click=\"{{ gateOff }}\" style=\"padding:9px 16px;border:0;border-radius:100px;cursor:pointer;font:600 12px/1 var(--font-sans);transition:background 140ms cubic-bezier(.22,.61,.36,1);background:{{ gateBgOff }};color:{{ gateFgOff }}\">факта не хватает<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin-bottom:16px\">\n            <sc-for list=\"{{ pipe }}\" as=\"p\" hint-placeholder-count=\"7\">\n              <div style=\"padding:15px 13px;border-radius:8px;min-height:104px;display:flex;flex-direction:column;gap:8px;transition:background 140ms cubic-bezier(.22,.61,.36,1);border:1px solid {{ p.bd }};background:{{ p.bg }}\">\n                <span style=\"font:600 12px/1.2 var(--font-sans);color:{{ p.fg }}\">{{ p.n }}<\u002Fspan>\n                <span style=\"font:400 12px/1.4 var(--font-sans);color:{{ p.sub }}\">{{ p.t }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start\">\n            <div style=\"padding:18px 20px;border-radius:8px;background:rgba(255,255,255,0.04);border-left:2px solid {{ gateRule }}\">\n              <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.42);margin-bottom:8px\">{{ gateTitle }}<\u002Fdiv>\n              <div style=\"font:400 15px/1.5 var(--font-sans);color:rgba(255,255,255,0.80)\">{{ gateText }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"padding:20px 22px;border-radius:8px;border:1px solid rgba(127,231,255,0.28);background:rgba(1,43,158,0.28)\">\n              <div style=\"font:500 clamp(16px,1.5vw,21px)/1.3 var(--font-sans);letter-spacing:-0.02em;color:#fff\">Модель пишет текст. Всё остальное — детерминированный конвейер.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"margin-top:16px;display:flex;flex-direction:column;gap:12px;align-items:flex-start\">\n            <button type=\"button\" sc-camel-on-click=\"{{ ex16 }}\" style=\"padding:9px 16px;border-radius:100px;cursor:pointer;font:600 12px/1 var(--font-sans);transition:background 140ms cubic-bezier(.22,.61,.36,1);border:1px solid {{ ex16bd }};background:{{ ex16bg }};color:#7FE7FF\">{{ ex16label }}<\u002Fbutton>\n            <sc-if value=\"{{ ex16open }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"width:100%;padding:18px 20px;border-radius:8px;border:1px solid rgba(127,231,255,0.30);border-left:3px solid #7FE7FF;background:rgba(127,231,255,0.06)\">\n                <div style=\"font:600 10px/1 var(--font-sans);letter-spacing:0.10em;text-transform:uppercase;color:#7FE7FF;margin-bottom:10px\">Пример · как у автора<\u002Fdiv>\n                <div style=\"font:400 14px/1.55 var(--font-sans);color:rgba(255,255,255,0.80)\">Этот конвейер у меня закрыл структурный фейл: сложное КП, где раньше терялись и путались цифры, теперь собирается одной командой — 1 бэкенд-вызов вместо ~15 итераций чата.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ deep }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top:16px;padding:22px 24px;border-radius:8px;border:1px solid rgba(127,231,255,0.22);background:linear-gradient(180deg, rgba(1,43,158,0.30) 0%, rgba(15,23,36,0.6) 100%)\">\n              <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:#7FE7FF;margin-bottom:12px\">Подробно · механизмы конвейера<\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:18px;font:400 13px/1.5 var(--font-sans);color:rgba(255,255,255,0.68)\">\n                <div><b style=\"color:#fff;font-weight:600\">Типизированные факты.<\u002Fb> Деньги, даты, реквизиты — не строки, а значения своего типа, с локатором до ячейки.<\u002Fdiv>\n                <div><b style=\"color:#fff;font-weight:600\">Образец-как-шаблон.<\u002Fb> Роль шаблона играет твой реальный документ, а не абстрактная болванка: структура снимается с него.<\u002Fdiv>\n                <div><b style=\"color:#fff;font-weight:600\">Grounding-гейт.<\u002Fb> Блокировка с перечнем недостающего вместо заглушки; пройти гейт «примерно» нельзя.<\u002Fdiv>\n                <div><b style=\"color:#fff;font-weight:600\">Провенанс.<\u002Fb> Каждый фрагмент несёт источник, поэтому готовый документ можно проверить по частям.<\u002Fdiv>\n                <div><b style=\"color:#fff;font-weight:600\">Асинхронные задания.<\u002Fb> Долгая сборка уходит в фон с прогрессом и чекпойнтами — диалог остаётся свободным.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- 17 · Оркестрация и автономия -->\n      <section data-screen-label=\"17 Оркестрация и автономия\" style=\"flex:0 0 100%;height:100%;overflow-y:auto;overflow-x:hidden\">\n        <div style=\"max-width:1240px;margin:0 auto;padding:clamp(24px,3.2vh,44px) clamp(26px,4vw,64px) 72px\">\n          <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:#7FE7FF;margin-bottom:14px\">Акт III · глава 17<\u002Fdiv>\n          <h2 style=\"margin:0 0 8px;font:500 clamp(28px,3.4vw,48px)/1.07 var(--font-sans);letter-spacing:-0.03em;color:#fff\">Само и по расписанию<\u002Fh2>\n          <p style=\"margin:0 0 20px;font:400 clamp(14px,1.1vw,16px)/1.5 var(--font-sans);color:rgba(255,255,255,0.45)\">Наведи на отметку расписания — что именно происходит в этот момент.<\u002Fp>\n\n          <div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:16px;align-items:start\">\n            <div style=\"display:flex;flex-direction:column;gap:10px\">\n              <div style=\"padding:18px 20px;border-radius:8px;border:1px solid rgba(255,255,255,0.12);background:#0F1724\">\n                <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:#7FE7FF;margin-bottom:12px\">Оркестрация<\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:8px\">\n                  <div style=\"padding:11px 13px;border-radius:8px;background:rgba(255,255,255,0.04);font:400 13px/1.4 var(--font-sans);color:rgba(255,255,255,0.78)\">план задачи<\u002Fdiv>\n                  <div style=\"padding:11px 13px;border-radius:8px;background:rgba(255,255,255,0.04);font:400 13px/1.4 var(--font-sans);color:rgba(255,255,255,0.78)\">шаги по плану<\u002Fdiv>\n                  <div style=\"padding:11px 13px;border-radius:8px;background:rgba(255,255,255,0.04);font:400 13px/1.4 var(--font-sans);color:rgba(255,255,255,0.78)\">длинное уходит в фон с прогрессом<\u002Fdiv>\n                  <div style=\"padding:11px 13px;border-radius:8px;background:rgba(0,106,251,0.16);border:1px solid rgba(127,231,255,0.35);font:400 13px/1.4 var(--font-sans);color:#fff\">результат<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"padding:18px 20px;border-radius:8px;border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.02)\">\n              <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:#7FE7FF;margin-bottom:14px\">Автономия · лента суток<\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:9px\">\n                <sc-for list=\"{{ auton }}\" as=\"a\" hint-placeholder-count=\"4\">\n                  <button type=\"button\" sc-camel-on-mouse-enter=\"{{ a.onEnter }}\" sc-camel-on-click=\"{{ a.onEnter }}\" style=\"display:grid;grid-template-columns:16px minmax(0,150px) minmax(0,1fr);gap:12px;align-items:center;width:100%;text-align:left;padding:12px 14px;border-radius:8px;cursor:default;transition:background 140ms cubic-bezier(.22,.61,.36,1);border:1px solid {{ a.bd }};background:{{ a.bg }};color:#fff\">\n                    <span style=\"width:9px;height:9px;border-radius:100px;background:{{ a.dot }}\"><\u002Fspan>\n                    <span style=\"font:600 13px/1.2 var(--font-sans);color:#fff\">{{ a.n }}<\u002Fspan>\n                    <span style=\"font:400 12px/1.35 var(--font-sans);color:rgba(255,255,255,0.55)\">{{ a.when }}<\u002Fspan>\n                  <\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"margin-top:12px;padding:13px 15px;border-radius:8px;background:rgba(255,255,255,0.04);border-left:2px solid #7FE7FF\">\n                <div style=\"font:600 10px/1 var(--font-sans);letter-spacing:0.10em;text-transform:uppercase;color:rgba(255,255,255,0.42);margin-bottom:8px\">{{ autonName }} · {{ autonWhen }}<\u002Fdiv>\n                <div style=\"font:400 14px/1.5 var(--font-sans);color:rgba(255,255,255,0.78)\">{{ autonText }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"margin-top:16px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start\">\n            <div style=\"padding:20px 22px;border-radius:8px;border:1px solid rgba(127,231,255,0.28);background:rgba(1,43,158,0.28)\">\n              <div style=\"font:500 clamp(16px,1.5vw,21px)/1.3 var(--font-sans);letter-spacing:-0.02em;color:#fff\">Двойник работает, когда ты спишь. Но записывает — только когда ты сказал «да».<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:12px;align-items:flex-start\">\n              <button type=\"button\" sc-camel-on-click=\"{{ ex17 }}\" style=\"padding:9px 16px;border-radius:100px;cursor:pointer;font:600 12px/1 var(--font-sans);transition:background 140ms cubic-bezier(.22,.61,.36,1);border:1px solid {{ ex17bd }};background:{{ ex17bg }};color:#7FE7FF\">{{ ex17label }}<\u002Fbutton>\n              <sc-if value=\"{{ ex17open }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"width:100%;padding:18px 20px;border-radius:8px;border:1px solid rgba(127,231,255,0.30);border-left:3px solid #7FE7FF;background:rgba(127,231,255,0.06)\">\n                  <div style=\"font:600 10px/1 var(--font-sans);letter-spacing:0.10em;text-transform:uppercase;color:#7FE7FF;margin-bottom:10px\">Пример · как у автора<\u002Fdiv>\n                  <div style=\"font:400 14px/1.55 var(--font-sans);color:rgba(255,255,255,0.80)\">Мои 4 фоновых задания: быстрая синхронизация каждые 30 мин, индексация в 03:00, календарь каждые 3 ч, веб-пульт постоянно.<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ deep }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top:16px;padding:22px 24px;border-radius:8px;border:1px solid rgba(127,231,255,0.22);background:linear-gradient(180deg, rgba(1,43,158,0.30) 0%, rgba(15,23,36,0.6) 100%)\">\n              <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:#7FE7FF;margin-bottom:12px\">Подробно · механика фона<\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;font:400 14px/1.55 var(--font-sans);color:rgba(255,255,255,0.68)\">\n                <div><b style=\"color:#fff;font-weight:600\">План как граф шагов.<\u002Fb> Задача раскладывается детерминированно: что за чем и что от чего зависит; модель на состав плана не влияет.<\u002Fdiv>\n                <div><b style=\"color:#fff;font-weight:600\">Чекпойнты.<\u002Fb> Фоновое задание сохраняет промежуточное состояние: после сбоя оно продолжается, а не начинается заново.<\u002Fdiv>\n                <div><b style=\"color:#fff;font-weight:600\">Системный планировщик.<\u002Fb> Расписание держит операционная система, а не постоянно висящий процесс.<\u002Fdiv>\n                <div><b style=\"color:#fff;font-weight:600\">Автономия чтения ≠ автономия записи.<\u002Fb> Читать, разбирать и связывать двойник может сам; писать наружу — по-прежнему только через подтверждение.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- 18 · Безопасность и приватность -->\n      <section data-screen-label=\"18 Безопасность и приватность\" style=\"flex:0 0 100%;height:100%;overflow-y:auto;overflow-x:hidden\">\n        <div style=\"max-width:1240px;margin:0 auto;padding:clamp(24px,3.2vh,44px) clamp(26px,4vw,64px) 72px\">\n          <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:#7FE7FF;margin-bottom:14px\">Акт III · глава 18<\u002Fdiv>\n          <h2 style=\"margin:0 0 8px;font:500 clamp(28px,3.4vw,48px)/1.07 var(--font-sans);letter-spacing:-0.03em;color:#fff\">Что покидает компьютер — а что никогда<\u002Fh2>\n          <p style=\"margin:0 0 20px;font:400 clamp(14px,1.1vw,16px)/1.5 var(--font-sans);color:rgba(255,255,255,0.45)\">Наведи на элемент — почему он не может уехать. Клик по стрелке — из чего состоит запрос.<\u002Fp>\n\n          <div style=\"display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,0.9fr) minmax(0,0.7fr);gap:0;align-items:center;margin-bottom:16px\">\n            <div style=\"padding:22px;border-radius:8px;border:1px solid rgba(127,231,255,0.30);background:rgba(1,43,158,0.22)\">\n              <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;color:#7FE7FF;margin-bottom:14px\">ОСТАЁТСЯ ЛОКАЛЬНО<\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px\">\n                <sc-for list=\"{{ seclocal }}\" as=\"x\" hint-placeholder-count=\"6\">\n                  <button type=\"button\" sc-camel-on-mouse-enter=\"{{ x.onEnter }}\" sc-camel-on-click=\"{{ x.onEnter }}\" style=\"padding:12px 13px;border-radius:8px;text-align:left;cursor:default;transition:background 140ms cubic-bezier(.22,.61,.36,1);border:1px solid {{ x.bd }};background:{{ x.bg }};color:#fff;font:500 13px/1.3 var(--font-sans)\">{{ x.n }}<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <button type=\"button\" sc-camel-on-click=\"{{ secArrowClick }}\" style=\"display:flex;flex-direction:column;align-items:center;gap:8px;border:0;background:transparent;cursor:pointer;padding:0 12px\">\n              <span style=\"font:400 11px/1.3 var(--font-sans);text-align:center;color:rgba(255,255,255,0.55)\">вопрос + подобранный контекст<\u002Fspan>\n              <span style=\"width:100%;height:2px;border-radius:100px;transition:background 140ms cubic-bezier(.22,.61,.36,1);background:{{ secArrowBd }}\"><\u002Fspan>\n              <span style=\"font:400 11px/1.3 var(--font-sans);text-align:center;color:rgba(255,255,255,0.55)\">← возвращается текст<\u002Fspan>\n            <\u002Fbutton>\n\n            <div style=\"padding:22px;border-radius:8px;border:1px dashed rgba(255,255,255,0.20);background:rgba(255,255,255,0.02)\">\n              <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;color:rgba(255,255,255,0.45);margin-bottom:14px\">УХОДИТ В ОБЛАКО<\u002Fdiv>\n              <div style=\"font:400 14px/1.5 var(--font-sans);color:rgba(255,255,255,0.70)\">текущий вопрос + подобранный под него контекст → возвращается текст<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start\">\n            <div style=\"padding:18px 20px;border-radius:8px;background:rgba(255,255,255,0.04);border-left:2px solid #7FE7FF\">\n              <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.42);margin-bottom:8px\">{{ secTitle }}<\u002Fdiv>\n              <div style=\"font:400 15px/1.5 var(--font-sans);color:rgba(255,255,255,0.80)\">{{ secText }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"padding:20px 22px;border-radius:8px;border:1px solid rgba(127,231,255,0.28);background:rgba(1,43,158,0.28)\">\n              <div style=\"font:500 clamp(16px,1.5vw,21px)/1.3 var(--font-sans);letter-spacing:-0.02em;color:#fff\">Приватное помечено — значит не существует ни для поиска, ни для генерации. На любом уровне.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"margin-top:16px;display:flex;flex-direction:column;gap:12px;align-items:flex-start\">\n            <button type=\"button\" sc-camel-on-click=\"{{ ex18 }}\" style=\"padding:9px 16px;border-radius:100px;cursor:pointer;font:600 12px/1 var(--font-sans);transition:background 140ms cubic-bezier(.22,.61,.36,1);border:1px solid {{ ex18bd }};background:{{ ex18bg }};color:#7FE7FF\">{{ ex18label }}<\u002Fbutton>\n            <sc-if value=\"{{ ex18open }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"width:100%;padding:18px 20px;border-radius:8px;border:1px solid rgba(127,231,255,0.30);border-left:3px solid #7FE7FF;background:rgba(127,231,255,0.06)\">\n                <div style=\"font:600 10px/1 var(--font-sans);letter-spacing:0.10em;text-transform:uppercase;color:#7FE7FF;margin-bottom:10px\">Пример · как у автора<\u002Fdiv>\n                <div style=\"font:400 14px/1.55 var(--font-sans);color:rgba(255,255,255,0.80)\">У меня NDA-барьер вшит на всех уровнях, каждый пишущий инструмент обязан оставить ровно одну строку аудита — это охраняется тестом. Всего в системе 1881 автотест.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ deep }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top:16px;padding:22px 24px;border-radius:8px;border:1px solid rgba(127,231,255,0.22);background:linear-gradient(180deg, rgba(1,43,158,0.30) 0%, rgba(15,23,36,0.6) 100%)\">\n              <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:#7FE7FF;margin-bottom:12px\">Подробно · механизмы приватности<\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;font:400 14px/1.55 var(--font-sans);color:rgba(255,255,255,0.68)\">\n                <div><b style=\"color:#fff;font-weight:600\">Единый предикат.<\u002Fb> Одна и та же проверка приватности стоит на захвате, в индексе, в фактах и в сборке контекста — обойти её на одном из уровней нельзя.<\u002Fdiv>\n                <div><b style=\"color:#fff;font-weight:600\">Аудит-лог.<\u002Fb> Каждая запись во внешнюю систему оставляет строку: что, куда и когда. Содержимое в лог не пишется.<\u002Fdiv>\n                <div><b style=\"color:#fff;font-weight:600\">Секреты — в системном хранилище.<\u002Fb> Ключи и токены живут в хранилище операционной системы, а не в файлах рядом с базой.<\u002Fdiv>\n                <div><b style=\"color:#fff;font-weight:600\">Резервные копии производного.<\u002Fb> Перед рискованными операциями индексы и зеркала копируются, чтобы откат был дешевле пересборки.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- 19 · Разделитель Акт IV -->\n      <section data-screen-label=\"19 Разделитель — Акт IV\" style=\"flex:0 0 100%;height:100%;overflow-y:auto;overflow-x:hidden\">\n        <div style=\"max-width:1240px;margin:0 auto;padding:clamp(26px,4vw,64px);min-height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,0.8fr);gap:clamp(24px,4vw,56px);align-items:center\">\n          <div>\n            <div style=\"font:600 clamp(12px,1.3vw,15px)/1 var(--font-sans);letter-spacing:0.14em;color:#7FE7FF;margin-bottom:22px\">АКТ IV · ТВОЙ ДВОЙНИК<\u002Fdiv>\n            <h2 style=\"margin:0;font:500 clamp(30px,4vw,56px)/1.04 var(--font-sans);letter-spacing:-0.04em;color:#fff\">Геном собран. Осталась экспрессия<\u002Fh2>\n            <p style=\"margin:22px 0 0;max-width:460px;font:400 clamp(14px,1.15vw,17px)/1.5 var(--font-sans);color:rgba(255,255,255,0.45)\">Все пять генов горят. Дальше — как из одного генома получается именно твой двойник.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"height:min(46vh,420px)\">\n            <canvas ref=\"{{ actRef }}\" style=\"width:100%;height:100%;display:block\"><\u002Fcanvas>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- 20 · Геном → экспрессия → фенотип -->\n      <section data-screen-label=\"20 Геном, экспрессия, фенотип\" style=\"flex:0 0 100%;height:100%;overflow-y:auto;overflow-x:hidden\">\n        <div style=\"max-width:1240px;margin:0 auto;padding:clamp(24px,3.2vh,44px) clamp(26px,4vw,64px) 72px\">\n          <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:#7FE7FF;margin-bottom:14px\">Акт IV · глава 20 · замковая<\u002Fdiv>\n          <h2 style=\"margin:0 0 8px;font:500 clamp(28px,3.4vw,48px)/1.07 var(--font-sans);letter-spacing:-0.03em;color:#fff\">Один геном — разные двойники<\u002Fh2>\n          <p style=\"margin:0 0 20px;font:400 clamp(14px,1.1vw,16px)/1.5 var(--font-sans);color:rgba(255,255,255,0.45)\">Переключи условия среды — и посмотри, во что разворачивается та же самая ДНК.<\u002Fp>\n\n          <div style=\"display:grid;grid-template-columns:minmax(0,0.85fr) minmax(0,1fr) minmax(0,1.15fr);gap:14px;align-items:stretch\">\n            <div style=\"padding:20px;border-radius:8px;border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.03);display:flex;flex-direction:column\">\n              <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.45);margin-bottom:14px\">Геном · общий<\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:8px;margin-bottom:14px\">\n                <div style=\"padding:10px 12px;border-radius:8px;background:rgba(255,255,255,0.04);font:400 13px/1.4 var(--font-sans);color:rgba(255,255,255,0.74)\">движок<\u002Fdiv>\n                <div style=\"padding:10px 12px;border-radius:8px;background:rgba(255,255,255,0.04);font:400 13px/1.4 var(--font-sans);color:rgba(255,255,255,0.74)\">слои<\u002Fdiv>\n                <div style=\"padding:10px 12px;border-radius:8px;background:rgba(255,255,255,0.04);font:400 13px/1.4 var(--font-sans);color:rgba(255,255,255,0.74)\">кейсы-шаблоны<\u002Fdiv>\n                <div style=\"padding:10px 12px;border-radius:8px;background:rgba(255,255,255,0.04);font:400 13px/1.4 var(--font-sans);color:rgba(255,255,255,0.74)\">правила<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"flex:1 1 auto;min-height:120px\">\n                <canvas ref=\"{{ genomeBigRef }}\" style=\"width:100%;height:100%;display:block\"><\u002Fcanvas>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"padding:20px;border-radius:8px;border:1px solid rgba(127,231,255,0.30);background:linear-gradient(180deg, rgba(1,43,158,0.42) 0%, rgba(15,23,36,0.65) 100%)\">\n              <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:#7FE7FF;margin-bottom:14px\">Экспрессия · диалог<\u002Fdiv>\n              <div style=\"font:400 14px/1.5 var(--font-sans);color:rgba(255,255,255,0.76);margin-bottom:16px\">Инсталлер спрашивает: кто ты, что пишешь, какие задачи, какие инструменты — и разворачивает ДНК под тебя.<\u002Fdiv>\n              <div style=\"font:600 10px/1 var(--font-sans);letter-spacing:0.10em;text-transform:uppercase;color:rgba(255,255,255,0.45);margin-bottom:10px\">Условия среды<\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:8px\">\n                <sc-for list=\"{{ profiles }}\" as=\"p\" hint-placeholder-count=\"3\">\n                  <button type=\"button\" sc-camel-on-click=\"{{ p.onClick }}\" style=\"width:100%;text-align:left;padding:11px 16px;border-radius:100px;cursor:pointer;transition:background 140ms cubic-bezier(.22,.61,.36,1);border:1px solid {{ p.bd }};background:{{ p.bg }};color:{{ p.fg }};font:600 13px/1 var(--font-sans)\">{{ p.n }}<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"margin-top:16px;padding:13px 15px;border-radius:8px;background:rgba(255,255,255,0.05);font:400 13px/1.5 var(--font-sans);color:rgba(255,255,255,0.70)\">{{ profileQ }}<\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"padding:20px;border-radius:8px;border:1px solid rgba(255,255,255,0.12);background:#0F1724\">\n              <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:#7FE7FF;margin-bottom:14px\">Фенотип · твой<\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:12px\">\n                <sc-for list=\"{{ phenotype }}\" as=\"r\" hint-placeholder-count=\"4\">\n                  <div>\n                    <div style=\"font:600 11px/1.2 var(--font-sans);letter-spacing:0.04em;color:rgba(255,255,255,0.45);margin-bottom:6px\">{{ r.k }}<\u002Fdiv>\n                    <div style=\"font:400 clamp(13px,1.1vw,15px)/1.45 var(--font-sans);color:#fff\">{{ r.v }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"margin-top:16px;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start\">\n            <div style=\"padding:20px 22px;border-radius:8px;border:1px solid rgba(127,231,255,0.28);background:rgba(1,43,158,0.28)\">\n              <div style=\"font:500 clamp(16px,1.5vw,21px)/1.3 var(--font-sans);letter-spacing:-0.02em;color:#fff\">Ты не настраиваешь программу. Ты отвечаешь на вопросы — двойник собирает себя сам.<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:12px;align-items:flex-start\">\n              <button type=\"button\" sc-camel-on-click=\"{{ ex20 }}\" style=\"padding:9px 16px;border-radius:100px;cursor:pointer;font:600 12px/1 var(--font-sans);transition:background 140ms cubic-bezier(.22,.61,.36,1);border:1px solid {{ ex20bd }};background:{{ ex20bg }};color:#7FE7FF\">{{ ex20label }}<\u002Fbutton>\n              <sc-if value=\"{{ ex20open }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"width:100%;padding:18px 20px;border-radius:8px;border:1px solid rgba(127,231,255,0.30);border-left:3px solid #7FE7FF;background:rgba(127,231,255,0.06)\">\n                  <div style=\"font:600 10px/1 var(--font-sans);letter-spacing:0.10em;text-transform:uppercase;color:#7FE7FF;margin-bottom:10px\">Пример · как у автора<\u002Fdiv>\n                  <div style=\"font:400 14px/1.55 var(--font-sans);color:rgba(255,255,255,0.80)\">Мой двойник — первый фенотип этой ДНК. Твой будет другим: другой стиль, другие знания, другие руки.<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ deep }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top:16px;padding:22px 24px;border-radius:8px;border:1px solid rgba(127,231,255,0.22);background:linear-gradient(180deg, rgba(1,43,158,0.30) 0%, rgba(15,23,36,0.6) 100%)\">\n              <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:#7FE7FF;margin-bottom:12px\">Подробно · как устроен инсталлер<\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;font:400 14px/1.55 var(--font-sans);color:rgba(255,255,255,0.68)\">\n                <div><b style=\"color:#fff;font-weight:600\">Рельсовый диалог по фазам.<\u002Fb> Профиль → техсетап → методология → приём стиль-корпуса → интеграции → первый прогон. Порядок фиксирован: каждая фаза опирается на результат предыдущей.<\u002Fdiv>\n                <div><b style=\"color:#fff;font-weight:600\">Живой план и прогресс.<\u002Fb> Установка ведёт собственный журнал: видно, что сделано и что осталось. Можно прерваться и продолжить с места остановки.<\u002Fdiv>\n                <div><b style=\"color:#fff;font-weight:600\">Два профиля поставки.<\u002Fb> Базовый — память, стиль и факты. С рабочими коннекторами — плюс «руки» к CRM, задачнику и почте.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- 21 · Геном растёт -->\n      <section data-screen-label=\"21 Геном растёт\" style=\"flex:0 0 100%;height:100%;overflow-y:auto;overflow-x:hidden\">\n        <div style=\"max-width:1240px;margin:0 auto;padding:clamp(24px,3.2vh,44px) clamp(26px,4vw,64px) 72px\">\n          <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:#7FE7FF;margin-bottom:14px\">Акт IV · глава 21<\u002Fdiv>\n          <h2 style=\"margin:0 0 10px;font:500 clamp(28px,3.4vw,48px)/1.07 var(--font-sans);letter-spacing:-0.03em;color:#fff\">ДНК эволюционирует<\u002Fh2>\n          <p style=\"margin:0 0 18px;max-width:900px;font:400 clamp(14px,1.2vw,17px)/1.5 var(--font-sans);color:rgba(255,255,255,0.72)\">Новые способности сначала проверяются в бою на живом двойнике. Прижилось — закрепляется в геноме. Закрепилось — наследуют все.<\u002Fp>\n\n          <div style=\"height:clamp(120px,17vh,170px);margin-bottom:14px;border-radius:8px;border:1px solid rgba(255,255,255,0.10);background:rgba(255,255,255,0.02)\">\n            <canvas ref=\"{{ growRef }}\" style=\"width:100%;height:100%;display:block\"><\u002Fcanvas>\n          <\u002Fdiv>\n\n          <div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px\">\n            <sc-for list=\"{{ horizons }}\" as=\"h\" hint-placeholder-count=\"3\">\n              <div style=\"padding:18px 20px;border-radius:8px;transition:border-color 140ms cubic-bezier(.22,.61,.36,1);border:1px solid {{ h.bd }};background:rgba(255,255,255,0.02)\">\n                <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;margin-bottom:14px;color:{{ h.fg }}\">{{ h.n }}<\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:8px\">\n                  <sc-for list=\"{{ h.items }}\" as=\"it\" hint-placeholder-count=\"2\">\n                    <div sc-camel-on-mouse-enter=\"{{ it.onEnter }}\" style=\"padding:12px 14px;border-radius:8px;transition:background 140ms cubic-bezier(.22,.61,.36,1);border:1px solid {{ it.bd }};background:{{ it.bg }};font:400 14px/1.45 var(--font-sans);color:rgba(255,255,255,0.78)\">{{ it.t }}<\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"margin-top:16px;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start\">\n            <div style=\"padding:20px 22px;border-radius:8px;border:1px solid rgba(127,231,255,0.28);background:rgba(1,43,158,0.28)\">\n              <div style=\"font:500 clamp(16px,1.5vw,21px)/1.3 var(--font-sans);letter-spacing:-0.02em;color:#fff\">Ставишь двойника сегодня — получаешь всё, что геном нарастит завтра.<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:12px;align-items:flex-start\">\n              <button type=\"button\" sc-camel-on-click=\"{{ ex21 }}\" style=\"padding:9px 16px;border-radius:100px;cursor:pointer;font:600 12px/1 var(--font-sans);transition:background 140ms cubic-bezier(.22,.61,.36,1);border:1px solid {{ ex21bd }};background:{{ ex21bg }};color:#7FE7FF\">{{ ex21label }}<\u002Fbutton>\n              <sc-if value=\"{{ ex21open }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"width:100%;padding:18px 20px;border-radius:8px;border:1px solid rgba(127,231,255,0.30);border-left:3px solid #7FE7FF;background:rgba(127,231,255,0.06)\">\n                  <div style=\"font:600 10px/1 var(--font-sans);letter-spacing:0.10em;text-transform:uppercase;color:#7FE7FF;margin-bottom:10px\">Пример · как у автора<\u002Fdiv>\n                  <div style=\"font:400 14px/1.55 var(--font-sans);color:rgba(255,255,255,0.80)\">Мой двойник пережил три релизные волны и один жёсткий продакшн-разбор — после него в геноме появились две новые плоскости (факты и оркестрация). Так выглядит эволюция: фейл → разбор → ген.<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ deep }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top:16px;padding:22px 24px;border-radius:8px;border:1px solid rgba(127,231,255,0.22);background:linear-gradient(180deg, rgba(1,43,158,0.30) 0%, rgba(15,23,36,0.6) 100%)\">\n              <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:#7FE7FF;margin-bottom:12px\">Подробно · эволюция без хаоса<\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;font:400 14px/1.55 var(--font-sans);color:rgba(255,255,255,0.68)\">\n                <div><b style=\"color:#fff;font-weight:600\">Релизные волны.<\u002Fb> Изменения идут волнами с тестами и возможностью отката, а не бесконечным потоком мелких правок.<\u002Fdiv>\n                <div><b style=\"color:#fff;font-weight:600\">Сначала на себе.<\u002Fb> Автор — первый испытатель каждой мутации: в геном попадает только то, что выжило в реальной работе.<\u002Fdiv>\n                <div><b style=\"color:#fff;font-weight:600\">Второй пользователь по правилам генома.<\u002Fb> Версии, журнал изменений и миграционные скрипты — это уже заложено, чтобы обновление не ломало чужого двойника.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- 22 · Установка изнутри -->\n      <section data-screen-label=\"22 Установка изнутри\" style=\"flex:0 0 100%;height:100%;overflow-y:auto;overflow-x:hidden\">\n        <div style=\"max-width:1240px;margin:0 auto;padding:clamp(24px,3.2vh,44px) clamp(26px,4vw,64px) 72px\">\n          <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:#7FE7FF;margin-bottom:14px\">Акт IV · глава 22<\u002Fdiv>\n          <h2 style=\"margin:0 0 8px;font:500 clamp(28px,3.4vw,48px)/1.07 var(--font-sans);letter-spacing:-0.03em;color:#fff\">Что происходит, пока ты отвечаешь на вопросы<\u002Fh2>\n          <p style=\"margin:0 0 20px;font:400 clamp(14px,1.1vw,16px)/1.5 var(--font-sans);color:rgba(255,255,255,0.45)\">Клик по фазе — что она спросит и что сделает сама.<\u002Fp>\n\n          <div style=\"display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-bottom:14px\">\n            <sc-for list=\"{{ phases }}\" as=\"p\" hint-placeholder-count=\"6\">\n              <button type=\"button\" sc-camel-on-click=\"{{ p.onClick }}\" style=\"text-align:left;padding:15px 13px;border-radius:8px;cursor:pointer;min-height:112px;transition:background 140ms cubic-bezier(.22,.61,.36,1);border:1px solid {{ p.bd }};background:{{ p.bg }};color:#fff\">\n                <div style=\"font:600 12px/1.2 var(--font-sans);color:#7FE7FF;margin-bottom:10px\">{{ p.n }}<\u002Fdiv>\n                <div style=\"font:400 12px/1.4 var(--font-sans);color:rgba(255,255,255,0.66)\">{{ p.t }}<\u002Fdiv>\n              <\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-bottom:16px\">\n            <div style=\"padding:18px 20px;border-radius:8px;background:rgba(0,106,251,0.12);border:1px solid rgba(0,106,251,0.30)\">\n              <div style=\"font:600 10px/1 var(--font-sans);letter-spacing:0.10em;text-transform:uppercase;color:#7FE7FF;margin-bottom:10px\">{{ phaseName }} · вопросы к тебе<\u002Fdiv>\n              <div style=\"font:400 15px/1.5 var(--font-sans);color:rgba(255,255,255,0.82)\">{{ phaseAsk }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"padding:18px 20px;border-radius:8px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.12)\">\n              <div style=\"font:600 10px/1 var(--font-sans);letter-spacing:0.10em;text-transform:uppercase;color:rgba(255,255,255,0.45);margin-bottom:10px\">{{ phaseName }} · работа сама<\u002Fdiv>\n              <div style=\"font:400 15px/1.5 var(--font-sans);color:rgba(255,255,255,0.82)\">{{ phaseDoes }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"padding:20px 22px;border-radius:8px;border:1px solid rgba(127,231,255,0.28);background:rgba(1,43,158,0.28)\">\n            <div style=\"font:500 clamp(16px,1.5vw,21px)/1.3 var(--font-sans);letter-spacing:-0.02em;color:#fff\">Терминал не понадобится. Инсталлер говорит словами и показывает прогресс.<\u002Fdiv>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ deep }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top:16px;padding:22px 24px;border-radius:8px;border:1px solid rgba(127,231,255,0.22);background:linear-gradient(180deg, rgba(1,43,158,0.30) 0%, rgba(15,23,36,0.6) 100%)\">\n              <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:#7FE7FF;margin-bottom:12px\">Подробно · под капотом фаз<\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;font:400 14px/1.55 var(--font-sans);color:rgba(255,255,255,0.68)\">\n                <div><b style=\"color:#fff;font-weight:600\">Техническая фаза.<\u002Fb> Проверка окружения, установка зависимостей, регистрация движка в Claude Desktop — с резервной копией конфигурации перед изменением.<\u002Fdiv>\n                <div><b style=\"color:#fff;font-weight:600\">Первичная индексация и смоук-тест.<\u002Fb> После установки система индексирует то, что уже есть, и сама себя проверяет: поиск отвечает, факты поднимаются, генерация доходит до конца.<\u002Fdiv>\n                <div><b style=\"color:#fff;font-weight:600\">Журнал установки.<\u002Fb> Каждый шаг фиксируется: можно прерваться на любой фазе и продолжить с места остановки, а не начинать заново.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- 23 · Три шага -->\n      <section data-screen-label=\"23 Три шага\" style=\"flex:0 0 100%;height:100%;overflow-y:auto;overflow-x:hidden\">\n        <div style=\"max-width:1240px;margin:0 auto;padding:clamp(24px,3.2vh,44px) clamp(26px,4vw,64px) 72px\">\n          <div style=\"font:600 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:#7FE7FF;margin-bottom:14px\">Акт IV · глава 23<\u002Fdiv>\n          <h2 style=\"margin:0 0 20px;font:500 clamp(28px,3.4vw,48px)/1.07 var(--font-sans);letter-spacing:-0.03em;color:#fff\">Три шага<\u002Fh2>\n\n          <div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:16px\">\n            <div style=\"padding:22px;border-radius:8px;border:1px solid rgba(255,255,255,0.12);background:#0F1724\">\n              <div style=\"font:500 clamp(26px,2.4vw,34px)/1 var(--font-sans);letter-spacing:-0.03em;color:rgba(127,231,255,0.9);margin-bottom:14px\">1<\u002Fdiv>\n              <div style=\"font:600 clamp(15px,1.3vw,18px)/1.3 var(--font-sans);color:#fff;margin-bottom:10px\">Скачай архив (DT Starter Kit)<\u002Fdiv>\n              <code style=\"display:inline-block;padding:7px 12px;border-radius:8px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);font:400 12px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:#7FE7FF\">{{ kitUrl }}<\u002Fcode>\n            <\u002Fdiv>\n            <div style=\"padding:22px;border-radius:8px;border:1px solid rgba(255,255,255,0.12);background:#0F1724\">\n              <div style=\"font:500 clamp(26px,2.4vw,34px)/1 var(--font-sans);letter-spacing:-0.03em;color:rgba(127,231,255,0.9);margin-bottom:14px\">2<\u002Fdiv>\n              <div style=\"font:600 clamp(15px,1.3vw,18px)/1.3 var(--font-sans);color:#fff;margin-bottom:10px\">Подключи папку как проект в Claude Desktop<\u002Fdiv>\n              <div style=\"font:400 14px/1.5 var(--font-sans);color:rgba(255,255,255,0.62)\">Распакуй архив и добавь папку проектом — двойник увидит сво
